  <script>
    (function () {
      var DUR = 11.27;
      var ID = "05-style";
      var CH = 14.4; // JetBrains Mono 24px advance
      var FS = 24, CW = 0.6, X0 = 0;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // scroll the code: line numbers and lines move together (0.6s power3.inOut)
      function scrollRows(lnsSel, linesSel, rows, at) {
        tl.to([lnsSel, linesSel], { y: -34 * rows, duration: 0.6, ease: "power3.inOut" }, at);
      }
      // an inserted row: the rows below slide down into place, its line number fades in
      function openRow(belowSel, lnSel, at) {
        tl.to(belowSel, { y: 0, duration: 0.35, ease: "power3.out" }, at);
        if (lnSel) tl.to(lnSel, { opacity: 1, duration: 0.35, ease: "power1.out" }, at);
      }
      // the standard entrance: kicker, panel and phone
      function intro(p) {
        tl.fromTo(p + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo(p + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        if (q(p + "-panel")) tl.fromTo(p + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo(p + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }
      // outline of a View in the phone: show (gray dashed) / focus (blue) / unfocus
      function olShow(sel, at) { tl.to(sel, { opacity: 1, duration: 0.35, ease: "power1.out" }, at); }
      function olBlue(sel, at) { tl.to(sel + " rect", { stroke: "#3178C6", strokeWidth: 1.8, duration: 0.35, ease: "power1.out" }, at); }
      function olGray(sel, at) { tl.to(sel + " rect", { stroke: "#94A3B8", strokeWidth: 1.1, duration: 0.35, ease: "power1.inOut" }, at); }

      function rows(a, b) { var s = []; for (var i = a; i <= b; i++) s.push("#f05-r" + i, "#f05-n" + i); return s; }

      // ---- 0.0-1.9: kicker, panel and phone in; "style prop" (0.32): wash; "View" (1.68): the box's outline ----
      intro("#f05");
      tl.set(["#f05-wA1", "#f05-wA2", "#f05-wB1", "#f05-wB2", "#f05-wB3", "#f05-wB4", "#f05-wB5"], { y: -34 }, 0);
      // rows outside the 18-row window stay hidden
      tl.set(rows(19, 22), { opacity: 0 }, 0);
      washOn("#f05-hl7", 0.32);
      olShow("#f05-ol-box", 1.68);
      olBlue("#f05-ol-box", 1.68);

      // ---- 1.9-3.6: scroll to the box style; "achtergrondkleur" (2.32): backgroundColor ----
      washOff("#f05-hl7", 2.0);
      scrollRows("#f05-lns", "#f05-lines", 5, 2.0);
      tl.to(rows(1, 5), { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 2.0);
      tl.to(rows(19, 22), { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.2);
      openRow("#f05-wB1", "#f05-n23", 2.32);
      var e = typeLine("#f05-lB1", "#f05-cB1", [
        { t: "backgroundColor: " }, { t: "\"lightblue\"", c: "ts-str" }, { t: "," }
      ], 8, 2.42, 0.02).end;
      tl.to("#f05-box", { backgroundColor: "lightblue", duration: 0.3, ease: "power1.out" }, e);
      tl.to("#f05-ol-box", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, e);

      // ---- 3.6-4.5: "rand" (3.68): borderWidth ----
      scrollRows("#f05-lns", "#f05-lines", 9, 3.68);
      tl.to(rows(6, 9), { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 3.68);
      openRow("#f05-wB2", "#f05-n24", 3.68);
      e = typeLine("#f05-lB2", "#f05-cB2", [
        { t: "borderWidth: " }, { t: "2", c: "ts-fn" }, { t: "," }
      ], 8, 3.8, 0.03).end;
      tl.to("#f05-box", { borderWidth: 2, duration: 0.3, ease: "power1.out" }, e);

      // ---- 4.5-5.3: "padding" (4.56) ----
      openRow("#f05-wB3", "#f05-n25", 4.56);
      e = typeLine("#f05-lB3", "#f05-cB3", [
        { t: "padding: " }, { t: "16", c: "ts-fn" }, { t: "," }
      ], 8, 4.64, 0.03).end;
      tl.to("#f05-box", { padding: 16, duration: 0.3, ease: "power3.out" }, e);

      // ---- 5.3-6.7: "vaste grootte" (5.36 / 5.72): width and height ----
      openRow("#f05-wB4", "#f05-n26", 5.36);
      e = typeLine("#f05-lB4", "#f05-cB4", [
        { t: "width: " }, { t: "150", c: "ts-fn" }, { t: "," }
      ], 8, 5.44, 0.025).end;
      tl.to("#f05-box", { width: 150, duration: 0.3, ease: "power3.out" }, e);
      openRow("#f05-wB5", "#f05-n27", 5.76);
      e = typeLine("#f05-lB5", "#f05-cB5", [
        { t: "height: " }, { t: "100", c: "ts-fn" }, { t: "," }
      ], 8, 5.84, 0.025).end;
      tl.to("#f05-box", { height: 100, duration: 0.3, ease: "power3.out" }, e);

      // ---- 6.7-8.8: "container" (7.52): scroll up to the container style, wash, outline of the full screen ----
      scrollRows("#f05-lns", "#f05-lines", 11, 7.52);
      tl.to(rows(10, 11), { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 7.52);
      washOn("#f05-hl15", 7.52);
      olShow("#f05-ol-cont", 7.52);
      olBlue("#f05-ol-cont", 7.52);

      // ---- 8.8-end: "in het midden" (8.84 / 9.20): alignItems and justifyContent; the phone follows each one ----
      openRow("#f05-wA1", "#f05-n28", 8.84);
      e = typeLine("#f05-lA1", "#f05-cA1", [
        { t: "alignItems: " }, { t: "\"center\"", c: "ts-str" }, { t: "," }
      ], 8, 8.94, 0.02).end;
      var A = q("#f05-box"), B = q("#f05-boxB"), C = q("#f05-boxC");
      tl.to("#f05-box", { x: B.offsetLeft - A.offsetLeft, y: B.offsetTop - A.offsetTop, duration: 0.6, ease: "power3.inOut" }, e);
      openRow("#f05-wA2", "#f05-n29", e + 0.06);
      e = typeLine("#f05-lA2", "#f05-cA2", [
        { t: "justifyContent: " }, { t: "\"center\"", c: "ts-str" }, { t: "," }
      ], 8, e + 0.16, 0.02).end;
      tl.to("#f05-box", { x: C.offsetLeft - A.offsetLeft, y: C.offsetTop - A.offsetTop, duration: 0.6, ease: "power3.inOut" }, e);
      washOff("#f05-hl15", e + 0.4);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines[ID] = tl;
    })();
  </script>
