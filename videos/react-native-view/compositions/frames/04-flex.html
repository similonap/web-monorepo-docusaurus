          <text class="f04-web-prop" id="f04-web-prop" x="28" y="192" style="opacity: 0;">flexDirection: "row"</text>
        </svg>
      </div>

      <!-- phone: the app mirrors the code -->
      <div class="ph-body" id="f04-phone">
        <div class="ph-speaker"></div>
        <div class="ph-screen">
          <div class="ph-app">
            <div class="ph-status"><span>9:41</span><span class="ph-status-icons"><span class="ph-sig"><i style="height:3px"></i><i style="height:5px"></i><i style="height:8px"></i></span><span class="ph-batt"></span></span></div>
            <div class="rn-root" id="f04-app" style="padding-top: 24px;">
              <svg class="ph-ol" id="f04-ol-cont" style="opacity: 0;"><rect></rect></svg>
              <div class="rn-view" id="f04-b1" style="width: 80px; height: 80px; background-color: lightblue;"></div>
              <div class="rn-view" id="f04-b2" style="width: 80px; height: 80px; background-color: skyblue;"></div>
              <div class="rn-view" id="f04-b3" style="width: 80px; height: 80px; background-color: steelblue;"></div>
            </div>
          </div>
          <svg class="ph-svg" viewBox="0 0 316 650" aria-hidden="true">
            <rect class="ph-mark" id="f04-mark" x="0" y="0" width="10" height="10" style="opacity: 0;"></rect>
            <!-- main axis: column (down), drawn in at "column" -->
            <line class="ph-main" id="f04-mc-line" x1="158" y1="60" x2="158" y2="60" style="opacity: 0;"></line>
            <path class="ph-main-head" id="f04-mc-head" d="M158 626 L150 610 L166 610 Z" style="opacity: 0;"></path>
            <text class="ph-lbl ph-lbl--main" id="f04-mc-l1" x="170" y="590" style="opacity: 0;">main axis</text>
            <text class="ph-lbl ph-prop ph-prop--main" id="f04-mc-l2" x="170" y="609" style="opacity: 0;">column</text>
          </svg>
        </div>
        <div class="ph-home"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 14.07;
      var ID = "04-flex";
      var CH = 14.4; // JetBrains Mono 24px advance
      var FS = 24, CW = 0.6, X0 = 0;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // scroll the code: line numbers and lines move together (0.6s power3.inOut)
      function scrollRows(lnsSel, linesSel, rows, at) {
        tl.to([lnsSel, linesSel], { y: -34 * rows, duration: 0.6, ease: "power3.inOut" }, at);
      }
      // an inserted row: the rows below slide down into place, its line number fades in
      function openRow(belowSel, lnSel, at) {
        tl.to(belowSel, { y: 0, duration: 0.35, ease: "power3.out" }, at);
        if (lnSel) tl.to(lnSel, { opacity: 1, duration: 0.35, ease: "power1.out" }, at);
      }
      // the standard entrance: kicker, panel and phone
      function intro(p) {
        tl.fromTo(p + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo(p + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        if (q(p + "-panel")) tl.fromTo(p + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo(p + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }
      // outline of a View in the phone: show (gray dashed) / focus (blue) / unfocus
      function olShow(sel, at) { tl.to(sel, { opacity: 1, duration: 0.35, ease: "power1.out" }, at); }
      function olBlue(sel, at) { tl.to(sel + " rect", { stroke: "#3178C6", strokeWidth: 1.8, duration: 0.35, ease: "power1.out" }, at); }
      function olGray(sel, at) { tl.to(sel + " rect", { stroke: "#94A3B8", strokeWidth: 1.1, duration: 0.35, ease: "power1.inOut" }, at); }

      // ---- 0.0-1.8: kicker, panel and phone in; the comment rows are not there yet ----
      intro("#f04");
      tl.set(["#f04-belowA", "#f04-belowB"], { y: -34 }, 0);
      // rows outside the 18-row window stay hidden: "});" (row 19 at the start) and, after each scroll, the rows above
      var OUT19 = ["#f04-belowB > .fx-row:nth-child(4)", "#f04-lns > div:nth-child(19)"];
      tl.set(OUT19, { opacity: 0 }, 0);

      // ---- 1.8-4.5: "elke View" (1.84): the container; "flex container" (3.20): its outline turns blue ----
      washOn("#f04-hl6, #f04-hl10", 1.84);
      olShow("#f04-ol-cont", 1.84);
      olBlue("#f04-ol-cont", 3.2);

      // ---- 4.5-8.1: "Display flex" (4.56): scroll down 2 rows, a comment row opens and types ----
      washOff("#f04-hl6, #f04-hl10", 4.56);
      scrollRows("#f04-lns", "#f04-lines", 2, 4.56);
      openRow("#f04-belowA", "#f04-ln20", 4.6);
      tl.to(["#f04-lines > .fx-row:nth-child(1)", "#f04-lines > .fx-row:nth-child(2)", "#f04-lns > div:nth-child(1)", "#f04-lns > div:nth-child(2)"], { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 4.56);
      tl.to(OUT19, { opacity: 1, duration: 0.35, ease: "power1.out" }, 4.8);
      typeLine("#f04-lA", "#f04-cA", [
        { id: "f04-hlA", parts: [{ t: "// display: \"flex\" niet nodig", c: "f04-comment" }] }
      ], 8, 4.75, 0.025);
      washOn("#f04-hlA", 5.84);
      washOff("#f04-hlA", 7.2);

      // ---- 8.1-9.0: "column" (8.16): one more row, the default direction; the main axis draws down ----
      scrollRows("#f04-lns", "#f04-lines", 3, 8.16);
      openRow("#f04-belowB", "#f04-ln21", 8.16);
      tl.to(["#f04-lines > .fx-row:nth-child(3)", "#f04-lns > div:nth-child(3)"], { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 8.16);
      typeLine("#f04-lB", "#f04-cB", [
        { id: "f04-hlB", parts: [{ t: "// flexDirection: \"column\" (standaard)", c: "f04-comment" }] }
      ], 8, 8.3, 0.02);
      tl.set("#f04-mc-line", { opacity: 1 }, 8.16);
      tl.to("#f04-mc-line", { attr: { y2: 610 }, duration: 0.6, ease: "power3.out" }, 8.16);
      tl.to(["#f04-mc-head", "#f04-mc-l1", "#f04-mc-l2"], { opacity: 1, duration: 0.3, ease: "power1.out" }, 8.66);

      // ---- 9.0-11.3: "kinderen" (9.08): the three children; "onder elkaar" (10.00): one mark around them ----
      washOn("#f04-hl7, #f04-hl8, #f04-hl9", 9.08);
      var b1 = q("#f04-b1"), b3 = q("#f04-b3"), K = 1.4;
      tl.set("#f04-mark", { attr: {
        x: b1.offsetLeft * K + 1.5, y: b1.offsetTop * K + 1.5,
        width: b1.offsetWidth * K - 3, height: (b3.offsetTop + b3.offsetHeight - b1.offsetTop) * K - 3
      } }, 0);
      tl.to("#f04-mark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 10.0);

      // ---- 11.3-end: "naast elkaar" (11.36): the web for comparison; "web" (12.64): its label ----
      washOff("#f04-hl7, #f04-hl8, #f04-hl9", 11.36);
      tl.fromTo("#f04-web", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 11.36);
      tl.fromTo(["#f04-web-lbl", "#f04-web-prop"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 12.64);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
