        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // scroll the code: line numbers and lines move together (0.6s power3.inOut)
      function scrollRows(lnsSel, linesSel, rows, at) {
        tl.to([lnsSel, linesSel], { y: -34 * rows, duration: 0.6, ease: "power3.inOut" }, at);
      }
      // an inserted row: the rows below slide down into place, its line number fades in
      function openRow(belowSel, lnSel, at) {
        tl.to(belowSel, { y: 0, duration: 0.35, ease: "power3.out" }, at);
        if (lnSel) tl.to(lnSel, { opacity: 1, duration: 0.35, ease: "power1.out" }, at);
      }
      // the standard entrance: kicker, panel and phone
      function intro(p) {
        tl.fromTo(p + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo(p + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        if (q(p + "-panel")) tl.fromTo(p + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo(p + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }
      // outline of a View in the phone: show (gray dashed) / focus (blue) / unfocus
      function olShow(sel, at) { tl.to(sel, { opacity: 1, duration: 0.35, ease: "power1.out" }, at); }
      function olBlue(sel, at) { tl.to(sel + " rect", { stroke: "#3178C6", strokeWidth: 1.8, duration: 0.35, ease: "power1.out" }, at); }
      function olGray(sel, at) { tl.to(sel + " rect", { stroke: "#94A3B8", strokeWidth: 1.1, duration: 0.35, ease: "power1.inOut" }, at); }

      // ---- 0.0-2.0: kicker; "React Native" (0.32): the phone with a small app ----
      tl.fromTo("#f01-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f01-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f01-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.32);

      // ---- 2.0-7.7: "HTML" (2.00): label; "div" (3.84), "p" (4.64), "button" (5.60): chip in, thin red strike ----
      tl.fromTo("#f01-lbl-html", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.0);
      function chipIn(sel, at) {
        tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, at);
      }
      [["#f01-w1", "#f01-s1", 3.84], ["#f01-w2", "#f01-s2", 4.64], ["#f01-w3", "#f01-s3", 5.6]].forEach(function (c) {
        chipIn(c[0], c[2]);
        tl.fromTo(c[1], { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, c[2] + 0.25);
      });

      // ---- 7.7-10.3: "core components" (7.76 / 8.28): the web chips step back, core components in ----
      tl.to(["#f01-lbl-html", "#f01-web"], { opacity: 0.35, duration: 0.4, ease: "power1.inOut" }, 7.76);
      tl.fromTo("#f01-lbl-core", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.76);
      ["#f01-c1", "#f01-c2", "#f01-c3", "#f01-c4"].forEach(function (s, i) { chipIn(s, 8.28 + i * 0.12); });

      // ---- 10.3-end: "View" (10.32): hero, its chip turns blue, the Views in the phone show their outline ----
      tl.fromTo("#f01-hero", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 10.32);
      tl.fromTo("#f01-hbar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 10.6);
      tl.to("#f01-c1", { backgroundColor: "#EAF2FB", borderColor: "#3178C6", duration: 0.3, ease: "power1.out" }, 10.32);
      var OLS = ["#f01-ol-head", "#f01-ol-body", "#f01-ol-c1", "#f01-ol-c2"];
      OLS.forEach(function (s) { olBlue(s, 10.32); olShow(s, 10.32); });

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
