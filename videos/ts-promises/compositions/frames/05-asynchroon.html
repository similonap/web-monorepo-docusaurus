        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }
      function outLine(sel, at) { tl.fromTo(sel, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at); }

      // start state: console lines hidden (CSS), chip shows pending
      gsap.set("#f05a-val-fulfilled", { y: 12, opacity: 0 });

      // ---- 0.0-2.3: kicker; "volgorde" (0.56) hold ----
      tl.fromTo("#f05a-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f05a-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);

      // ---- 2.3-5.4: "console log" (2.40) row 11 types; "onder de then" (3.04 / 3.52) ----
      typeLine("#f05a-l11", "#f05a-c11", [
        { id: "f05a-hl-r11", parts: [
          { t: "console" },
          { t: ".", c: "ts-punct" },
          { t: "log", c: "ts-fn" },
          { t: "(", c: "ts-punct" },
          { t: "\"Na de then\"", c: "ts-str" },
          { t: ");", c: "ts-punct" }
        ] }
      ], 0, 2.4, 0.03);
      washOn("#f05a-hl-r11", 3.04);
      washOn("#f05a-hl-then", 3.52);
      washOff(["#f05a-hl-r11", "#f05a-hl-then"], 5.3);

      // ---- 5.4-9.6: "eerst" (5.48) output 1; "wacht niet" (6.84); "promise" (7.92) ----
      outLine("#f05a-out1", 5.48);
      washOn("#f05a-hl-r11", 6.84);
      washOff("#f05a-hl-r11", 8.4);
      tl.fromTo("#f05a-chipmark", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 7.92);
      tl.to("#f05a-chipmark", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 9.4);

      // ---- 9.6-end: "later" (10.36) output 2 + fulfilled + wash rows 7-9 ----
      outLine("#f05a-out2", 10.36);
      tl.to("#f05a-val-pending", { y: -12, opacity: 0, duration: 0.25, ease: "power2.in" }, 10.36);
      tl.to("#f05a-val-fulfilled", { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, 10.48);
      tl.to("#f05a-chip", { backgroundColor: "#EAF2FB", borderColor: "#3178C6", duration: 0.3, ease: "power1.out" }, 10.36);
      washOn(["#f05a-hl-r7", "#f05a-hl-r8", "#f05a-hl-r9"], 10.36);
      washOff(["#f05a-hl-r7", "#f05a-hl-r8", "#f05a-hl-r9"], 11.8);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["05-asynchroon"] = tl;
    })();
  </script>
