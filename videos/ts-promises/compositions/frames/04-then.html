              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // initial states (rows 1-5, console card and pending chip are present at t = 0)
      gsap.set(["#f04t-ln6", "#f04t-ln7", "#f04t-ln8", "#f04t-ln9"], { opacity: 0 });

      gsap.set("#f04t-v-ful", { opacity: 0, y: 10 });
      gsap.set("#f04t-out1", { opacity: 0, x: -8 });

      // ---- Scene 1 (0.0-3.4): kicker; "then" (2.24) rows 7-9 type; wash on then ----
      tl.fromTo("#f04t-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f04t-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);

      tl.fromTo(["#f04t-ln6", "#f04t-ln7"], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.14);
      var r7 = typeLine("#f04t-l7", "#f04t-c7", [
        { t: "promise" },

        { id: "f04t-hl-then", parts: [{ t: "then", c: "ts-fn" }] },
        { t: "((", c: "ts-punct" },
        { id: "f04t-hl-res1", parts: [{ t: "result" }] },
        { t: ": " },
        { t: "number", c: "ts-type" },
        { t: ")", c: "ts-punct" },
        { t: " " },
        { t: "=>", c: "ts-punct" },
        { t: " " },

      ], 0, 2.24, 0.02);
      washOn("#f04t-hl-then", Math.max(2.4, r7.marks["f04t-hl-then"] + 0.05));

      tl.to("#f04t-ln8", { opacity: 1, duration: 0.15, ease: "power1.out" }, r7.end - 0.05);
      var r8 = typeLine("#f04t-l8", "#f04t-c8", [
        { t: "    " },
        { t: "console" },
        { t: ".", c: "ts-punct" },
        { t: "log", c: "ts-fn" },

        { id: "f04t-hl-res2", parts: [{ t: "result" }] },

      ], 0, r7.end + 0.02, 0.018, 0.03);

      tl.to("#f04t-ln9", { opacity: 1, duration: 0.15, ease: "power1.out" }, r8.end - 0.05);
      typeLine("#f04t-l9", "#f04t-c9", [
        { t: "});", c: "ts-punct" }
      ], 0, r8.end + 0.02, 0.018, 0.03);
      washOff("#f04t-hl-then", 3.3);

      // ---- Scene 2 (3.4-7.9): "functie" (3.68) wash on the callback; "klaar" (6.84) fulfilled; 7.00 console 4 ----
      washOn("#f04t-w7", 3.68);
      washOn("#f04t-w8", 3.68);
      washOff("#f04t-w7", 7.3);
      washOff("#f04t-w8", 7.3);

      // state chip swap pending -> fulfilled (blue look)
      tl.to("#f04t-v-pend", { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, 6.84);
      tl.to("#f04t-v-ful", { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 6.84 + 0.12);
      tl.to("#f04t-state", { backgroundColor: "#EAF2FB", borderColor: "#3178C6", duration: 0.35, ease: "power3.out" }, 6.84);

      // ---- Scene 3 (7.9-end): "Result" (8.00) both results; "number" (9.28) mark; "aanmaken" (11.12) <number> ----
      washOn("#f04t-hl-res1", 8.0);
