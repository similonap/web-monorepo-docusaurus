      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="12-notfound"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // hidden-until-cued elements
      gsap.set(["#f12n-label", "#f12n-card", "#f12n-err", "#f12n-outline", "#f12n-mark",
        "#f12n-header", "#f12n-nav", "#f12n-content", "#f12n-footer",
        "#f12n-m1", "#f12n-m2", "#f12n-m3"], { opacity: 0 });

      // ---- 0.0-5.1: kicker; panel in at 0.1 (static lines); "iemand surft" (0.80) card; "URL die niet bestaat" (1.52-2.72) path types ----
      tl.fromTo("#f12n-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f12n-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f12n-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);

      tl.fromTo("#f12n-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0.8);
      tl.fromTo("#f12n-card", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 0.8);

      // address path: per character, a small caret steps along (mono 18px = 10.8px per char)
      var pathChars = root.querySelectorAll("#f12n-path .ts-ch");
      var PSTART = 1.52, PPER = 0.092, ACW = 10.8;
      tl.set(pathChars, { opacity: 0 }, 0);
      tl.set("#f12n-acaret", { opacity: 1, x: 0 }, PSTART - 0.1);
      for (var i = 0; i < pathChars.length; i++) {
        tl.to(pathChars[i], { opacity: 1, duration: 0.05, ease: "power1.out" }, PSTART + i * PPER);
        tl.set("#f12n-acaret", { x: (i + 1) * ACW }, PSTART + i * PPER);
      }
      tl.set("#f12n-acaret", { opacity: 0 }, PSTART + pathChars.length * PPER + 0.1);

      // ---- 5.1-8.6: "standaard foutpagina" (5.76) error block; "gebruiksvriendelijk" (7.48) red outline ----
      tl.fromTo("#f12n-err", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 5.76);
      tl.fromTo("#f12n-outline", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 7.48);

      // ---- 8.6-12.4: outline fades (8.72); "child route" (9.52) line 5 types; "sterretje" (11.64) key box on "*" ----
      tl.to("#f12n-outline", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 8.72);
      typeLine("#f12n-l5", "#f12n-c5", [
        { t: "  " },
        { id: "f12n-hl-l5", parts: [
          { t: "{ path" },
          { t: ":", c: "ts-punct" },
          { t: " " },
          { t: "\"*\"", c: "ts-str" },
          { t: ", element" },
          { t: ":", c: "ts-punct" },
          { t: " " },
          { t: "<", c: "ts-punct" },
          { t: "PageNotFound", c: "ts-fn" },
          { t: " " },
          { t: "/>", c: "ts-punct" },
          { t: " }," }
        ] }
      ], 0, 9.52, 0.035);
      tl.fromTo("#f12n-mark", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 11.64);

      // ---- 12.4-15.6: "matcht alles" (13.12) rows 1-2; "geen betere route bestaat" (14.80) row 3 ----
      tl.fromTo(["#f12n-m1", "#f12n-m2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.1, immediateRender: false }, 13.12);
      tl.fromTo("#f12n-m3", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 14.8);

      // ---- 15.6-end: "child van Root" (16.80) layout in; "page not found" (18.40) content + wash line 5; "layout" (19.76) layout wash ----
      tl.to("#f12n-err", { opacity: 0, duration: 0.25, ease: "power2.out" }, 16.8);
      tl.fromTo(["#f12n-header", "#f12n-nav", "#f12n-footer"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.08, immediateRender: false }, 16.8);
      tl.fromTo("#f12n-content", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 18.4);
      washOn("#f12n-hl-l5", 18.4);
      tl.fromTo(["#f12n-w-header", "#f12n-w-nav", "#f12n-w-footer"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, 19.76);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["12-notfound"] = tl;
    })();
  </script>
</template>
