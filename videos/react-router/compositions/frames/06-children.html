      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      var EL = function (name) {

      };
      var pop = function (sel, at) {
        tl.fromTo(sel, { opacity: 0, y: 6, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, at);

      washOn("#f06c-hl-router", 0.32);

      // ---- 1.1-3.4: "Root" (1.20): lines 2, 3, 4, 10; Root node; "route op slash" (2.48) ----
      var P = 0.014;
      var e = typeLine("#f06c-l2", "#f06c-c2", [{ t: "  {" }], 0, 1.2, P);
      var l3 = typeLine("#f06c-l3", "#f06c-c3", [
        { t: "    " },
        { id: "f06c-hl-path", parts: [{ t: "path: " }, { t: "\"/\"", c: "ts-str" }] },
        { t: "," }
      ], 0, e.end + 0.02, P, 0.03);
      var l4 = typeLine("#f06c-l4", "#f06c-c4", [
        { t: "    " },
        { id: "f06c-hl-el", parts: [{ t: "element: " }].concat(EL("Root")) },
        { t: "," }
      ], 0, l3.end + 0.02, P, 0.03);
      typeLine("#f06c-l10", "#f06c-c10", [{ t: "  }," }], 0, l4.end + 0.02, P, 0.03);

      tl.fromTo("#f06c-root", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.2);

      washOff("#f06c-hl-router", 2.48);
      washOn("#f06c-hl-path", 2.48);
      pop("#f06c-roottag", 2.48);

      // ---- 3.4-5.5: "children" (4.56): lines 5, 9, then 6, 7, 8; connectors + child nodes (4.80) ----
      var PC = 0.01;
      var l5 = typeLine("#f06c-l5", "#f06c-c5", [
        { t: "    " },
        { id: "f06c-hl-children", parts: [{ t: "children" }] },
        { t: ": [" }
      ], 0, 4.56, PC);
      e = typeLine("#f06c-l9", "#f06c-c9", [{ t: "    ]," }], 0, l5.end + 0.02, PC, 0.03);
      e = typeLine("#f06c-l6", "#f06c-c6", [
        { t: "      { " },
        { id: "f06c-hl-index", parts: [{ t: "index: " }, { t: "true", c: "ts-fn" }] },

      ].concat(EL("Home"), [{ t: " }," }]), 0, e.end + 0.02, PC, 0.03);

        { t: "      { path: " },
        { id: "f06c-hl-about", parts: [{ t: "\"about\"", c: "ts-str" }] },
        { t: ", element: " }
      ].concat(EL("About"), [{ t: " }," }]), 0, e.end + 0.02, PC, 0.03);
      typeLine("#f06c-l8", "#f06c-c8", [
        { t: "      { path: " },
        { id: "f06c-hl-contact", parts: [{ t: "\"contact\"", c: "ts-str" }] },
        { t: ", element: " }
      ].concat(EL("Contact"), [{ t: " }," }]), 0, e.end + 0.02, PC, 0.03);

      washOff("#f06c-hl-path", 4.56);

      tl.fromTo("#f06c-w0", { strokeDashoffset: 46 }, { strokeDashoffset: 0, duration: 0.18, ease: "power1.in" }, 4.8);

      var APX = 10.8; // 18px mono advance

      tl.fromTo(["#f06c-outlet", "#f06c-otag"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 19.68);

      tl.fromTo("#f06c-page", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 20.32);
      washOff("#f06c-hl-el", 20.32);
      washOn("#f06c-lw7", 20.32);

      tl.set({}, {}, DUR);
      window.__timelines["06-children"] = tl;
