      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }

        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }

      // hidden-until-cued elements
      gsap.set(["#f13e-mark", "#f13e-bad", "#f13e-badtag", "#f13e-errview", "#f13e-errline", "#f13e-chip", "#f13e-row404"], { opacity: 0 });

      washOn("#f13e-hl-err", 4.08);
      tl.fromTo("#f13e-mark", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 4.08);

      // ---- 5.0-8.0: "in plaats van" (6.08): card body swaps to the ErrorPage view ----
      tl.to("#f13e-body", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 6.08);
      tl.fromTo("#f13e-errview", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 6.2);

      washOff("#f13e-hl-root", 8.44);
      var P = 0.012;
      var e = typeLine("#f13e-l1", "#f13e-c1", [
        { t: "const", c: "ts-kw" },
        { t: " " },
        { t: "ErrorPage", c: "ts-fn" },
        { t: " = () " },
        { t: "=>", c: "ts-kw" },
        { t: " {" }
      ], 0, 8.44, P);
      e = typeLine("#f13e-l2", "#f13e-c2", [
        { t: "  " },

        { t: "};" }

      washOn("#f13e-hl-use", 9.68);

      tl.fromTo("#f13e-chip", { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 11.2);

      // ---- 12.1-18.0: "Is route error response": lines 4, 5, 6 type from 12.16; wash at 13.12 ----
      washOff("#f13e-hl-use", 12.16);
      e = typeLine("#f13e-l4", "#f13e-c4", [

        { t: "if", c: "ts-kw" },

        { id: "f13e-hl-isre", parts: [

      e = typeLine("#f13e-l5", "#f13e-c5", [

      washOn("#f13e-hl-isre", 13.12);

      // "vier nul vier" (17.20): row 404 + fout van de router
      tl.fromTo("#f13e-row404", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 17.2);

      washOff("#f13e-hl-isre", 19.12);
      washOn("#f13e-hl-status", 19.12);
