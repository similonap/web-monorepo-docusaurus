  <script>
    (function () {
      var DUR = 16.31;
      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 26;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="02-json-interface"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // start states: only the kicker is there until the voice names the rest
      gsap.set("#f02-chip", { opacity: 0, y: 10 });
      gsap.set(["#f02-json", "#f02-iface"], { opacity: 0, y: 16 });

      // ---- Shot 1 (0.0-3.1): kicker; "lijst" (1.52) request chip; "posts" (2.08) wash on /posts ----
      tl.fromTo("#f02-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f02-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);

      tl.to("#f02-chip", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.52);
      washOn("#f02-hl-posts", 2.08);
      washOff("#f02-hl-posts", 3.1);

      // ---- Shot 2 (3.1-7.1): "JSON" (4.48) panel; "array" (5.52) [ and ]; "objecten" (6.36) rows 2-7 ----
      tl.to("#f02-json", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.48);
      washOn(["#f02-hl-open", "#f02-hl-close"], 5.52);
      washOn("#f02-wobj", 6.36);
      washOff(["#f02-hl-open", "#f02-hl-close", "#f02-wobj"], 7.1);

      // ---- Shot 3 (7.1-end): "interface" (8.88) panel + rows 1 and 6 (8.9-9.5) ----
      tl.to("#f02-iface", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.88);
      var P1 = 0.033;
      var r = typeLine("#f02-i1", "#f02-ic1", [
        { t: "interface", c: "ts-kw" },
        { t: " " },
        { t: "Post", c: "ts-type" },
        { t: " " },
        { t: "{", c: "ts-punct" }
      ], 0, 8.9, P1, 0.02);
      typeLine("#f02-i6", "#f02-ic6", [
        { t: "}", c: "ts-punct" }
      ], 0, r.end + 0.02, P1, 0.02);

      var PN = 0.03;   // property names
      var PT = 0.033;  // `: number;` / `: string;` (9 chars in 0.3s)
      var LEAD = 0.05;

      // "user id" (9.76): `userId` on row 2 + wash on the JSON key "userId" (row 3)
      typeLine("#f02-i2", "#f02-ic2", [{ t: "userId" }], 4, 9.76, PN, LEAD);
      washOn("#f02-hl-k1", 9.76);

      // "id" (11.12): `id` on row 3 + wash on the JSON key "id" (row 4)
      typeLine("#f02-i3", "#f02-ic3", [{ t: "id" }], 4, 11.12, PN, LEAD);
      washOn("#f02-hl-k2", 11.12);

      // "number" (12.28): `: number;` on rows 2 and 3 together + wash on the two JSON values 1
      var NUMBER = [{ t: ": " }, { t: "number", c: "ts-type" }, { t: ";", c: "ts-punct" }];
      typeLine("#f02-i2", "#f02-ic2", NUMBER, 10, 12.28, PT, LEAD);
      typeLine("#f02-i3", "#f02-ic3", NUMBER, 6, 12.28, PT, LEAD);
      washOn(["#f02-hl-v1", "#f02-hl-v2"], 12.28);

      // "title" (13.04): `title` on row 4 + wash on "title" (JSON row 5)
      typeLine("#f02-i4", "#f02-ic4", [{ t: "title" }], 4, 13.04, PN, LEAD);
      washOn("#f02-hl-k3", 13.04);

      // "body" (13.92): `body` on row 5 + wash on "body" (JSON row 6)
      typeLine("#f02-i5", "#f02-ic5", [{ t: "body" }], 4, 13.92, PN, LEAD);
      washOn("#f02-hl-k4", 13.92);

      // "string" (14.84): `: string;` on rows 4 and 5 together + wash on the two JSON string values
      var STRING = [{ t: ": " }, { t: "string", c: "ts-type" }, { t: ";", c: "ts-punct" }];
      typeLine("#f02-i4", "#f02-ic4", STRING, 9, 14.84, PT, LEAD);
      typeLine("#f02-i5", "#f02-ic5", STRING, 8, 14.84, PT, LEAD);
      washOn(["#f02-hl-v3", "#f02-hl-v4"], 14.84);

      // washes stay; hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["02-json-interface"] = tl;
    })();
