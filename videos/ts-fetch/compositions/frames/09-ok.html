      <div data-hf-id="hf-pupr" class="nc-node" id="f09-srv"><div data-hf-id="hf-2hgb" class="nc-node-role f09-stack"><span data-hf-id="hf-2ggn" id="f09-role-up">server</span><span data-hf-id="hf-bw6f" class="f09-dim" id="f09-role-down">server</span></div><div data-hf-id="hf-sf73" class="nc-node-sub f09-stack"><span data-hf-id="hf-zrn7" id="f09-sub-up">jsonplaceholder.typicode.com</span><span data-hf-id="hf-3lj4" class="f09-bad" id="f09-sub-down">onbereikbaar</span></div></div>
      <div data-hf-id="hf-uv2l" id="f09-srv-down"></div>

      <!-- chips row: status stays; frame 8's fulfilled chip and note leave; ok + the rule come -->
      <div data-hf-id="hf-uipu" class="ts-chip" id="f09-status"><span data-hf-id="hf-6h48" class="ts-chip-key f09-key">status</span><span data-hf-id="hf-wr0y" class="f09-bad">404</span></div>
      <div data-hf-id="hf-iw7c" class="ts-chip pc-state" id="f09-state2"><span data-hf-id="hf-2ovv" class="ts-chip-key f09-key">fetch(…)</span><span data-hf-id="hf-jxft" class="f09-valbox" style="width: 130px"><span data-hf-id="hf-2mnr" class="pc-val pc-val--fulfilled">fulfilled</span></span></div>
      <div data-hf-id="hf-q2zp" class="pc-note" id="f09-note404">een 404 is ook een antwoord</div>
      <div data-hf-id="hf-cxo4" class="ts-chip" id="f09-okchip"><span data-hf-id="hf-mlts" class="ts-chip-key f09-key">ok</span><span data-hf-id="hf-8zfx" class="f09-bad">false</span></div>
      <div data-hf-id="hf-fdw3" class="pc-note" id="f09-rule">enkel true bij 200 tot 299</div>
      <div data-hf-id="hf-kwt4" class="ts-mark ts-mark--wrong" id="f09-okwrong"></div>
      <div data-hf-id="hf-yvj7" class="ts-mark" id="f09-stmark"></div>

      <!-- console -->
      <div data-hf-id="hf-mryr" class="ts-label" id="f09-label">console</div>
      <div data-hf-id="hf-z14w" class="pc-console" id="f09-console"><div data-hf-id="hf-o2jl" class="f09-lines"><div data-hf-id="hf-7npq" class="pc-out" id="f09-out8">undefined</div></div><div data-hf-id="hf-iwol" class="f09-lines"><div data-hf-id="hf-ybwr" class="pc-out" id="f09-out9">Error: 404</div></div><div data-hf-id="hf-q8x6" class="ts-mark ts-mark--wrong" id="f09-wrong"></div></div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 16.63;
      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 24;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="09-ok"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        gsap.set(chars, { opacity: 0 });
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }
      function chipIn(sel, at) { tl.to(sel, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at); }
      function fadeIn(sel, at, d) { tl.to(sel, { opacity: 1, duration: d || 0.3, ease: "power2.out" }, at); }
      function fadeOut(sel, at, d) { tl.to(sel, { opacity: 0, duration: d || 0.3, ease: "power2.inOut" }, at); }
      function noteIn(sel, at) { tl.to(sel, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at); }
      function lineIn(sel, at) { tl.fromTo(sel, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at); }
      // swap: old text slides up 10px and fades, new text comes in from 10px below (0.25s each)
      function swap(oldSel, newSel, at) {
        tl.to(oldSel, { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, at);
        tl.fromTo(newSel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, at + 0.12);
      }
      // kicker text cross-fade (0.3s)
      function kickerSwap(at) {
        tl.to("#f09-kold", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
        tl.to("#f09-knew", { opacity: 1, duration: 0.3, ease: "power2.inOut" }, at);
      }
      // a packet travels over its wire: in at the sender (0.2s), x to the receiver, out as it arrives (0.2s)
      function travel(sel, dx, from, to, out) {
        tl.to(sel, { opacity: 1, duration: 0.2, ease: "power1.out" }, from);
        tl.to(sel, { x: dx, duration: to - from, ease: "power2.inOut" }, from);
        tl.to(sel, { opacity: 0, duration: 0.2, ease: "power1.in" }, out);
      }
      function serverDown(at) {
        tl.to("#f09-srv", { borderColor: "rgba(226, 232, 240, 0)", duration: 0.3, ease: "power2.inOut" }, at);
        tl.to(["#f09-role-up", "#f09-sub-up"], { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
        tl.to(["#f09-srv-down", "#f09-role-down", "#f09-sub-down"], { opacity: 1, duration: 0.3, ease: "power2.inOut" }, at);
      }
      function serverUp(at) {
        tl.to("#f09-srv", { borderColor: "#E2E8F0", duration: 0.3, ease: "power2.inOut" }, at);
        tl.to(["#f09-role-up", "#f09-sub-up"], { opacity: 1, duration: 0.3, ease: "power2.inOut" }, at);
        tl.to(["#f09-srv-down", "#f09-role-down", "#f09-sub-down"], { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
      }

      var CATCH = ["#f09-t7", "#f09-t8", "#f09-t9"];
      var MOVED = ["#f09-t5", "#f09-t6", "#f09-t7", "#f09-t8", "#f09-t9", "#f09-t10"];

      // initial state = end state of 08-404 (cut): the rows from `const post` on still sit one row
      // higher, the catch rows are dimmed, status + fulfilled chip + note, undefined with its red mark
      gsap.set("#f09-knew", { opacity: 0 });
      gsap.set(MOVED, { y: -36 });
      gsap.set(CATCH, { opacity: 0.35 });
      gsap.set(["#f09-n10", "#f09-ind4"], { opacity: 0 });
      gsap.set(["#f09-srv-down", "#f09-role-down", "#f09-sub-down"], { opacity: 0 });
      gsap.set(["#f09-out8", "#f09-note404"], { opacity: 1 });
      // what this frame brings
      gsap.set("#f09-okchip", { opacity: 0, y: 12 });
      gsap.set(["#f09-okwrong", "#f09-mark4", "#f09-stmark"], { opacity: 0 });
      gsap.set("#f09-rule", { y: 8 });

      // ---- Shot 1 (0.0-1.9): kicker -> response.ok; undefined + mark, the note and the fulfilled chip
      //      leave; the catch rows back to full ----
      kickerSwap(0.1);
      fadeOut(["#f09-out8", "#f09-wrong", "#f09-note404", "#f09-state2"], 0.1, 0.4);
      tl.to(CATCH, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0.1);

      // ---- Shot 2 (1.9-7.2): rows 4-9 move one row down (2.0); "Response punt ok" (2.32) the if types;
      //      "ok" (3.12) chip ok / false; "true" (4.48) the rule ----
      tl.to(MOVED, { y: 0, duration: 0.4, ease: "power3.inOut" }, 2.0);
      fadeIn("#f09-n10", 2.1);
      tl.set("#f09-ind4", { opacity: 1 }, 2.3);
      var a = typeLine("#f09-t4", "#f09-c4", [{ t: "if", c: "ts-kw" }, { t: " " }, { t: "(", c: "ts-punct" }, { t: "!response" }, { t: ".", c: "ts-punct" }, { t: "ok" }, { t: ")", c: "ts-punct" }], 8, 2.32, 0.05);
      chipIn("#f09-okchip", 3.12);
      noteIn("#f09-rule", 4.48);

      // ---- Shot 3 (7.2-10.3): "false" (8.08) red mark around the ok chip (off 8.7); "gooi" (8.80)
      //      the throw types; at 9.9 the blue box around the whole fix ----
      fadeIn("#f09-okwrong", 8.08);
      fadeOut("#f09-okwrong", 8.7);
      typeLine("#f09-t4", "#f09-c4", [{ t: " " }, { t: "throw", c: "ts-kw" }, { t: " " }, { t: "new", c: "ts-kw" }, { t: " " }, { t: "Error", c: "ts-type" }, { t: "(", c: "ts-punct" }, { t: "response" }, { t: ".", c: "ts-punct" }, { t: "status" }, { t: ".", c: "ts-punct" }, { t: "toString", c: "ts-fn" }, { t: "());", c: "ts-punct" }], a.col, 8.8, 0.02);
      fadeIn("#f09-mark4", 9.9);

      // ---- Shot 4 (10.3-12.2): "wel" (11.08) wash on the catch rows; "catch" (11.52) Error: 404 ----
      washOn("#f09-wcatch", 11.08);
      lineIn("#f09-out9", 11.52);
      fadeOut("#f09-mark4", 12.2);
      washOff("#f09-wcatch", 12.2);

      // ---- Shot 5 (12.2-end): "response" (13.76) wash on response.status; "status" (14.80) mark
      //      around the status chip; hold ----
      washOn("#f09-wstatus", 13.76);
      fadeIn("#f09-stmark", 14.8);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["09-ok"] = tl;
    })();
  </script>
