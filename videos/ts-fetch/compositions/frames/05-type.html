      // ---- type-on helper: the characters of a group are already in the DOM (one span each, in
      //      reading order, so a paused frame copies as normal code); they appear one by one from
      //      column `col` while the caret steps per char. A row can so be typed from the inside out. ----
      function typeLine(groupSel, caretSel, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var chars = Array.prototype.slice.call(q(groupSel).querySelectorAll(".ts-ch"));
        var caret = q(caretSel);
        var chPx = FS * CW;
        gsap.set(chars, { opacity: 0 });
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }
      function chipIn(sel, at) { tl.fromTo(sel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at); }
      function fadeUp(sel, at, y, d) { tl.fromTo(sel, { opacity: 0, y: y }, { opacity: 1, y: 0, duration: d || 0.5, ease: "power3.out" }, at); }
      function fadeOut(sel, at, d) { tl.to(sel, { opacity: 0, duration: d || 0.3, ease: "power2.inOut" }, at); }
      function lineIn(sel, at) { tl.fromTo(sel, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at); }
      function markOn(sel, at) { tl.to(sel, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, at); }
      // swap: old text slides up 10px and fades, new text comes in from 10px below (0.25s each)
      function swap(oldSel, newSel, at) {
        tl.to(oldSel, { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, at);
        tl.fromTo(newSel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, at + 0.12);
      }
      // kicker text cross-fade (0.3s)
      function kickerSwap(at) {
        tl.to("#f05-kold", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
        tl.fromTo("#f05-knew", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, at);
      }


      // initial state = end state of 04-json (cut): the full program, nodes and wires, the read
      // response, the note, the fulfilled response.json() chip and the title in the console
      gsap.set("#f05-knew", { opacity: 0 });
      gsap.set("#f05-note", { opacity: 1 });
      gsap.set("#f05-out1", { opacity: 1 });
      gsap.set("#f05-out2", { opacity: 0, x: -8 });
      gsap.set("#f05-t4-b", { opacity: 0, y: 10 });
      gsap.set(["#f05-m-post", "#f05-mtitel", "#f05-wrong"], { opacity: 0, scale: 0.96 });
      gsap.set(["#f05-chipA", "#f05-chipB"], { opacity: 0, y: 12 });
      gsap.set(["#f05-note1", "#f05-note2"], { opacity: 0, y: 8 });
      gsap.set("#f05-mini", { opacity: 0, y: 16 });

      // ---- Shot 1 (0.0-1.2): kicker -> TypeScript gelooft je (0.1); the request / response
      //      picture leaves (0.4s from 0.1); the console keeps its title line ----
      kickerSwap(0.1);
      fadeOut(["#f05-prog", "#f05-server", "#f05-wreq", "#f05-wres", "#f05-rlabel", "#f05-resp", "#f05-note", "#f05-state"], 0.1, 0.4);

      // ---- Shot 2 (1.2-3.3): "json" (1.28) wash on response.json() (off 3.3); "any" (2.24) chip A ----
      washOn("#f05-w-rj", 1.28);
      chipIn("#f05-chipA", 2.24);
      washOff("#f05-w-rj", 3.3);

      // ---- Shot 3 (3.3-9.1): "Post array" (3.60) mark around Post[] (off 6.8); "array" (4.08)
      //      chip B; "gelooft" (7.60) note 1 ----
      markOn("#f05-m-post", 3.6);
      chipIn("#f05-chipB", 4.08);
      fadeOut("#f05-m-post", 6.8);
      tl.to("#f05-note1", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.6);

      // ---- Shot 4 (9.1-end): "Klopt" (9.20) mini panel; "niet" (10.08) wrong mark around titel,
      //      row 4 -> posts[0].titel, the title leaves the console; "fout" (11.52) note 2;
      //      "undefined" (12.40) console line, wrong mark around it at 12.9. No blue here. ----
      tl.to("#f05-mini", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.2);
      markOn("#f05-mtitel", 10.08);
      swap("#f05-t4-a", "#f05-t4-b", 10.08);
      fadeOut("#f05-out1", 10.08, 0.3);
      tl.to("#f05-note2", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 11.52);
      lineIn("#f05-out2", 12.4);
      markOn("#f05-wrong", 12.9);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["05-type"] = tl;
    })();
  </script>
</template>
