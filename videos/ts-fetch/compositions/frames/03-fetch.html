  <script>
    (function () {
      var DUR = 14.55;
      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 26;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="03-fetch"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: the characters of a group are already in the DOM (one span each, in
      //      reading order, so a paused frame copies as normal code); they appear one by one from
      //      column `col` while the caret steps per char. A row can so be typed from the inside out. ----
      function typeLine(groupSel, caretSel, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var chars = Array.prototype.slice.call(q(groupSel).querySelectorAll(".ts-ch"));
        var caret = q(caretSel);
        var chPx = FS * CW;
        gsap.set(chars, { opacity: 0 });
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }
      function chipIn(sel, at) { tl.fromTo(sel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at); }
      function fadeUp(sel, at, y, d) { tl.fromTo(sel, { opacity: 0, y: y }, { opacity: 1, y: 0, duration: d || 0.5, ease: "power3.out" }, at); }
      function fadeOut(sel, at, d) { tl.to(sel, { opacity: 0, duration: d || 0.3, ease: "power2.inOut" }, at); }
      function lineIn(sel, at) { tl.fromTo(sel, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at); }
      function markOn(sel, at) { tl.to(sel, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, at); }
      // swap: old text slides up 10px and fades, new text comes in from 10px below (0.25s each)
      function swap(oldSel, newSel, at) {
        tl.to(oldSel, { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, at);
        tl.fromTo(newSel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, at + 0.12);
      }
      // kicker text cross-fade (0.3s)
      function kickerSwap(at) {
        tl.to("#f03-kold", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
        tl.fromTo("#f03-knew", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, at);
      }


      // start states: rows 1 and 5 of the IIFE are present, everything else waits for its word
      gsap.set(["#f03-prog", "#f03-server"], { opacity: 0, y: 12 });
      gsap.set(["#f03-wreq", "#f03-wres"], { opacity: 0 });
      gsap.set("#f03-state", { opacity: 0, y: 12 });
      gsap.set("#f03-v-ful", { opacity: 0, y: 10 });
      gsap.set("#f03-pbar", { opacity: 0, scaleY: 0 });
      gsap.set("#f03-tag", { opacity: 0, x: -8 });
      gsap.set("#f03-rlabel", { opacity: 0, y: 10 });
      gsap.set("#f03-resp", { opacity: 0, y: 16 });
      gsap.set(["#f03-s200", "#f03-b-nog"], { opacity: 0, y: 8 });
      gsap.set("#f03-mstatus", { opacity: 0, scale: 0.96 });

      // a packet travels: in at the sender's edge, x to the receiver's edge, out as it arrives
      function travel(sel, dx, at, end) {
        tl.to(sel, { opacity: 1, duration: 0.2, ease: "power1.out" }, at);
        tl.to(sel, { x: dx, duration: end - at - 0.25, ease: "power2.inOut" }, at + 0.1);
        tl.to(sel, { opacity: 0, duration: 0.2, ease: "power1.in" }, end - 0.2);
      }

      // ---- Shot 1 (0.0-1.9): kicker; nodes + wires (0.2); "Fetch" (0.00) fetch( types;
      //      "URL" (0.96) the string and ); type with a wash on the string (off 1.9) ----
      tl.fromTo("#f03-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f03-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.to(["#f03-prog", "#f03-server"], { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.to(["#f03-wreq", "#f03-wres"], { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);
      typeLine("#f03-g2a1", "#f03-c2", 27, 0.1, 0.033);
      typeLine("#f03-g2a2", "#f03-c2", 33, 0.96, 0.016, 0.06);
      washOn("#f03-w-str", 0.96);
      washOff("#f03-w-str", 1.9);

      // ---- Shot 2 (1.9-4.0): "meteen" (2.28) GET /posts leaves for the server (2.28-3.5);
      //      "promise" (3.00) state chip pending ----
      travel("#f03-preq", 222, 2.28, 3.5);
      chipIn("#f03-state", 3.0);

      // ---- Shot 3 (4.0-6.5): "await" (4.32) await types with a wash (off 6.4); "wacht" (5.04)
      //      gepauzeerd tag + dashed bar; "antwoord" (5.68) 200 OK travels back (5.68-6.8) ----
      typeLine("#f03-g2b", "#f03-c2", 21, 4.32, 0.03, 0.06);
      washOn("#f03-w-await", 4.32);
      tl.to("#f03-pbar", { opacity: 1, scaleY: 1, duration: 0.4, ease: "power3.out" }, 5.04);
      tl.to("#f03-tag", { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 5.04);
      travel("#f03-pres", -270, 5.68, 6.8);
      washOff("#f03-w-await", 6.4);

      // ---- Shot 4 (6.5-8.1): "Response" (6.92) chip fulfilled, marker off, const response = types,
      //      the response card comes up with its keys and no values yet ----
      swap("#f03-v-pend", "#f03-v-ful", 6.92);
      tl.to("#f03-state", { backgroundColor: "#EAF2FB", borderColor: "#3178C6", duration: 0.35, ease: "power3.out" }, 6.92);
      fadeOut(["#f03-tag", "#f03-pbar"], 6.92);
      typeLine("#f03-g2c", "#f03-c2", 4, 6.92, 0.022, 0.0);
      tl.to("#f03-rlabel", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.92);
      tl.to("#f03-resp", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 6.92);

      // ---- Shot 5 (8.1-end): "Daarin" (8.24) wash on response (off 9.2); "tweehonderd" (10.40)
      //      200 lands with a mark around the status row (off 11.3); "nog niet" (12.64) body value ----
      washOn("#f03-w-resp", 8.24);
      washOff("#f03-w-resp", 9.2);
      tl.to("#f03-s200", { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 10.4);
      markOn("#f03-mstatus", 10.4);
      fadeOut("#f03-mstatus", 11.3);
      tl.to("#f03-b-nog", { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 12.64);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["03-fetch"] = tl;
    })();
