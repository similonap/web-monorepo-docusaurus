  <script>
    (function () {
      var DUR = 19.35;
      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 24;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="12-promise-all"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }

      var STXT = ["#f12-stxt1", "#f12-stxt2", "#f12-stxt3", "#f12-stxt4", "#f12-stxt5"];

      var PAR = ["#f12-par1", "#f12-par2", "#f12-par3", "#f12-par4", "#f12-par5"];

      gsap.set("#f12-ktext", { opacity: 1, x: 0 });

      gsap.set("#f12-n14", { opacity: 0 });
      gsap.set(["#f12-card", "#f12-tl"], { opacity: 1, y: 0 });
      gsap.set(SFILL, { scaleX: 1, transformOrigin: "left center" });
      gsap.set(SEQ.concat(STXT), { opacity: 1 });
      gsap.set("#f12-now", { opacity: 1, x: 1000 * MS });
      gsap.set("#f12-cv-old", { opacity: 1, y: 0 });
      // what this frame adds, still hidden
      gsap.set(["#f12-knew", "#f12-snew"], { opacity: 0 });
      gsap.set(["#f12-i6", "#f12-i7", "#f12-t8", "#f12-t9", "#f12-t10"], { opacity: 0 });
      gsap.set(PFILL, { scaleX: 0, transformOrigin: "left center" });
      gsap.set(GHOSTS.concat(PAR), { opacity: 0 });
      gsap.set("#f12-cv-new", { opacity: 0, y: 10 });
      gsap.set("#f12-pbar", { opacity: 0, scaleY: 0 });
      gsap.set("#f12-tag", { opacity: 0, x: -8 });
      gsap.set(["#f12-chipA", "#f12-chipB"], { opacity: 0, y: 12 });
      gsap.set("#f12-v-ful", { opacity: 0, y: 10 });

      // ---- 0.0-1.5: kicker -> Promise.all (0.1); "Sneller" (0.48) the loop leaves, the tail moves one row down;
      //      "zo" (0.96) the five bars become ghosts, the now-line leaves, the clock dims ----
      textSwap("#f12-kold", "#f12-knew", 0.1);
      textSwap("#f12-sold", "#f12-snew", 0.1);
      fadeOut(LOOP, 0.48);
      tl.to(TAIL, { y: 0, duration: 0.4, ease: "power3.out" }, 0.48);
      tl.to("#f12-n14", { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.48);
      tl.set(["#f12-i6", "#f12-i7"], { opacity: 1 }, 0.9);

      tl.to(SEQ, { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 0.96);
      tl.to(GHOSTS, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0.96);
      tl.to("#f12-now", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 0.96);
      tl.to("#f12-cv-old", { color: "#94A3B8", duration: 0.4, ease: "power2.inOut" }, 0.96);

      // ---- 1.5-5.0: "map" (1.76) ids.map((id) => getPost(id)); types on row 6 (1.76-2.9), wash (off 5.0) ----
      var r6b = typeLine("#f12-t6b", "#f12-c6", [{"t": "ids"}, {"t": ".", "c": "ts-punct"}, {"t": "map", "c": "ts-fn"}, {"t": "((", "c": "ts-punct"}, {"t": "id"}, {"t": ")", "c": "ts-punct"}, {"t": " "}, {"t": "=>", "c": "ts-punct"}, {"t": " "}, {"t": "getPost", "c": "ts-fn"}, {"t": "(", "c": "ts-punct"}, {"t": "id"}, {"t": ")", "c": "ts-punct"}, {"t": ")", "c": "ts-punct"}, {"t": ";", "c": "ts-punct"}], 42, 1.76, 0.039);
      washOn("#f12-w6", r6b.end);

      tl.to(PAR, { opacity: 1, duration: 0.3, ease: "power3.out" }, 5.56);

      var r7b = typeLine("#f12-t7b", "#f12-c7", [{"t": "await", "c": "ts-kw"}, {"t": " "}, {"t": "Promise", "c": "ts-type"}, {"t": ".", "c": "ts-punct"}, {"t": "all", "c": "ts-fn"}, {"t": "(", "c": "ts-punct"}, {"t": "promises"}, {"t": ")", "c": "ts-punct"}, {"t": ";", "c": "ts-punct"}], 30, 10.24, 0.034);
      washOn("#f12-w7", r7b.end);
      washOff("#f12-w7", 13.9);
      tl.to("#f12-pbar", { opacity: 1, scaleY: 1, duration: 0.4, ease: "power3.out" }, 12.16);
      tl.to("#f12-tag", { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 12.16);

      tl.to("#f12-v-pend", { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, 13.4);

      fadeOut(["#f12-tag", "#f12-pbar"], 13.4);

      //      "dezelfde" (17.20) the note; hold ----
      tl.to("#f12-cv-old", { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, 14.56);
      tl.to("#f12-cv-new", { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 14.56 + 0.12);
      tl.fromTo("#f12-clockmark", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 15.04);
      typeLine("#f12-t7a", "#f12-c7", [{"t": "const", "c": "ts-kw"}, {"t": " posts: "}, {"t": "Post", "c": "ts-type"}, {"t": "[]", "c": "ts-punct"}, {"t": " = "}], 8, 15.92, 0.022);

      // hold still to full duration
      tl.set({}, {}, DUR);
