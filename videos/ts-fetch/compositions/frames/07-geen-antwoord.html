      <div data-hf-id="hf-t8hf" class="nc-packet f07-pk" id="f07-pk-req">GET /posts</div>

      <!-- chips row -->
      <div data-hf-id="hf-a9s4" class="ts-chip pc-state" id="f07-state"><span data-hf-id="hf-ln7l" class="ts-chip-key f07-key">fetch(…)</span><span data-hf-id="hf-lbbb" class="f07-valbox" style="width: 116px"><span data-hf-id="hf-n0wj" class="pc-val pc-val--pending" id="f07-v-pend">pending</span><span data-hf-id="hf-hnnz" class="pc-val pc-val--rejected" id="f07-v-rej">rejected</span></span></div>

      <!-- console -->
      <div data-hf-id="hf-tjw9" class="ts-label" id="f07-label">console</div>
      <div data-hf-id="hf-2pzm" class="pc-console" id="f07-console"><div data-hf-id="hf-gy3f" class="f07-lines"><div data-hf-id="hf-rlkz" class="pc-out pc-out--error" id="f07-out-err">TypeError: fetch failed</div></div><div data-hf-id="hf-kyjf" class="f07-lines"><div data-hf-id="hf-z3v8" class="pc-out" id="f07-out-ok">TypeError: fetch failed</div></div></div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 12.39;
      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 24;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="07-geen-antwoord"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        gsap.set(chars, { opacity: 0 });
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }
      function chipIn(sel, at) { tl.to(sel, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at); }
      function fadeIn(sel, at, d) { tl.to(sel, { opacity: 1, duration: d || 0.3, ease: "power2.out" }, at); }
      function fadeOut(sel, at, d) { tl.to(sel, { opacity: 0, duration: d || 0.3, ease: "power2.inOut" }, at); }
      function noteIn(sel, at) { tl.to(sel, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at); }
      function lineIn(sel, at) { tl.fromTo(sel, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at); }
      // swap: old text slides up 10px and fades, new text comes in from 10px below (0.25s each)
      function swap(oldSel, newSel, at) {
        tl.to(oldSel, { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, at);
        tl.fromTo(newSel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, at + 0.12);
      }
      // kicker text cross-fade (0.3s)
      function kickerSwap(at) {
        tl.to("#f07-kold", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
        tl.to("#f07-knew", { opacity: 1, duration: 0.3, ease: "power2.inOut" }, at);
      }
      // a packet travels over its wire: in at the sender (0.2s), x to the receiver, out as it arrives (0.2s)
      function travel(sel, dx, from, to, out) {
        tl.to(sel, { opacity: 1, duration: 0.2, ease: "power1.out" }, from);
        tl.to(sel, { x: dx, duration: to - from, ease: "power2.inOut" }, from);
        tl.to(sel, { opacity: 0, duration: 0.2, ease: "power1.in" }, out);
      }
      function serverDown(at) {
        tl.to("#f07-srv", { borderColor: "rgba(226, 232, 240, 0)", duration: 0.3, ease: "power2.inOut" }, at);
        tl.to(["#f07-role-up", "#f07-sub-up"], { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
        tl.to(["#f07-srv-down", "#f07-role-down", "#f07-sub-down"], { opacity: 1, duration: 0.3, ease: "power2.inOut" }, at);
      }
      function serverUp(at) {
        tl.to("#f07-srv", { borderColor: "#E2E8F0", duration: 0.3, ease: "power2.inOut" }, at);
        tl.to(["#f07-role-up", "#f07-sub-up"], { opacity: 1, duration: 0.3, ease: "power2.inOut" }, at);
        tl.to(["#f07-srv-down", "#f07-role-down", "#f07-sub-down"], { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
      }

      var BODY = ["#f07-t3", "#f07-t4", "#f07-t5"];
      var NEWROWS = ["#f07-t2", "#f07-t6", "#f07-t7", "#f07-t8", "#f07-n6", "#f07-n7", "#f07-n8", "#f07-n9"];
      var LOWER = ["#f07-prog", "#f07-srv", "#f07-wreq", "#f07-wres"];
      var pads = root.querySelectorAll(".f07-pad");

      // start state = code version A: the body rows sit one row up and four columns to the left
      // (their extra indent is hidden so a copy of the paused frame has the right indentation)
      gsap.set(BODY, { x: -57.6, y: -36 });
      gsap.set("#f07-t9", { y: -144 });
      gsap.set(NEWROWS, { opacity: 0 });
      gsap.set(pads, { opacity: 0 });
      gsap.set("#f07-uline", { scaleX: 0 });
      gsap.set(LOWER, { opacity: 0, y: 12 });
      gsap.set(["#f07-srv-down", "#f07-role-down", "#f07-sub-down"], { opacity: 0 });
      gsap.set("#f07-state", { opacity: 0, y: 12 });
      gsap.set("#f07-v-rej", { opacity: 0, y: 10 });
      gsap.set("#f07-label", { opacity: 0, y: 10 });
      gsap.set("#f07-console", { opacity: 0, y: 16 });

      // ---- Shot 1 (0.0-1.5): kicker; code version A present; nodes and wires fade up (0.2) ----
      tl.fromTo("#f07-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f07-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.to(LOWER, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);

      // ---- Shot 2 (1.5-5.0): "onbereikbaar" (2.32) the server goes down; "dan komt" (3.44) the request
      //      leaves, gets 70% of the way and fades at "antwoord" (4.36); the response wire dims ----
      serverDown(2.32);
      travel("#f07-pk-req", 155, 3.44, 4.3, 4.36);
      tl.to("#f07-wres", { opacity: 0.3, duration: 0.3, ease: "power2.inOut" }, 4.36);

      // ---- Shot 3 (5.0-8.9): "promise" (5.28) chip pending; "rejected" (6.00) rejected; "await" (7.20)
      //      red underline under await fetch(...); console at 8.0, "fout" (8.28) the error line ----
      chipIn("#f07-state", 5.28);
      tl.to("#f07-v-pend", { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, 6.0);
      tl.to("#f07-v-rej", { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 6.0 + 0.12);
      tl.to("#f07-state", { borderColor: "#D14343", boxShadow: "inset 0 0 0 1px #D14343", duration: 0.35, ease: "power3.out" }, 6.0);
      tl.to("#f07-uline", { scaleX: 1, duration: 0.35, ease: "power3.out" }, 7.2);
      tl.to("#f07-label", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.0);
      tl.to("#f07-console", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 8.0);
      lineIn("#f07-out-err", 8.28);

      // ---- Shot 4 (8.9-end): underline off (9.8); "try" (10.00) code A -> B, wash on try {;
      //      "catch" (10.72) wash on rows 6-8, the error is now caught and logged ----
      fadeOut("#f07-uline", 9.8, 0.2);
      tl.set(pads, { opacity: 1 }, 10.0);
      tl.to(BODY, { x: 0, y: 0, duration: 0.4, ease: "power3.inOut" }, 10.0);
      tl.to("#f07-t9", { y: 0, duration: 0.4, ease: "power3.inOut" }, 10.0);
      tl.to(NEWROWS, { opacity: 1, duration: 0.4, ease: "power2.out" }, 10.2);
      washOn("#f07-wtry", 10.2);
      washOn("#f07-wcatch", 10.72);
      swap("#f07-out-err", "#f07-out-ok", 10.72);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["07-geen-antwoord"] = tl;
    })();
  </script>
