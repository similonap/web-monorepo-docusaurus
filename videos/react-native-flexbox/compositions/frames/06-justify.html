  <script>
    (function () {
      var DUR = 20.31;
            var CH = 14.4; // JetBrains Mono 24px advance
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="06-justify"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // ---- FLEX KIT: React Native layout in the phone ----
      // The browser lays the Views out with React Native's defaults (Yoga): column, alignItems stretch,
      // alignContent flex-start, flexShrink 0; flex: n means grow n, shrink 0, basis 0.
      var PH_W = 316, PH_H = 650;
      var RN_BASE = "display:flex;flex-direction:column;align-items:stretch;align-content:flex-start;flex-shrink:0;flex-basis:auto;position:relative;box-sizing:border-box;min-width:0;min-height:0;margin:0;padding:0;border:0 solid black;";
      var RN_UNITLESS = { flexGrow: 1, flexShrink: 1, zIndex: 1, opacity: 1, aspectRatio: 1 };
      function rnCss(el, style) {
        for (var k in style) {
          var v = style[k];
          if (k === "backgroundColor") continue;
          if (k === "flex") {
            if (v > 0) { el.style.flexGrow = v; el.style.flexShrink = 0; el.style.flexBasis = "0px"; }
            else if (v < 0) { el.style.flexShrink = -v; }
            continue;
          }
          el.style[k] = typeof v === "number" && !RN_UNITLESS[k] ? v + "px" : v;
        }
      }
      // state = { parent: {RN style}, children: [{RN style}, ...] } -> boxes in screen coordinates
      function rnLayout(state) {
        var screen = document.createElement("div");
        screen.style.cssText = "position:absolute;left:-5000px;top:0;width:" + PH_W + "px;height:" + PH_H + "px;display:flex;flex-direction:column;align-items:stretch;";
        var parent = document.createElement("div");
        parent.style.cssText = RN_BASE;
        rnCss(parent, state.parent);
        var kids = state.children.map(function (c) {
          var d = document.createElement("div");
          d.style.cssText = RN_BASE;
          rnCss(d, c);
          parent.appendChild(d);
          return d;
        });
        screen.appendChild(parent);
        document.body.appendChild(screen);
        var p = { x: parent.offsetLeft, y: parent.offsetTop, width: parent.offsetWidth, height: parent.offsetHeight };
        var out = {
          parent: p,
          children: kids.map(function (k) { return { x: p.x + k.offsetLeft, y: p.y + k.offsetTop, width: k.offsetWidth, height: k.offsetHeight }; })
        };
        document.body.removeChild(screen);
        return out;
      }
      // move the rects to layout L: set at `at` when dur is 0, else a calm tween
      function rnShow(L, parentSel, childSels, at, dur) {
        function go(sel, b) {
          var v = { attr: { x: b.x, y: b.y, width: b.width, height: b.height } };
          if (!dur) { tl.set(sel, v, at); return; }
          v.duration = dur; v.ease = "power3.inOut";
          tl.to(sel, v, at);
        }
        if (parentSel) go(parentSel, L.parent);
        childSels.forEach(function (s, i) { if (s && L.children[i]) go(s, L.children[i]); });
      }
      // ---- end FLEX KIT ----

      var FS = 24, CW = 0.6, X0 = 0;
      // type-on with a stepping caret (from react-router-params 04-string, adapted to the flex kit);
      // each segment is appended to its own host element so the typed value can live inside the .fx-val
      function typeLine(caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var caret = q(caretSel);
        var chars = [];
        segments.forEach(function (seg) {
          var host = q(seg.host);
          for (var i = 0; i < seg.t.length; i++) {
            var s = document.createElement("span");
            s.className = "ts-ch" + (seg.c ? " " + seg.c : "");
            s.textContent = seg.t[i];
            host.appendChild(s);
            chars.push(s);
          }
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length };
      }

      var BOX = { width: 80, height: 80 };
      var KIDS = [BOX, BOX, BOX];
      var JC = ["flex-start", "center", "flex-end", "space-between", "space-around", "space-evenly"];
      var LAY = JC.map(function (v) { return rnLayout({ parent: { flex: 1, justifyContent: v }, children: KIDS }); });
      var BOXES = ["#f06-b1", "#f06-b2", "#f06-b3"];
      rnShow(LAY[0], "#f06-parent", BOXES, 0, 0);

      // ---- 0.0-3.0: kicker, panel, phone in; "justify content" (0.32): insert row 7 and type it ----
      tl.fromTo("#f06-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f06-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f06-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#f06-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.set("#f06-below", { y: -34 }, 0);
      tl.to("#f06-below", { y: 0, duration: 0.35, ease: "power3.out" }, 0.32);
      tl.to("#f06-ln14", { opacity: 1, duration: 0.35, ease: "power3.out" }, 0.32);
      typeLine("#f06-caret", [
        { host: "#f06-t-key", t: "justifyContent: " },
        { host: "#f06-v0", t: '"flex-start"' },
        { host: "#f06-t-end", t: "," }
      ], 12, 0.45, 0.03);

      // ---- 3.0-7.4: "main axis" (3.12): cross dims, main line pulses; "flex start" (6.40): wash on the value ----
      tl.to("#f06-ax-cc", { opacity: 0.3, duration: 0.35, ease: "power2.inOut" }, 3.12);
      tl.to("#f06-mainline", { strokeWidth: 5, duration: 0.4, ease: "power2.out" }, 3.12);
      tl.to("#f06-mainline", { strokeWidth: 3, duration: 0.4, ease: "power2.inOut" }, 3.52);
      washOn("#f06-hl-val", 6.4);

      // ---- 7.4-11.4: "Center" (7.52), "flex end" (9.60) ----
      var CHARS = [12, 8, 10, 15, 14, 14];
      function step(i, at) {
        swapVal("#f06-v" + (i - 1), "#f06-v" + i, "#f06-val", CHARS[i], at);
        rnShow(LAY[i], null, BOXES, at, 0.8);
      }
      step(1, 7.52);
      step(2, 9.6);

      // ---- 11.4-15.1: "Space between" (11.52); "vrije ruimte" (13.04): the gaps between the boxes ----
      step(3, 11.52);
      function band(sel, y0, y1) { tl.set(sel, { attr: { y: y0, height: Math.max(0, y1 - y0) } }, 0); }
      var SB = LAY[3].children;
      band("#f06-gap1", SB[0].y + SB[0].height, SB[1].y);
      band("#f06-gap2", SB[1].y + SB[1].height, SB[2].y);
      tl.to(["#f06-gap1", "#f06-gap2"], { opacity: 1, duration: 0.3, ease: "power1.out" }, 13.04);
      tl.to(["#f06-gap1", "#f06-gap2"], { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 14.9);

      // ---- 15.1-end: "Space around" (15.20), "space evenly" (16.40); "randen" (18.76): top and bottom free space ----
      step(4, 15.2);
      step(5, 16.4);
      var SE = LAY[5].children;
      band("#f06-edge1", 0, SE[0].y);
      band("#f06-edge2", SE[2].y + SE[2].height, 650);
      tl.to(["#f06-edge1", "#f06-edge2"], { opacity: 1, duration: 0.3, ease: "power1.out" }, 18.76);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["06-justify"] = tl;
    })();
  </script>
