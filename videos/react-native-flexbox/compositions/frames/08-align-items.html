  <script>
    (function () {
      var DUR = 20.23;
      var CH = 14.4; // JetBrains Mono 24px advance
      var FS = 24, CW = 0.6, X0 = 0; // typeLine: font size, advance ratio, text column start
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="08-align-items"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      var PH_W = 316, PH_H = 650;
      var RN_BASE = "display:flex;flex-direction:column;align-items:stretch;align-content:flex-start;flex-shrink:0;flex-basis:auto;position:relative;box-sizing:border-box;min-width:0;min-height:0;margin:0;padding:0;border:0 solid black;";
      var RN_UNITLESS = { flexGrow: 1, flexShrink: 1, zIndex: 1, opacity: 1, aspectRatio: 1 };
      function rnCss(el, style) {
        for (var k in style) {
          var v = style[k];
          if (k === "backgroundColor") continue;
          if (k === "flex") {
            if (v > 0) { el.style.flexGrow = v; el.style.flexShrink = 0; el.style.flexBasis = "0px"; }
            else if (v < 0) { el.style.flexShrink = -v; }
            continue;
          }
          el.style[k] = typeof v === "number" && !RN_UNITLESS[k] ? v + "px" : v;
        }
      }
      // state = { parent: {RN style}, children: [{RN style}, ...] } -> boxes in screen coordinates
      function rnLayout(state) {
        var screen = document.createElement("div");
        screen.style.cssText = "position:absolute;left:-5000px;top:0;width:" + PH_W + "px;height:" + PH_H + "px;display:flex;flex-direction:column;align-items:stretch;";
        var parent = document.createElement("div");
        parent.style.cssText = RN_BASE;
        rnCss(parent, state.parent);
        var kids = state.children.map(function (c) {
          var d = document.createElement("div");
          d.style.cssText = RN_BASE;
          rnCss(d, c);
          parent.appendChild(d);
          return d;
        });
        screen.appendChild(parent);
        document.body.appendChild(screen);
        var p = { x: parent.offsetLeft, y: parent.offsetTop, width: parent.offsetWidth, height: parent.offsetHeight };
        var out = {
          parent: p,
          children: kids.map(function (k) { return { x: p.x + k.offsetLeft, y: p.y + k.offsetTop, width: k.offsetWidth, height: k.offsetHeight }; })
        };
        document.body.removeChild(screen);
        return out;
      }
      // move the rects to layout L: set at `at` when dur is 0, else a calm tween
      function rnShow(L, parentSel, childSels, at, dur) {
        function go(sel, b) {
          var v = { attr: { x: b.x, y: b.y, width: b.width, height: b.height } };
          if (!dur) { tl.set(sel, v, at); return; }
          v.duration = dur; v.ease = "power3.inOut";
          tl.to(sel, v, at);
        }
        if (parentSel) go(parentSel, L.parent);
        childSels.forEach(function (s, i) { if (s && L.children[i]) go(s, L.children[i]); });
      }
      // ---- end FLEX KIT ----

      // type-on with a stepping caret over characters that are already in the markup
      // (adapted from typeLine in react-router-params 04-string: the value sits in a .fx-val wrapper)
      function splitChars(el) {
        var out = [];
        Array.prototype.slice.call(el.childNodes).forEach(function (n) {
          if (n.nodeType === 3) {
            var t = n.textContent;
            for (var i = 0; i < t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch";
              s.textContent = t[i];
              el.insertBefore(s, n);
              out.push(s);
            }
            el.removeChild(n);
          } else {
            out = out.concat(splitChars(n));
          }
        });
        return out;
      }
      function typeChars(caretSel, chars, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caretSel, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caretSel, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caretSel, { opacity: 0 }, end);
        return end;
      }

      var BOX = { width: 80, height: 80 };
      var KIDS = [BOX, BOX, BOX];
      var KIDS_NOW = [BOX, BOX, { height: 80 }];
      var FS_L = rnLayout({ parent: { flex: 1, alignItems: "flex-start" }, children: KIDS });
      var CE_L = rnLayout({ parent: { flex: 1, alignItems: "center" }, children: KIDS });
      var FE_L = rnLayout({ parent: { flex: 1, alignItems: "flex-end" }, children: KIDS });
      var ST_L = rnLayout({ parent: { flex: 1, alignItems: "stretch" }, children: KIDS });
      var ST_NOW = rnLayout({ parent: { flex: 1, alignItems: "stretch" }, children: KIDS_NOW });
      var BOXES = ["#f08-b1", "#f08-b2", "#f08-b3"];
      rnShow(FS_L, "#f08-parent", BOXES, 0, 0);

      // the inserted row: rows below start one row up, the new line number is hidden
      tl.set("#f08-below", { y: -34 }, 0);
      var row7 = splitChars(q("#f08-t7a")).concat(splitChars(q("#f08-v-fs")), splitChars(q("#f08-t7b")));

      function pulse(sel, from, to, at) {
        tl.to(sel, { strokeWidth: to, duration: 0.4, ease: "power2.out" }, at);
        tl.to(sel, { strokeWidth: from, duration: 0.4, ease: "power2.inOut" }, at + 0.4);
      }

      // ---- 0.0-2.0: kicker, panel, phone in; "cross axis" (0.40): main dims, cross line pulses ----
      tl.fromTo("#f08-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f08-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f08-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#f08-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.to("#f08-ax-mc", { opacity: 0.3, duration: 0.35, ease: "power2.inOut" }, 0.4);
      pulse("#f08-ax-cc .ph-cross", 2, 4, 0.4);

      // ---- 2.0-9.6: "align items" (2.08): insert + type; "Flex start" (3.44); "center" (4.80); "flex end" (5.68) ----
      tl.to("#f08-below", { y: 0, duration: 0.35, ease: "power3.out" }, 1.72);
      tl.to("#f08-ln14", { opacity: 1, duration: 0.35, ease: "power3.out" }, 1.72);
      typeChars("#f08-c7", row7, 12, 2.08, 0.035);
      washOn("#f08-val", 3.44);
      swapVal("#f08-v-fs", "#f08-v-c", "#f08-val", 8, 4.8);
      rnShow(CE_L, null, BOXES, 4.8, 0.8);
      swapVal("#f08-v-c", "#f08-v-fe", "#f08-val", 10, 5.68);
      rnShow(FE_L, null, BOXES, 5.68, 0.8);
      washOff("#f08-val", 7.4);

      // ---- 9.6-16.4: "stretch" (11.16); "zonder vaste breedte" (13.20); "uitgerekt" (14.04); "hele cross axis" (15.28) ----
      washOn("#f08-val", 11.16);
      swapVal("#f08-v-fe", "#f08-v-st", "#f08-val", 9, 11.16);
      rnShow(ST_L, null, BOXES, 11.16, 0.8);
      washOff("#f08-val", 12.9);
      tl.to("#f08-r11a", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 13.2);
      tl.to("#f08-r11b", { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 13.2);
      washOn("#f08-hl-r11", 13.2);
      rnShow(ST_NOW, null, BOXES, 14.04, 0.8);
      var s3 = ST_NOW.children[2];
      tl.set("#f08-mark", { attr: { x: s3.x + 1.5, y: s3.y + 1.5, width: s3.width - 3, height: s3.height - 3 } }, 0);
      tl.to("#f08-mark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 15.28);

      // ---- 16.4-end: "wel een breedte" (17.20): width in rows 9 and 10, mark on boxes 1-2 ----
      washOff("#f08-hl-r11", 16.8);
      washOn(["#f08-hl-w1", "#f08-hl-w2"], 17.2);
      var s1 = ST_NOW.children[0], s2 = ST_NOW.children[1];
      tl.to("#f08-mark", { attr: { x: s1.x + 1.5, y: s1.y + 1.5, width: s1.width - 3, height: s2.y + s2.height - s1.y - 3 }, duration: 0.5, ease: "power3.inOut" }, 17.2);


      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["08-align-items"] = tl;
    })();
  </script>
