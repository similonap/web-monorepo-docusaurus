              <text data-hf-id="hf-jrxw" class="ph-lbl ph-lbl--main" x="13" y="293">main axis</text>
              <text data-hf-id="hf-kgfe" class="ph-lbl ph-prop ph-prop--main" x="13" y="312">justifyContent</text>
            </g>
            <!-- main axis: column-reverse (up) -->
            <g data-hf-id="hf-7zqh" id="f07-ax-mcr" style="opacity: 0;">
              <line data-hf-id="hf-4grj" class="ph-main" x1="158" y1="624" x2="158" y2="40"></line>
              <path data-hf-id="hf-yy82" class="ph-main-head" d="M158 24 L150 40 L166 40 Z"></path>
              <text data-hf-id="hf-emib" class="ph-lbl ph-lbl--main" x="170" y="54">main axis</text>
              <text data-hf-id="hf-14xe" class="ph-lbl ph-prop ph-prop--main" x="170" y="73">justifyContent</text>
            </g>
            <!-- cross axis for column directions (right) -->
            <g data-hf-id="hf-0c41" id="f07-ax-cc">
              <line data-hf-id="hf-6jut" class="ph-cross" x1="13" y1="325" x2="289" y2="325"></line>
              <path data-hf-id="hf-h7ao" class="ph-cross-head" d="M305 325 L289 317 L289 333 Z"></path>
              <text data-hf-id="hf-cf49" class="ph-lbl ph-lbl--cross" x="303" y="293" text-anchor="end">cross axis</text>
              <text data-hf-id="hf-34pi" class="ph-lbl ph-prop ph-prop--cross" x="303" y="312" text-anchor="end">alignItems</text>
            </g>
            <!-- cross axis for row directions (down) -->
            <g data-hf-id="hf-6p6a" id="f07-ax-cr" style="opacity: 0;">
              <line data-hf-id="hf-q9jz" class="ph-cross" x1="158" y1="26" x2="158" y2="610"></line>
              <path data-hf-id="hf-mzal" class="ph-cross-head" d="M158 626 L150 610 L166 610 Z"></path>
              <text data-hf-id="hf-q6g4" class="ph-lbl ph-lbl--cross" x="170" y="590">cross axis</text>
              <text data-hf-id="hf-rc4y" class="ph-lbl ph-prop ph-prop--cross" x="170" y="609">alignItems</text>
            </g>

        </div>
        <div data-hf-id="hf-xjm4" class="ph-home"></div>

    </div>
  </div>

  <script>
    (function () {
      var DUR = 16.39;
      var CH = 14.4; // JetBrains Mono 24px advance
      var FS = 24, CW = 0.6, X0 = 0; // typeLine: font size, advance ratio, text column start
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="07-main-axis"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      var PH_W = 316, PH_H = 650;
      var RN_BASE = "display:flex;flex-direction:column;align-items:stretch;align-content:flex-start;flex-shrink:0;flex-basis:auto;position:relative;box-sizing:border-box;min-width:0;min-height:0;margin:0;padding:0;border:0 solid black;";
      var RN_UNITLESS = { flexGrow: 1, flexShrink: 1, zIndex: 1, opacity: 1, aspectRatio: 1 };
      function rnCss(el, style) {
        for (var k in style) {
          var v = style[k];
          if (k === "backgroundColor") continue;
          if (k === "flex") {
            if (v > 0) { el.style.flexGrow = v; el.style.flexShrink = 0; el.style.flexBasis = "0px"; }
            else if (v < 0) { el.style.flexShrink = -v; }
            continue;
          }
          el.style[k] = typeof v === "number" && !RN_UNITLESS[k] ? v + "px" : v;
        }
      }
      // state = { parent: {RN style}, children: [{RN style}, ...] } -> boxes in screen coordinates
      function rnLayout(state) {
        var screen = document.createElement("div");
        screen.style.cssText = "position:absolute;left:-5000px;top:0;width:" + PH_W + "px;height:" + PH_H + "px;display:flex;flex-direction:column;align-items:stretch;";
        var parent = document.createElement("div");
        parent.style.cssText = RN_BASE;
        rnCss(parent, state.parent);
        var kids = state.children.map(function (c) {
          var d = document.createElement("div");
          d.style.cssText = RN_BASE;
          rnCss(d, c);
          parent.appendChild(d);
          return d;
        });
        screen.appendChild(parent);
        document.body.appendChild(screen);
        var p = { x: parent.offsetLeft, y: parent.offsetTop, width: parent.offsetWidth, height: parent.offsetHeight };
        var out = {
          parent: p,
          children: kids.map(function (k) { return { x: p.x + k.offsetLeft, y: p.y + k.offsetTop, width: k.offsetWidth, height: k.offsetHeight }; })
        };
        document.body.removeChild(screen);
        return out;
      }
      // move the rects to layout L: set at `at` when dur is 0, else a calm tween
      function rnShow(L, parentSel, childSels, at, dur) {
        function go(sel, b) {
          var v = { attr: { x: b.x, y: b.y, width: b.width, height: b.height } };
          if (!dur) { tl.set(sel, v, at); return; }
          v.duration = dur; v.ease = "power3.inOut";
          tl.to(sel, v, at);
        }
        if (parentSel) go(parentSel, L.parent);
        childSels.forEach(function (s, i) { if (s && L.children[i]) go(s, L.children[i]); });
      }
      // ---- end FLEX KIT ----

      // type-on with a stepping caret (from react-router-params 04-string, adapted to the FLEX KIT)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      var BOX = { width: 80, height: 80 };
      var KIDS = [BOX, BOX, BOX];
      var A = rnLayout({ parent: { flex: 1, justifyContent: "center" }, children: KIDS });
      var B = rnLayout({ parent: { flex: 1, flexDirection: "row", justifyContent: "center" }, children: KIDS });
      var BOXES = ["#f07-b1", "#f07-b2", "#f07-b3"];
      rnShow(A, "#f07-parent", BOXES, 0, 0);
      // ghosts sit on the column positions; the mark wraps the three row boxes as one rect
      rnShow(A, null, ["#f07-g1", "#f07-g2", "#f07-g3"], 0, 0);
      var b0 = B.children[0], b2 = B.children[2];
      tl.set("#f07-mark", { attr: { x: b0.x + 1.5, y: b0.y + 1.5, width: b2.x + b2.width - b0.x - 3, height: b0.height - 3 } }, 0);
      // the inserted row: rows below start one row up, the new line number is hidden
      tl.set("#f07-below", { y: -34 }, 0);

      function pulse(sel, from, to, at) {
        tl.to(sel, { strokeWidth: to, duration: 0.4, ease: "power2.out" }, at);
        tl.to(sel, { strokeWidth: from, duration: 0.4, ease: "power2.inOut" }, at + 0.4);
      }

      // ---- 0.0-4.8: kicker, panel, phone in (column, centred); "justify content" (1.20); "main axis" (3.52) ----
      tl.fromTo("#f07-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f07-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f07-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#f07-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      washOn("#f07-hl-just", 1.2);
      pulse("#f07-ax-mc .ph-main", 3, 5, 3.52);
      washOff("#f07-hl-just", 4.6);

      // ---- 4.8-9.3: "flex direction" (5.36): insert + type; "row" (6.24): layout and axes turn; "dezelfde regel" (8.20) ----
      tl.to("#f07-below", { y: 0, duration: 0.35, ease: "power3.out" }, 5.0);
      tl.to("#f07-ln15", { opacity: 1, duration: 0.35, ease: "power3.out" }, 5.0);
      typeLine("#f07-l7", "#f07-c7", [
        { id: "f07-hl-dir", parts: [
          { t: "flexDirection: " },
          { t: "\"row\"", c: "ts-str" }
        ] },
        { t: "," }
      ], 12, 5.36, 0.035);
      rnShow(B, null, BOXES, 6.24, 0.8);
      fadeSwap("#f07-ax-mc", "#f07-ax-mr", 6.24);
      fadeSwap("#f07-ax-cc", "#f07-ax-cr", 6.24);
      tl.fromTo("#f07-mark-just", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 8.2);

      // ---- 9.3-11.6: "niet meer verticaal" (9.44): ghosts; "horizontaal" (10.48): mark around the row ----
      tl.to(["#f07-g1", "#f07-g2", "#f07-g3"], { opacity: 0.6, duration: 0.35, ease: "power1.out" }, 9.44);
      tl.to("#f07-mark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 10.48);
      tl.to(["#f07-g1", "#f07-g2", "#f07-g3"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 11.4);

      // ---- 11.6-end: "main axis" (14.04): the flexDirection row and the main axis ----
      tl.to(["#f07-mark-just", "#f07-mark"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 13.6);
      washOn("#f07-hl-dir", 14.04);
      pulse("#f07-ax-mr .ph-main", 3, 5, 14.04);


      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["07-main-axis"] = tl;
    })();
  </script>
</template>
