  <script>
    (function () {
      var DUR = 15.43;
            var CH = 14.4; // JetBrains Mono 24px advance
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="05-flex-kinderen"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // ---- FLEX KIT: React Native layout in the phone ----
      // The browser lays the Views out with React Native's defaults (Yoga): column, alignItems stretch,
      // alignContent flex-start, flexShrink 0; flex: n means grow n, shrink 0, basis 0.
      var PH_W = 316, PH_H = 650;
      var RN_BASE = "display:flex;flex-direction:column;align-items:stretch;align-content:flex-start;flex-shrink:0;flex-basis:auto;position:relative;box-sizing:border-box;min-width:0;min-height:0;margin:0;padding:0;border:0 solid black;";
      var RN_UNITLESS = { flexGrow: 1, flexShrink: 1, zIndex: 1, opacity: 1, aspectRatio: 1 };
      function rnCss(el, style) {
        for (var k in style) {
          var v = style[k];
          if (k === "backgroundColor") continue;
          if (k === "flex") {
            if (v > 0) { el.style.flexGrow = v; el.style.flexShrink = 0; el.style.flexBasis = "0px"; }
            else if (v < 0) { el.style.flexShrink = -v; }
            continue;
          }
          el.style[k] = typeof v === "number" && !RN_UNITLESS[k] ? v + "px" : v;
        }
      }
      // state = { parent: {RN style}, children: [{RN style}, ...] } -> boxes in screen coordinates
      function rnLayout(state) {
        var screen = document.createElement("div");
        screen.style.cssText = "position:absolute;left:-5000px;top:0;width:" + PH_W + "px;height:" + PH_H + "px;display:flex;flex-direction:column;align-items:stretch;";
        var parent = document.createElement("div");
        parent.style.cssText = RN_BASE;
        rnCss(parent, state.parent);
        var kids = state.children.map(function (c) {
          var d = document.createElement("div");
          d.style.cssText = RN_BASE;
          rnCss(d, c);
          parent.appendChild(d);
          return d;
        });
        screen.appendChild(parent);
        document.body.appendChild(screen);
        var p = { x: parent.offsetLeft, y: parent.offsetTop, width: parent.offsetWidth, height: parent.offsetHeight };
        var out = {
          parent: p,
          children: kids.map(function (k) { return { x: p.x + k.offsetLeft, y: p.y + k.offsetTop, width: k.offsetWidth, height: k.offsetHeight }; })
        };
        document.body.removeChild(screen);
        return out;
      }
      // move the rects to layout L: set at `at` when dur is 0, else a calm tween
      function rnShow(L, parentSel, childSels, at, dur) {
        function go(sel, b) {
          var v = { attr: { x: b.x, y: b.y, width: b.width, height: b.height } };
          if (!dur) { tl.set(sel, v, at); return; }
          v.duration = dur; v.ease = "power3.inOut";
          tl.to(sel, v, at);
        }
        if (parentSel) go(parentSel, L.parent);
        childSels.forEach(function (s, i) { if (s && L.children[i]) go(s, L.children[i]); });
      }
      // ---- end FLEX KIT ----

      var BOX = { width: 80, height: 80 };
      var F1 = { flex: 1, width: 80 }, F2 = { flex: 2, width: 80 }, F3 = { flex: 3, width: 80 };
      var LA = rnLayout({ parent: { flex: 1 }, children: [BOX, BOX, BOX] });
      var LB = rnLayout({ parent: { flex: 1 }, children: [F1, BOX, BOX] });
      var LC = rnLayout({ parent: { flex: 1 }, children: [F1, F2, BOX] });
      var LD = rnLayout({ parent: { flex: 1 }, children: [F1, F2, F3] });
      var BOXES = ["#f05-b1", "#f05-b2", "#f05-b3"];
      rnShow(LA, "#f05-parent", BOXES, 0, 0);
      tl.set("#f05-ax-cc", { opacity: 0.3 }, 0);

      // ---- 0.0-2.0: kicker, panel, phone in (A); "kinderen" (1.28): wash on the three children ----
      tl.fromTo("#f05-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f05-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f05-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#f05-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      ["#f05-hl9", "#f05-hl10", "#f05-hl11"].forEach(function (s) { washOn(s, 1.28); washOff(s, 2.7); });

      // ---- 2.0-4.2: "vaste hoogte" (2.76): thin red underline under every height: 80, which dims ----
      ["#f05-u9", "#f05-u10", "#f05-u11"].forEach(function (s) {
        tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 2.76);
      });
      tl.to(["#f05-h9", "#f05-h10", "#f05-h11"], { opacity: 0.45, duration: 0.35, ease: "power1.out" }, 2.76);

      // ---- 4.2-6.4: "een" (4.48), "twee" (5.08), "drie" (5.84): each child row crossfades, phone follows ----
      // (moves end exactly where the next one starts, so the layout tweens never overlap)
      function rowSwap(n, at) {
        tl.to("#f05-o" + n, { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
        tl.to("#f05-n" + n, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, at);
        washOn("#f05-hn" + n, at);
        washOff("#f05-hn" + n, at + 1.0);
      }
      rowSwap(9, 4.48);  rnShow(LB, null, BOXES, 4.48, 0.6);
      rowSwap(10, 5.08); rnShow(LC, null, BOXES, 5.08, 0.76);
      rowSwap(11, 5.84); rnShow(LD, null, BOXES, 5.84, 0.8);

      // ---- 6.4-11.0: "main axis" (8.00): wash on the flex values; "zes delen" (9.28): fractions ----
      ["#f05-hf9", "#f05-hf10", "#f05-hf11"].forEach(function (s) { washOn(s, 8.0); washOff(s, 10.8); });
      ["#f05-fr1", "#f05-fr2", "#f05-fr3", "#f05-fr3b"].forEach(function (s, i) {
        var b = LD.children[Math.min(i, 2)];
        tl.set(s, { attr: { y: Math.round(b.y + b.height / 2 + 7) } }, 0);
      });
      ["#f05-fr1", "#f05-fr2", "#f05-fr3"].forEach(function (s, i) {
        tl.fromTo(s, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 9.28 + i * 0.15);
      });

      // ---- 11.0-end: "Het derde vakje" (11.20): mark box 3, wash row 11; "de helft" (13.28): 3/6 = 1/2 ----
      var b3 = LD.children[2];
      // white halo behind "3/6 = 1/2" so the main axis line does not run through the spaces
      tl.set("#f05-fr3b-halo", { attr: { y: Math.round(b3.y + b3.height / 2 - 14) } }, 0);
      tl.to("#f05-fr3b-halo", { opacity: 1, duration: 0.25, ease: "power2.out" }, 13.28);
      tl.set("#f05-mark", { attr: { x: b3.x + 1.5, y: b3.y + 1.5, width: b3.width - 3, height: b3.height - 3 } }, 0);
      tl.to("#f05-mark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 11.2);
      washOn("#f05-hn11", 11.2);
      tl.to("#f05-fr3", { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, 13.28);
      tl.fromTo("#f05-fr3b", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 13.28);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["05-flex-kinderen"] = tl;
    })();
  </script>
