  <script>
    (function () {

      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }

      // ---- FLEX KIT: React Native layout in the phone ----
      // The browser lays the Views out with React Native's defaults (Yoga): column, alignItems stretch,
      // alignContent flex-start, flexShrink 0; flex: n means grow n, shrink 0, basis 0.
      var PH_W = 316, PH_H = 650;
      var RN_BASE = "display:flex;flex-direction:column;align-items:stretch;align-content:flex-start;flex-shrink:0;flex-basis:auto;position:relative;box-sizing:border-box;min-width:0;min-height:0;margin:0;padding:0;border:0 solid black;";
      var RN_UNITLESS = { flexGrow: 1, flexShrink: 1, zIndex: 1, opacity: 1, aspectRatio: 1 };
      function rnCss(el, style) {
        for (var k in style) {
          var v = style[k];
          if (k === "backgroundColor") continue;
          if (k === "flex") {
            if (v > 0) { el.style.flexGrow = v; el.style.flexShrink = 0; el.style.flexBasis = "0px"; }

      }
      // state = { parent: {RN style}, children: [{RN style}, ...] } -> boxes in screen coordinates
      function rnLayout(state) {
        var screen = document.createElement("div");
        screen.style.cssText = "position:absolute;left:-5000px;top:0;width:" + PH_W + "px;height:" + PH_H + "px;display:flex;flex-direction:column;align-items:stretch;";
        var parent = document.createElement("div");
        parent.style.cssText = RN_BASE;
        rnCss(parent, state.parent);
        var kids = state.children.map(function (c) {
          var d = document.createElement("div");
          d.style.cssText = RN_BASE;
          rnCss(d, c);
          parent.appendChild(d);
          return d;
        });
        screen.appendChild(parent);
        document.body.appendChild(screen);
        var p = { x: parent.offsetLeft, y: parent.offsetTop, width: parent.offsetWidth, height: parent.offsetHeight };
        var out = {
          parent: p,
          children: kids.map(function (k) { return { x: p.x + k.offsetLeft, y: p.y + k.offsetTop, width: k.offsetWidth, height: k.offsetHeight }; })
        };
        document.body.removeChild(screen);
        return out;
      }
      // move the rects to layout L: set at `at` when dur is 0, else a calm tween
      function rnShow(L, parentSel, childSels, at, dur) {

          if (!dur) { tl.set(sel, v, at); return; }
          v.duration = dur; v.ease = "power3.inOut";
          tl.to(sel, v, at);
        }
        if (parentSel) go(parentSel, L.parent);
        childSels.forEach(function (s, i) { if (s && L.children[i]) go(s, L.children[i]); });
      }
      // ---- end FLEX KIT ----

      // type-on with a caret that steps per character (from react-router-params 04-string, adapted)
      var FS = 24, CW = 0.6, X0 = 0;
      function typeLine(lineSel, caretSel, segments, col, start, per, lead, keepCaret) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        segments.forEach(function (p) {
          for (var i = 0; i < p.t.length; i++) {

            s.className = "ts-ch" + (p.c ? " " + p.c : "");
            s.textContent = p.t[i];
            line.appendChild(s);
            chars.push(s);
          }
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);

      var KIDS = [BOX, BOX, BOX, BOX, BOX];
      var A = rnLayout({ parent: { flex: 1, flexDirection: "row" }, children: KIDS });
      var B = rnLayout({ parent: { flex: 1, flexDirection: "row", flexWrap: "wrap" }, children: KIDS });
      var C = rnLayout({ parent: { flex: 1, flexDirection: "row", flexWrap: "wrap", alignContent: "center" }, children: KIDS });
      var BOXES = ["#f11-b1", "#f11-b2", "#f11-b3", "#f11-b4", "#f11-b5"];
      rnShow(A, "#f11-parent", BOXES, 0, 0);

      tl.to("#f11-below", { y: 0, duration: 0.35, ease: "power3.out" }, 14.58);

      tl.to("#f11-ax-mr", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 15.60);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["11-wrap"] = tl;
    })();
