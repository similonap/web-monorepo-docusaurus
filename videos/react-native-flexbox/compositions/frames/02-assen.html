      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // ---- FLEX KIT: React Native layout in the phone ----
      // The browser lays the Views out with React Native's defaults (Yoga): column, alignItems stretch,
      // alignContent flex-start, flexShrink 0; flex: n means grow n, shrink 0, basis 0.
      var PH_W = 316, PH_H = 650;
      var RN_BASE = "display:flex;flex-direction:column;align-items:stretch;align-content:flex-start;flex-shrink:0;flex-basis:auto;position:relative;box-sizing:border-box;min-width:0;min-height:0;margin:0;padding:0;border:0 solid black;";
      var RN_UNITLESS = { flexGrow: 1, flexShrink: 1, zIndex: 1, opacity: 1, aspectRatio: 1 };
      function rnCss(el, style) {
        for (var k in style) {
          var v = style[k];
          if (k === "backgroundColor") continue;
          if (k === "flex") {
            if (v > 0) { el.style.flexGrow = v; el.style.flexShrink = 0; el.style.flexBasis = "0px"; }
            else if (v < 0) { el.style.flexShrink = -v; }
            continue;
          }
          el.style[k] = typeof v === "number" && !RN_UNITLESS[k] ? v + "px" : v;
        }
      }
      // state = { parent: {RN style}, children: [{RN style}, ...] } -> boxes in screen coordinates
      function rnLayout(state) {
        var screen = document.createElement("div");
        screen.style.cssText = "position:absolute;left:-5000px;top:0;width:" + PH_W + "px;height:" + PH_H + "px;display:flex;flex-direction:column;align-items:stretch;";
        var parent = document.createElement("div");
        parent.style.cssText = RN_BASE;
        rnCss(parent, state.parent);
        var kids = state.children.map(function (c) {
          var d = document.createElement("div");
          d.style.cssText = RN_BASE;
          rnCss(d, c);
          parent.appendChild(d);
          return d;
        });
        screen.appendChild(parent);
        document.body.appendChild(screen);
        var p = { x: parent.offsetLeft, y: parent.offsetTop, width: parent.offsetWidth, height: parent.offsetHeight };
        var out = {
          parent: p,
          children: kids.map(function (k) { return { x: p.x + k.offsetLeft, y: p.y + k.offsetTop, width: k.offsetWidth, height: k.offsetHeight }; })
        };
        document.body.removeChild(screen);
        return out;
      }
      // move the rects to layout L: set at `at` when dur is 0, else a calm tween
      function rnShow(L, parentSel, childSels, at, dur) {
        function go(sel, b) {
          var v = { attr: { x: b.x, y: b.y, width: b.width, height: b.height } };
          if (!dur) { tl.set(sel, v, at); return; }
          v.duration = dur; v.ease = "power3.inOut";
          tl.to(sel, v, at);
        }
        if (parentSel) go(parentSel, L.parent);
        childSels.forEach(function (s, i) { if (s && L.children[i]) go(s, L.children[i]); });
      }
      // ---- end FLEX KIT ----

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      var BOX = { width: 80, height: 80 };
      var KIDS = [BOX, BOX, BOX];
      var COL = rnLayout({ parent: { flex: 1 }, children: KIDS });
      var BOXES = ["#f02-b1", "#f02-b2", "#f02-b3"];
      rnShow(COL, "#f02-parent", BOXES, 0, 0);

      // ---- 0.0-2.5: kicker, panel and phone in; "twee assen" (1.20): hold ----
      tl.fromTo("#f02-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f02-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f02-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#f02-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.set("#f02-below", { y: -34 }, 0);

      // ---- 2.5-6.6: "De main axis" (2.60): main axis draws down; "kinderen" (4.56): wash on the children ----
      tl.set("#f02-mc-line", { opacity: 1, attr: { y2: 26 } }, 2.6);
      tl.to("#f02-mc-line", { attr: { y2: 610 }, duration: 0.6, ease: "power3.out" }, 2.6);
      tl.to(["#f02-mc-head", "#f02-mc-l1", "#f02-mc-l2"], { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.1);
      washOn("#f02-hl-k1, #f02-hl-k2, #f02-hl-k3", 4.56);
      washOff("#f02-hl-k1, #f02-hl-k2, #f02-hl-k3", 6.4);

      // ---- 6.6-9.2: "De cross axis" (6.72): cross axis draws right; "loodrecht" (8.00): right-angle mark ----
      tl.set("#f02-cc-line", { opacity: 1, attr: { x2: 13 } }, 6.72);
      tl.to("#f02-cc-line", { attr: { x2: 289 }, duration: 0.6, ease: "power3.out" }, 6.72);
      tl.to(["#f02-cc-head", "#f02-cc-l1", "#f02-cc-l2"], { opacity: 1, duration: 0.3, ease: "power1.out" }, 7.22);
      tl.to("#f02-angle", { opacity: 1, duration: 0.35, ease: "power1.out" }, 8.0);
      tl.to("#f02-angle", { opacity: 0, duration: 0.35, ease: "power1.inOut" }, 10.4);

      // ---- 9.2-15.5: "main axis" (10.56): cross axis dims; "standaard" (11.36): row 7 is inserted and typed ----
      tl.to("#f02-ax-cc", { opacity: 0.3, duration: 0.35, ease: "power2.inOut" }, 10.56);
      tl.to("#f02-below", { y: 0, duration: 0.35, ease: "power3.out" }, 11.36);
      tl.to("#f02-ln14", { opacity: 1, duration: 0.35, ease: "power1.out" }, 11.36);
      var c7 = typeLine("#f02-l7", "#f02-c7", [
        { t: "// standaard: flexDirection: \"column\"", c: "f02-comment" }
      ], 12, 11.5, 0.02);
      // "onder elkaar" (14.20): one mark around the three stacked boxes
      var top = COL.children[0], bot = COL.children[2];
      tl.set("#f02-mark", { attr: { x: top.x + 1.5, y: top.y + 1.5, width: top.width - 3, height: bot.y + bot.height - top.y - 3 } }, 0);
      tl.to("#f02-mark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 14.2);
      tl.to("#f02-mark", { opacity: 0, duration: 0.35, ease: "power1.inOut" }, 15.4);

      // ---- 15.5-end: "Op het web" (15.60): the web default types on; "andersom" (16.72): wash on "row" ----
      typeLine("#f02-l7", "#f02-c7", [
        { t: "  (web: ", c: "f02-comment" },
        { id: "f02-hl-row", parts: [{ t: "\"row\"", c: "f02-comment" }] },
        { t: ")", c: "f02-comment" }
      ], c7.col, 15.6, 0.03);
      washOn("#f02-hl-row", 16.72);
      tl.to("#f02-ax-cc", { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 16.72);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["02-assen"] = tl;
    })();
  </script>
</template>
