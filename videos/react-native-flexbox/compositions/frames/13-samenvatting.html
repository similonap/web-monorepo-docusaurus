      var BOX = { width: 80, height: 80 };

      var S1 = rnLayout({ parent: { flex: 1 }, children: [BOX, BOX, BOX] });

      var S4 = rnLayout({ parent: { flex: 1, alignItems: "center" }, children: [{ flex: 1, width: 80 }, { flex: 2, width: 80 }, { flex: 3, width: 80 }] });

      var S6 = rnLayout({ parent: { flex: 1, flexDirection: "row", flexWrap: "wrap" }, children: [ABS, BOX, BOX, BOX, BOX] });
      var BOXES = ["#f13-b1", "#f13-b2", "#f13-b3"];
