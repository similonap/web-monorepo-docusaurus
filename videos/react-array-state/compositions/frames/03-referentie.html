    <script>
      (function () {
        var FRAME_ID = "03-referentie";
        var DURATION = 12;
        var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
        var byId = function (suffix) {
          return root.querySelector('[id="' + FRAME_ID + "-" + suffix + '"]');
        };

        var tl = gsap.timeline({ paused: true });

        var rowOld = byId("row-old");
        var rowNew = byId("row-new");
        var tagOld = byId("tag-old");
        var tagNew = byId("tag-new");
        var roleOld = byId("role-old");
        var oldCells = rowOld.querySelectorAll(".cell");
        var oldVals = rowOld.querySelectorAll(".val");
        var copyCells = rowNew.querySelectorAll(".cell.copy");
        var pushCell = byId("push-cell");
        var panel = byId("panel");
        var eye = byId("eye");
        var pupil = byId("pupil");
        var bracket = byId("bracket");
        var line2 = byId("line2");
        var line3 = byId("line3");
        var verdict = byId("verdict");

        // ── Scene 1 (0.0–2.2): strip ref #A centred; values defocus on "kijkt niet in je array" ──
        // Strip sits centred (x offset 391 = (1920-938)/2 - 100) and in the middle band (y +120).
        tl.fromTo(byId("kicker"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0);
        tl.fromTo(rowOld, { x: 391, y: 120 }, { x: 391, y: 120, duration: 0.01 }, 0);
        tl.fromTo(roleOld, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        tl.fromTo(tagOld, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.02);
        tl.fromTo(
          oldCells,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.035 },
          0.06
        );
        // depth-of-field-blur: focal pull — values blur + dim, the ref tag stays sharp
        tl.to(oldVals, { "--dof": "5px", opacity: 0.3, duration: 0.75, ease: "power2.inOut" }, 0.47);

        // ── Scene 2 (2.2–5.3): layout opens; React's eye on "vergelijkt"; readout per word ──
        tl.to(rowOld, { x: 0, duration: 0.8, ease: "power3.inOut" }, 2.16);
        tl.fromTo(panel, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.3);
        tl.fromTo(eye, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 2.36);
        // the eye glances toward the strip, then back to the expression
        tl.fromTo(pupil, { x: 0 }, { x: -6, duration: 0.5, ease: "power3.inOut" }, 2.9);
        tl.to(pupil, { x: 0, duration: 0.5, ease: "power3.inOut" }, 3.6);

        // dynamic-content-sequencing: flat, pre-computed state table cued to the VO,
        // one linear driver, DOM written only on state transitions.
        var tokOud = byId("tok-oud");
        var tokEq = byId("tok-eq");
        var tokNieuw = byId("tok-nieuw");
        var SEQ_ITEMS = [tokOud, tokEq, tokNieuw, line2, line3];
        var SEQ = [
          { start: 0, shown: 0 },
          { start: 3.66, shown: 1 }, // "dezelfde"  → oud
          { start: 4.08, shown: 2 }, // "array"     → ===
          { start: 4.61, shown: 3 }, // "daarnet?"  → nieuw
          { start: 7.3, shown: 4 }, //  "hetzelfde" → #A === #A
          { start: 8.95, shown: 5 } //  "Dus"       → true
        ];
        function stateAt(t) {
          for (var i = SEQ.length - 1; i >= 0; i--) {
            if (t >= SEQ[i].start) return SEQ[i];
          }
          return SEQ[0];
        }
        var seqDriver = { t: 0 };
        var lastShown = -1;
        tl.to(
          seqDriver,
          {
            t: DURATION,
            duration: DURATION,
            ease: "none",
            onUpdate: function () {
              var s = stateAt(seqDriver.t);
              if (s.shown !== lastShown) {
                for (var i = 0; i < SEQ_ITEMS.length; i++) {
                  SEQ_ITEMS[i].style.opacity = i < s.shown ? "1" : "0";
                }
                lastShown = s.shown;
              }
            }
          },
          0
        );
        // arrival settle on each swapped item (transform channel only; opacity owned by the driver)
        SEQ_ITEMS.forEach(function (el, i) {
          tl.fromTo(el, { y: 14 }, { y: 0, duration: 0.4, ease: "power3.out" }, SEQ[i + 1].start);
        });

        // ── Scene 3 (5.3–8.8): "na een push" → oud / nieuw stacked, both ref #A ──
        tl.to(rowOld, { y: 0, duration: 0.6, ease: "power3.inOut" }, 5.3);
        tl.fromTo(roleOld, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 5.5);
        tl.fromTo(tagNew, { opacity: 0, y: -110 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.45);
        tl.fromTo(
          copyCells,
          { opacity: 0, y: -110 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: { each: 0.04, from: "center" } },
          5.5
        );
        // "push": the new element slides onto the end of the SAME strip
        tl.fromTo(
          pushCell,
          { opacity: 0, x: 70 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
          5.9
        );
        // "hetzelfde object": bracket draws between the two identical tags
        tl.fromTo(bracket, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.6, ease: "power3.out" }, 7.3);

        // asr-keyword-glow: one linear driver, attack/sustain/release over the spoken window,
        // applied to every "#A" (both tags + the readout) — ink glow, not coral.
        var GLOW_WORDS = root.querySelectorAll(".glow-word");
        var TIMINGS = { same: { start: 7.3, end: 8.88 } }; // "hetzelfde" … "object."
        var ATTACK_DUR = 0.2;
        var RELEASE = 0.45;
        var REST_LEVEL = 0.25;
        var MAX_BLUR = 18;
        var MAX_SCALE_BOOST = 0.1;
        function envelope(time, start, end) {
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
          var releaseEnd = end + RELEASE;
          if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
          return REST_LEVEL;
        }
        var glowDriver = { t: 0 };
        tl.to(
          glowDriver,
          {
            t: DURATION,
            duration: DURATION,
            ease: "none",
            onUpdate: function () {
              var tm = TIMINGS.same;
              var env = envelope(glowDriver.t, tm.start, tm.end);
              for (var i = 0; i < GLOW_WORDS.length; i++) {
                var el = GLOW_WORDS[i];
                el.style.textShadow = "0 0 " + (MAX_BLUR * env).toFixed(2) + "px rgba(20,20,19," + (0.35 * env).toFixed(3) + ")";
                el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(4) + ")";
              }
              var border = "rgba(20,20,19," + (0.2 + 0.45 * env).toFixed(3) + ")";
              tagOld.style.borderColor = border;
              tagNew.style.borderColor = border;
            }
          },
          0
        );

        // ── Scene 4 (8.8–12.0): readout resolves to true (driver, 8.95); coral verdict on "niets" ──
        tl.fromTo(
          verdict,
          { opacity: 0, x: -18 },
          { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
          10.3
        );
        // held read to the end — no exit
        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        // voice take: 12s → 12.82s (anchors from audio_meta.json words)
        var __retime = function (tl, M) {
          // Cues were authored against an earlier voice take; map each child's
          // start and end through the old→new word-anchor table M ([oldT, newT]).
          var m = function (t) {
            for (var i = 1; i < M.length; i++) {
              if (t <= M[i][0]) return M[i - 1][1] + (t - M[i - 1][0]) * (M[i][1] - M[i - 1][1]) / (M[i][0] - M[i - 1][0]);
            }
            return M[M.length - 1][1] + (t - M[M.length - 1][0]);
          };
