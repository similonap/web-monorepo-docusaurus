    <script>
      (function () {
        var DUR = 5.04;
        var $ = function (id) {
          return document.getElementById(id);
        };
        var card = $("01-hook-card");
        var input = $("01-hook-input");
        var placeholder = $("01-hook-placeholder");
        var textEl = $("01-hook-text");
        var caretEl = $("01-hook-caret");
        var btn = $("01-hook-btn");
        var ghost = $("01-hook-ghost");
        var q = $("01-hook-q");
        var r1 = $("01-hook-ripple-1");
        var r2 = $("01-hook-ripple-2");
        var cursor = $("01-hook-cursor");
        var rows = Array.prototype.slice.call(card.querySelectorAll(".hk01-data"));

        var tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0–0.9): card settles in, centred; rows land as one beat ----
        tl.fromTo(
          card,
          { opacity: 0, y: 36, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" },
          0.05,
        );
        rows.forEach(function (row, i) {
          tl.fromTo(
            row,
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            0.25 + i * 0.06,
          );
        });
        // ghost slot is not there yet
        tl.fromTo(ghost, { opacity: 0, y: 8 }, { opacity: 0, y: 8, duration: 0.01 }, 0);
        tl.fromTo(q, { opacity: 0, scale: 0 }, { opacity: 0, scale: 0, duration: 0.01 }, 0);

        // ---- Scene 2 (0.9–1.7): on "getal" the input takes focus and types 5 ----
        tl.fromTo(
          input,
          { borderColor: "rgba(20, 20, 19, 0.2)" },
          { borderColor: "rgba(20, 20, 19, 0.55)", duration: 0.25, ease: "power2.out" },
          0.6,
        );
        var SEQUENCE = [
          { t: 0.0, text: "" },
          { t: 1.02, text: "5" },
        ];
        function textAt(time) {
          for (var i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
          }
          return "";
        }
        var driver = { t: 0 };
        var render = function () {
          var s = textAt(driver.t);
          textEl.textContent = s;
          placeholder.style.opacity = s.length ? "0" : "1";
          // caret: off until focus (0.6s), then a deterministic 0.6s square-wave blink
          if (driver.t < 0.6) {
            caretEl.style.opacity = "0";
          } else {
            var phase = ((driver.t - 0.6) / 0.6) * Math.PI * 2;
            caretEl.style.opacity = Math.cos(phase) > -0.2 ? "1" : "0";
          }
        };
        tl.fromTo(
          driver,
          { t: 0 },
          { t: DUR, duration: DUR, ease: "none", onUpdate: render, onStart: render },
          0,
        );

        // ---- Scene 3 (1.7–2.6): on "klikt op Add" the cursor glides in and clicks ----
        var TIP_X = 1203;
        var TIP_Y = 213;
        var MOVE_AT = 1.66;
        var MOVE_DUR = 0.52;
        var CLICK_AT = 2.28; // lands on "Add"
        var PRESS = 0.1;
        var TIP_ORIGIN = "20.83% 12.5%";

        // cursor waits off-canvas (right) until its cue
        tl.set(cursor, { xPercent: -20.83, yPercent: -12.5, x: 2080, y: 640, scale: 1 }, 0);
        tl.fromTo(
          cursor,
          { xPercent: -20.83, yPercent: -12.5, x: 2080, y: 640, scale: 1 },
          {
            xPercent: -20.83,
            yPercent: -12.5,
            x: TIP_X,
            y: TIP_Y,
            duration: MOVE_DUR,
            ease: "power3.out",
          },
          MOVE_AT,
        );
        // cursor depresses more than the target, both on the same beat
        tl.to(
          cursor,
          { scale: 0.86, duration: PRESS, ease: "power2.in", transformOrigin: TIP_ORIGIN },
          CLICK_AT,
        );
        tl.to(
          cursor,
          { scale: 1, duration: 0.22, ease: "power2.out", transformOrigin: TIP_ORIGIN },
          CLICK_AT + PRESS,
        );
        // press-release-spring on the Add button: linear press, soft spring release
        tl.to(
          btn,
          {
            scale: 0.93,
            boxShadow: "0 1px 1px rgba(20, 20, 19, 0.2), 0 1px 3px rgba(20, 20, 19, 0.08)",
            duration: PRESS,
            ease: "power1.in",
          },
          CLICK_AT,
        );
        tl.to(
          btn,
          {
            scale: 1,
            boxShadow: "0 1px 3px rgba(20, 20, 19, 0.16), 0 6px 16px rgba(20, 20, 19, 0.1)",
            duration: 0.5,
            ease: "back.out(1.3)",
          },
          CLICK_AT + PRESS,
        );
        // ripple rings from the button centre
        tl.fromTo(
          [r1, r2],
          { scale: 0.4, opacity: 0.9 },
          {
            scale: 4,
            opacity: 0,
            duration: 0.7,
            ease: "power2.out",
            stagger: 0.09,
            immediateRender: false,
          },
          CLICK_AT + 0.02,
        );
        // cursor eases just below/right so the button stays readable
        tl.to(
          cursor,
          { x: TIP_X + 52, y: TIP_Y + 46, duration: 0.45, ease: "power2.inOut" },
          2.7,
        );

        // ---- Scene 4 (2.6–5.04): nothing changes. The slot stays empty. Then "?" ----
        tl.fromTo(
          ghost,
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: false },
          3.22, // "gebeurt"
        );
        tl.fromTo(
          q,
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out", immediateRender: false },
          4.3, // "niets"
        );

        // pad to full duration (held still)
        tl.set({}, {}, DUR);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        // voice take: 5.04s → 5.92s (anchors from audio_meta.json words)
        var __retime = function (tl, M) {
          // Cues were authored against an earlier voice take; map each child's
          // start and end through the old→new word-anchor table M ([oldT, newT]).
          var m = function (t) {
            for (var i = 1; i < M.length; i++) {
              if (t <= M[i][0]) return M[i - 1][1] + (t - M[i - 1][0]) * (M[i][1] - M[i - 1][1]) / (M[i][0] - M[i - 1][0]);
            }
            return M[M.length - 1][1] + (t - M[M.length - 1][0]);
          };
          tl.getChildren(false, true, true).forEach(function (c) {
            var s = c.startTime(), d = c.duration(), ns = m(s), ne = m(s + d);
            // duration() (not timeScale) so no tween renders — and locks its start values — at build time
            if (d > 0 && ne > ns && !c.getChildren) c.duration(ne - ns);
            c.startTime(ns);
          });
        };
        __retime(tl, [[0.0, 0.0], [0.1, 0.14], [0.24, 0.3], [0.59, 0.52], [0.89, 0.62], [1.6, 1.58], [1.72, 1.7], [2.12, 2.0], [2.28, 2.28], [2.33, 2.92], [2.88, 4.46], [3.18, 4.58], [4.26, 5.42], [5.04, 5.92]]);
        window.__timelines["01-hook"] = tl;
      })();
