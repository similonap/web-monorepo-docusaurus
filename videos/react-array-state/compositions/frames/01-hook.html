        // ---- Scene 1 (0.0–0.9): card settles in, centred; rows land as one beat ----

          0.6,

        var SEQUENCE = [
          { t: 0.0, text: "" },
          { t: 1.02, text: "5" },
        ];
        function textAt(time) {
          for (var i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
          }
          return "";

        var render = function () {
          var s = textAt(driver.t);

          placeholder.style.opacity = s.length ? "0" : "1";
