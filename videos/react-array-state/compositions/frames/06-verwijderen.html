    <script>
      (function () {
        var FRAME = "06-verwijderen";
        var DUR = 9.2;
        var tl = gsap.timeline({ paused: true });
        function $(id) {

        // ── geometry (shared recipe-stage grid) ─────────────────
        var TILE = 112;
        var STEP = 136; // tile + 24px gap
        var X0 = 564; // strip centred on 1920
        var ROW_B = 420;
        var ROW_C = 650;
        var GATE_Y = 612;
        var VALUES = [0, 1, 2, 3, 4, 5];
        var REJECT = 2;
        function colX(k) {

        }

        // ── build strip #B (old array) ──────────────────────────
        var stripB = $("stripB");
        var idxBEls = [];
        VALUES.forEach(function (v, k) {
          var t = document.createElement("div");
          t.className = "vw06-tile";
          t.style.left = colX(k) + "px";
          t.style.top = ROW_B + "px";
          t.innerHTML = '<span class="vw06-val">' + v + "</span>";
          stripB.appendChild(t);
          var ix = document.createElement("div");
          ix.className = "vw06-idx";
          ix.setAttribute("data-layout-allow-overflow", "");
          ix.style.left = colX(k) + "px";
          ix.style.top = ROW_B + TILE + 10 + "px";
          ix.textContent = k;
          stripB.appendChild(ix);
          idxBEls.push(ix);
        });

        // ── build the copies that pass through the gate ─────────
        var copiesWrap = $("copies");
        var copies = VALUES.map(function (v, k) {
          var t = document.createElement("div");
          t.className = "vw06-tile vw06-copy";
          t.setAttribute("data-layout-allow-overflow", "");
          t.style.left = colX(k) + "px";
          t.style.top = ROW_B + "px";
          t.innerHTML =
            (k === REJECT ? '<span class="vw06-reject-fill"></span>' : "") +
            '<span class="vw06-val">' + v + "</span>";
          copiesWrap.appendChild(t);
          return t;
        });

        // ── new indices for strip #C (0..4) ─────────────────────
        var idxCWrap = $("idxC");
        var idxCEls = [];
        for (var n = 0; n < VALUES.length - 1; n++) {
          var ic = document.createElement("div");
          ic.className = "vw06-idx";
          ic.style.left = colX(n) + "px";
          ic.style.top = ROW_C + TILE + 10 + "px";
          ic.textContent = n;
          idxCWrap.appendChild(ic);
          idxCEls.push(ic);
        }

        // ── code line, per-character (code-typing mechanics) ────
        var CODE = [
          ["setNumbers", "fn"],
          ["(", "pu"],
          ["prev", "id"],
          [" => ", "pu"],
          ["prev", "id"],
          [".", "pu"],
          ["filter", "fn"],
          ["((", "pu"],
          ["number", "id"],
          [", ", "pu"],
          ["index", "id"],
          [") => ", "pu"],
          ["index", "id"],
          [" !== ", "pu"],
          ["i", "id"],
          [")", "pu"],
          [");", "pu"],

        var lineEl = $("line");
        var chars = [];
        CODE.forEach(function (tok) {
          for (var c = 0; c < tok[0].length; c++) {
            var s = document.createElement("span");
            s.className = "vw06-ch vw06-" + tok[1];
            s.textContent = tok[0][c];
            lineEl.appendChild(s);
            chars.push({ el: s, ws: tok[0][c] === " " });
          }
        });
        var caret = document.createElement("div");
        caret.id = FRAME + "-caret";
        lineEl.appendChild(caret);
        var CH = 36 * 0.6; // JetBrains Mono advance = 0.6em

        // ───────────────────────────────────────────────────────
        // Scene 1 (0.0–1.5s): kicker + title on "Verwijderen"; strip #B already resting.
        tl.fromTo(
          $("kicker"),
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.05,
        );
        tl.fromTo(
          $("title"),
          { opacity: 0, y: 22, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
          0.12,
        );
        // empty code surface settles in under the title on "gebruik"
        tl.fromTo(
          $("code"),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.95,
        );

        // Scene 2 (1.5–3.0s): code types on "filter" (1.52s) — per-char reveal + gliding caret.
        var PER = 0.02;
        var T0 = 1.55;
        tl.set(caret, { x: 0, opacity: 0 }, 0);
        tl.set(caret, { opacity: 1 }, 1.3);
        chars.forEach(function (c, i) {
          var at = T0 + i * PER;
          tl.fromTo(
            c.el,
            { opacity: 0 },
            { opacity: 1, duration: c.ws ? 0.01 : 0.12, ease: "power1.out", immediateRender: true },
            at,
          );
          tl.to(caret, { x: (i + 1) * CH, duration: PER, ease: "none" }, at);
        });
        var typedEnd = T0 + chars.length * PER;
        // caret steps off after typing (blink-free, deterministic)
        tl.to(caret, { opacity: 0, duration: 0.2, ease: "power1.out" }, typedEnd + 0.5);

        // Scene 3 (3.0–5.3s): on "elk" (3.0s) the gate draws (svg-path-draw), tiles start passing.
        var gate = $("gatepath");
        var len = 0;
        try {
          len = gate.getTotalLength();
        } catch (e) {}
        if (!len) len = 14 + 832 + 14;
        len = len * 1.02;

          gate,
          { strokeDasharray: len, strokeDashoffset: len },

        tl.fromTo(

        copies.forEach(function (c) {

            { y: 0 },
            { y: DROP, duration: 0.62, ease: "power3.inOut", immediateRender: false },

        tl.to(idxBEls, { opacity: 0, duration: 0.3, ease: "power1.out" }, 3.3);
        pass(0, 3.55); // "element"
        pass(1, 4.3); // "behalve"

        // Scene 4 (5.3–6.5s): tile 2 hits the gate on "index i" and is rejected.
        var rej = copies[REJECT];
        var HIT = GATE_Y - TILE - 6 - ROW_B; // stops just above the gate line

        tl.fromTo(

        tl.to($("ilabel"), { opacity: 0, duration: 0.45, ease: "power1.out" }, 6.6);

        // the rest keep passing
        pass(3, 6.2);
        pass(4, 6.5);
        pass(5, 6.8);

        // Scene 5 (6.5–9.2s): on "nieuwe array" (7.65s) survivors close the gap → strip ref #C.
        var SETTLE = 7.65;
        [3, 4, 5].forEach(function (k, j) {
          tl.to(copies[k], { x: -STEP, duration: 0.7, ease: "power3.out" }, SETTLE + j * 0.06);
        });

          $("refC"),
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
          SETTLE + 0.1,

            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
            SETTLE + 0.3 + j * 0.06,

        });

        tl.to({}, { duration: DUR }, 0);

        window.__timelines = window.__timelines || {};
        // voice take: 9.2s → 9.84s (anchors from audio_meta.json words)
        var __retime = function (tl, M) {
          // Cues were authored against an earlier voice take; map each child's

          var m = function (t) {

            }
            return M[M.length - 1][1] + (t - M[M.length - 1][0]);
          };
          tl.getChildren(false, true, true).forEach(function (c) {
            var s = c.startTime(), d = c.duration(), ns = m(s), ne = m(s + d);
            // duration() (not timeScale) so no tween renders — and locks its start values — at build time
            if (d > 0 && ne > ns && !c.getChildren) c.duration(ne - ns);
            c.startTime(ns);
          });
        };
        __retime(tl, [[0.0, 0.0], [0.89, 1.32], [1.52, 1.78], [2.28, 3.04], [2.56, 3.14], [3, 3.42], [3.21, 3.66], [3.88, 4.16], [4.54, 4.6], [4.82, 4.84], [5.1, 5.42], [5.32, 5.78], [5.81, 6.28], [5.94, 6.96], [6.54, 7.16], [6.93, 8.14], [7.42, 8.6], [7.65, 8.82], [8.08, 9.14], [8.46, 9.48], [9.2, 9.84]]);
