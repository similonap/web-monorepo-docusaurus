    <script>
      (function () {

        var STEP = 144; // 120 tile + 24 gap
        var C_TOP = 490;
        var D_TOP = 700;

        var SWAP_I = 1;

        // ---------------- build strip C ----------------
        var stripC = $("stripC");
        var cTiles = [];
        var cIdx = [];
        VALUES.forEach(function (v, i) {
          var t = el("div", P + "tile", String(v));
          t.style.left = X0 + i * STEP + "px";
          t.style.top = C_TOP + "px";
          stripC.appendChild(t);
          cTiles.push(t);
          var ix = el("div", P + "idx", String(i));
          ix.style.left = X0 + i * STEP + "px";
          ix.style.top = C_TOP + 130 + "px";
          stripC.appendChild(ix);
          cIdx.push(ix);
        });

        // ---------------- build strip D (copies) ----------------
        var stripD = $("stripD");
        var dTiles = [];
        var dIdx = [];
        VALUES.forEach(function (v, i) {
          var t = el("div", P + "tile", i === SWAP_I ? null : String(v));
          t.style.left = X0 + i * STEP + "px";
          t.style.top = D_TOP + "px";
          if (i === SWAP_I) {
            t.id = P + "swap";
            var coral = el("div");
            coral.id = P + "coral";
            t.appendChild(coral);
            var old = el("div", null, String(v));
            old.id = P + "old";
            t.appendChild(old);
            var flip = el("div");
            flip.id = P + "flip";
            t.appendChild(flip);
          }
          stripD.appendChild(t);
          dTiles.push(t);
          var ix = el("div", P + "idx", String(i));
          ix.style.left = X0 + i * STEP + "px";
          ix.style.top = D_TOP + 130 + "px";
          stripD.appendChild(ix);
          dIdx.push(ix);

        // "i = 1" label that replaces index 1 under the swapped tile
        var ilbl = el("div", null, "i = 1");
        ilbl.id = P + "ilbl";
        ilbl.style.left = X0 + SWAP_I * STEP + "px";
        ilbl.style.top = D_TOP + 130 + "px";
        stripD.appendChild(ilbl);

        // ---------------- build code (per-char, code-typing mechanics) ----------------
        var LINES = [
          [
            ["setNumbers", ""],
            ["(", "p"],
            ["prev", ""],
            [" => ", "p"],
            ["prev", ""],
            [".", "p"],
            ["map", ""],
            ["((", "p"],
            ["oldNumber", ""],
            [", ", "p"],
            ["index", ""],
            [") ", "p"],
            ["=>", "p"],
          ],
          [
            ["  ", ""],
            ["index", ""],
            [" === ", "p"],
            ["i", ""],
            [" ? ", "p"],
            ["newNumber", ""],
            [" : ", "p"],
            ["oldNumber", ""],
            [")", "p"],
            [");", "p"],
          ],
        ];
        var code = $("code");
        var caret = $("caret");
        var CW = 24; // char advance
        var LH = 60;
        var lineChars = [];
        LINES.forEach(function (toks, row) {
          var line = el("div", P + "line");
          var chars = [];
          toks.forEach(function (tk) {
            for (var c = 0; c < tk[0].length; c++) {
              var s = el("span", P + "ch" + (tk[1] ? " " + P + tk[1] : ""), tk[0][c]);
              line.appendChild(s);
              chars.push({ el: s, ws: tk[0][c] === " " });
            }
          });
          code.insertBefore(line, caret);
          lineChars.push(chars);
        });

        // =================== TIMELINE ===================

        // ---- Scene 1 (0.0–1.4): kicker + title + strip ref #C ----
        tl.fromTo($("kicker"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
        tl.fromTo($("title"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.08);
        tl.fromTo($("tagC"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.12);
        cTiles.forEach(function (t, i) {
          tl.fromTo(t, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.14 + i * 0.05);
          tl.fromTo(cIdx[i], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.24 + i * 0.05);
        });
        // empty code surface settles in, waiting for "map"
        tl.fromTo($("panel"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);

        // ---- Scene 2 (1.4–2.0+): code types on "map." ----
        var PER = 0.018;
        var lineStarts = [1.3, 2.22];
        tl.set(caret, { x: 0, y: 0, opacity: 0 }, 0);
        tl.set(caret, { opacity: 1 }, 1.0);
        tl.set(caret, { opacity: 0 }, 1.14);
        tl.set(caret, { opacity: 1 }, 1.28);
        lineChars.forEach(function (chars, row) {
          chars.forEach(function (c, i) {
            var at = lineStarts[row] + i * PER;
            tl.fromTo(c.el, { opacity: 0 }, { opacity: 1, duration: c.ws ? 0.01 : 0.1, ease: "power1.out" }, at);
            tl.set(caret, { x: (i + 1) * CW, y: row * LH }, at);
          });

        tl.set(caret, { opacity: 0 }, 3.05);

        // ---- Scene 3 (2.0–5.0): every tile copies straight down into a new strip ----
        tl.fromTo($("dslot"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 2.0);
        tl.fromTo($("maplbl"), { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.03);
        tl.fromTo($("tagD"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 2.06);
        tl.set($("D"), { opacity: 0 }, 0);
        dTiles.forEach(function (t, i) {
          var at = 2.12 + i * 0.3;
          // copy peels off the original and settles one band lower
          tl.fromTo(t, { y: -DROP }, { y: 0, duration: 0.72, ease: "power3.out" }, at);
          tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, at);
          // the source tile acknowledges the pass

          tl.to(cTiles[i], { backgroundColor: "#efe9de", duration: 0.5, ease: "power1.out" }, at + 0.25);
          tl.fromTo(dIdx[i], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, at + 0.4);
        });
        // "nieuwe array" (4.18): the tag resolves ref #D, the dashed slot becomes a real array
        tl.to($("q"), { opacity: 0, duration: 0.18, ease: "power1.out" }, 4.16);
        tl.fromTo($("D"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.18);
        tl.fromTo($("tagD"), { borderColor: "rgba(20,20,19,0.2)", color: "rgba(20,20,19,0.78)" }, { borderColor: "rgba(20,20,19,0.45)", color: "rgba(20,20,19,1)", duration: 0.4, ease: "power1.out" }, 4.18);
        tl.to($("dslot"), { opacity: 0, duration: 0.5, ease: "power1.out" }, 4.24);

        // ---- Scene 4 (5.0–7.68): index i → flip to the new value ----
        var swap = $("swap");
        // "index" (5.55): the condition lights up in the code, index 1 becomes i = 1
        tl.fromTo($("hl"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 5.55);
        tl.to(dIdx[SWAP_I], { opacity: 0, duration: 0.2, ease: "power1.out" }, 5.6);
        tl.fromTo(ilbl, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.66);
        // "i" (5.98): that one tile steps forward
        tl.to(swap, { y: -10, borderColor: "rgba(20,20,19,0.45)", duration: 0.45, ease: "power3.out" }, 5.98);

        // hacker-flip-3d (number-only pool): 1 → 42, settling on "nieuwe waarde" (7.1)
        var oldEl = $("old");
        var flipEl = $("flip");
        var TARGET = "42";
        var GLYPHS = "0123456789";
        var FLIP_START = 6.62;
        var FLIP_DURATION = 0.6;
        var CHAR_STAGGER = 0.05;
        var REVEAL_THRESHOLD = 0.6;
        function pseudoGlyph(seed) {
          var h = ((seed * 9301 + 49297) % 233280) / 233280;
          return GLYPHS[Math.floor(h * GLYPHS.length)];
        }
        var fcs = [];
        for (var k = 0; k < TARGET.length; k++) {
          var s = el("span", P + "fc", TARGET[k]);
          s.dataset.target = TARGET[k];
          s.style.opacity = "0";
          s.style.transform = "rotateX(90deg)";
          flipEl.appendChild(s);
          fcs.push(s);
        }
        // the old value flaps away as the new glyphs start to fall in
        tl.to(oldEl, { opacity: 0, duration: 0.14, ease: "power1.in" }, FLIP_START);
        fcs.forEach(function (fc, i) {
          var state = { p: 0 };
          tl.fromTo(
            state,
            { p: 0 },
            {
              p: 1,
              duration: FLIP_DURATION,
              ease: "power3.out",
              onUpdate: function () {
                if (state.p < REVEAL_THRESHOLD) {
                  // ~3 frames per glyph swap at 30fps
                  fc.textContent = pseudoGlyph(i * 1000 + Math.floor(state.p * 6));
                } else {
                  fc.textContent = fc.dataset.target;
                }
                fc.style.transform = "rotateX(" + (90 - state.p * 90) + "deg)";
                fc.style.opacity = String(Math.min(1, state.p * 2));
              },
            },
            FLIP_START + i * CHAR_STAGGER,
          );
        });
        // the one voltage: the swapped tile turns coral as "42" clicks in
        tl.fromTo($("coral"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 6.98);
        tl.fromTo(flipEl, { color: "#141413" }, { color: "#faf9f5", duration: 0.3, ease: "power1.out" }, 6.98);
        tl.to(swap, { boxShadow: "0 1px 3px rgba(20,20,19,0.08), 0 4px 16px rgba(20,20,19,0.04)", borderColor: "rgba(204,120,92,1)", duration: 0.3, ease: "power1.out" }, 6.98);

        // hold to the end of the shot
        tl.to({}, { duration: 7.68 }, 0);

        window.__timelines = window.__timelines || {};
        // voice take: 7.68s → 8.64s (anchors from audio_meta.json words)
        var __retime = function (tl, M) {
          // Cues were authored against an earlier voice take; map each child's

          var m = function (t) {
            for (var i = 1; i < M.length; i++) {
              if (t <= M[i][0]) return M[i - 1][1] + (t - M[i - 1][0]) * (M[i][1] - M[i - 1][1]) / (M[i][0] - M[i - 1][0]);
            }
            return M[M.length - 1][1] + (t - M[M.length - 1][0]);
          };
          tl.getChildren(false, true, true).forEach(function (c) {
            var s = c.startTime(), d = c.duration(), ns = m(s), ne = m(s + d);
            // duration() (not timeScale) so no tween renders — and locks its start values — at build time
            if (d > 0 && ne > ns && !c.getChildren) c.duration(ne - ns);
            c.startTime(ns);
