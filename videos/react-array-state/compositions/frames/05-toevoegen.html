      (function () {
        var FID = "05-toevoegen";

        var tl = gsap.timeline({ paused: true });

        for (var i = 0; i < 5; i++) {

          t.style.left = (X0 + i * STRIDE) + "px";
          t.style.top = A_TOP + "px";
          aRings.push(mk("ring", t));

        var refBLetter = $("refB");
        var slots = [], bTiles = [], bIdx = [];
        for (var j = 0; j < 6; j++) {
          var s = mk("slot", strips);
          s.style.left = (X0 + j * STRIDE) + "px";
          s.style.top = B_TOP + "px";
          slots.push(s);
        }
        for (var k = 0; k < 6; k++) {
          var bt = mk(k === 5 ? "tile new" : "tile", strips, String(k));
          bt.style.left = (X0 + k * STRIDE) + "px";
          bt.style.top = B_TOP + "px";

        // ---------- code line (per-char, hand-set syntax on navy) ----------
        var line = $("line");
        var caret = $("caret");
        var hl = $("hl");
        var CREAM = "#FAF9F5", PUNCT = "rgba(250,249,245,0.55)", AMBER = "#E8A55A";
        var TOKENS = [
          ["setNumbers", CREAM], ["(", PUNCT], ["prev", CREAM], [" => ", PUNCT],
          ["[", PUNCT], ["...", AMBER], ["prev", CREAM], [",", PUNCT], [" ", CREAM],

        // ======== Scene 1 (0.0–1.8): kicker + title; strip #A already resting ========
        tl.fromTo($("kicker"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
        tl.fromTo($("title"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.15);

        tl.fromTo($("code"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.72);
        var PER = 0.028, T0 = 1.95;

        tl.to(caret, { opacity: 0, duration: 0.3, ease: "power1.out" }, 3.2);

        // ======== Scene 3 (3.1–4.4): "drie puntjes" → highlight band on `...` ========
        tl.fromTo(hl, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 3.14);
        [20, 21, 22].forEach(function (n, q) {

          tl.to(chars[n], { y: 0, duration: 0.35, ease: "power3.out" }, 3.54 + q * 0.07);

        // ======== Scene 4 (4.4–7.2): per-item stagger copy #A → empty strip; tag resolves #B ========
        tl.fromTo(refB, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.2);
        slots.forEach(function (s, n) {

        // dynamic-content-sequencing: pre-computed flat TIMELINE of copies (cued to "kopiëren alle oude elementen")
        var COPY_START = 4.45, BASE_DURATION = 0.3, PER_CHAR = 0.05;
        var CONTENT = [0, 1, 2, 3, 4].map(function (v) { return { value: String(v), index: v }; });

        var COPIES = CONTENT.map(function (e) {

          var start = cumulative;
          cumulative += d;
          return { value: e.value, index: e.index, start: start, end: cumulative };
        });
        COPIES.forEach(function (e) {

          tl.fromTo(aRings[n], { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, e.start);

          tl.fromTo(bIdx[n], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, e.start + 0.4);
        });

        // ref tag state sequence — DOM swap only on transition (key guard), seek-safe
        var TAG_STATES = [{ key: "#?", start: 0 }, { key: "#B", start: 6.6 }];
        function tagAt(time) {
          for (var i = TAG_STATES.length - 1; i >= 0; i--) if (time >= TAG_STATES[i].start) return TAG_STATES[i];
          return TAG_STATES[0];
        }
        var driver = { t: 0 };
        var lastKey = "";
        tl.to(driver, {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var st = tagAt(driver.t);
            if (st.key !== lastKey) {
              refBLetter.textContent = st.key;
              lastKey = st.key;
            }
          }
        }, 0);
        tl.fromTo(refBLetter, { opacity: 0.4 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 6.6);
        tl.fromTo(refB, { scale: 1 }, { scale: 1.06, duration: 0.18, ease: "power2.out", transformOrigin: "left center" }, 6.6);
        tl.to(refB, { scale: 1, duration: 0.45, ease: "power3.out" }, 6.8);

        // ======== Scene 5 (7.2–9.52): "daarachter" readies the end slot; "het nieuwe getal" → coral 5 slides on ========
        tl.to(slots[5], { opacity: 1, duration: 0.4, ease: "power2.out" }, 7.35);
        tl.fromTo(bTiles[5], { x: 260, y: 0, opacity: 0 }, { x: 0, duration: 0.75, ease: "power3.out" }, 8.5);
        tl.to(bTiles[5], { opacity: 1, duration: 0.22, ease: "power1.out" }, 8.5);
        tl.fromTo(bIdx[5], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 8.95);

        window.__timelines = window.__timelines || {};
        // voice take: 9.52s → 10.54s (anchors from audio_meta.json words)
        var __retime = function (tl, M) {

          var m = function (t) {

            }
            return M[M.length - 1][1] + (t - M[M.length - 1][0]);
