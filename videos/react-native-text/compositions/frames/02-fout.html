      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="02-fout"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }
      function fadeIn(sel, at, d) { tl.to(sel, { opacity: 1, duration: d || 0.35, ease: "power1.out" }, at); }
      function fadeOut(sel, at, d) { tl.to(sel, { opacity: 0, duration: d || 0.35, ease: "power1.inOut" }, at); }

      // type-on with a caret that steps per character (typeLine, adapted: the characters are
      // pre-rendered as .tc spans in the row, so values can sit inside .fx-val wrappers)
      function typeLine(rowSel, caretSel, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var chars = Array.prototype.slice.call(root.querySelectorAll(rowSel + " .tc"));
        var caret = q(caretSel);
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: col * CH }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: (col + i + 1) * CH }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return end;
      }
      // a row is inserted: the rows below slide down one row, the next line number fades in
      function insertRow(belowSel, toY, lnSel, at) {
        tl.to(belowSel, { y: toY, duration: 0.35, ease: "power3.out" }, at);
        if (lnSel) tl.to(lnSel, { opacity: 1, duration: 0.35, ease: "power1.out" }, at);
      }
      // scroll the code: line numbers and rows move together
      // (the rows that leave the view also fade out, so nothing lingers behind the title bar)
      function scrollCode(nn, rows, at) {
        tl.to(["#f" + nn + "-lns", "#f" + nn + "-lines"], { y: -34 * rows, duration: 0.6, ease: "power3.inOut" }, at);
        tl.to("#f" + nn + "-lns > div:nth-child(-n+" + rows + "), #f" + nn + "-lines > .fx-row:nth-child(-n+" + rows + ")",
          { opacity: 0, duration: 0.3, ease: "power1.inOut" }, at + 0.15);
      }
      function intro(nn) {
        tl.fromTo("#f" + nn + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#f" + nn + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }


      intro("02");

      // ---- 0.0-2.4: "Text" (1.40): wash on Text in the import ----
      washOn("#f02-hl-imp", 1.40);
      washOff("#f02-hl-imp", 2.40);

      // ---- 2.4-5.4: "tekst" (2.88): Hello World is typed straight into the View; "View" (4.08): wash on the View ----
      var e7 = typeLine("#f02-l7", "#f02-c7", 12, 2.88, 0.035);
      washOn("#f02-hl-hw", 3.32);
      washOn("#f02-hl-v1, #f02-hl-v2", 4.08);
      washOff("#f02-hl-hw, #f02-hl-v1, #f02-hl-v2", 5.0);

      // ---- 5.4-end: "foutmelding" (5.44): thin red mark on row 7, the error sheet comes up ----
      fadeIn("#f02-mark7", 5.44, 0.3);
      tl.fromTo("#f02-err", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.44);
      // the message reads along with the voice, word by word
      [6.56, 6.92, 7.20, 7.48, 7.60, 8.16, 8.40, 8.56, 8.88].forEach(function (t, i) {
        tl.to("#f02-w" + (i + 1), { opacity: 1, duration: 0.2, ease: "power1.out" }, t);
      });


      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["02-fout"] = tl;
    })();
  </script>
</template>
