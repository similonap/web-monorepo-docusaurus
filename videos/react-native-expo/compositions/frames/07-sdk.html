  <script>
    (function () {
      var DUR = 13.59;
      var CH = 13.2, ROW = 30; // JetBrains Mono 22px advance, line height
      var WASH = "rgba(49, 120, 198, 0.12)";
      var root = document.querySelector('[data-composition-id="07-sdk"]');
      var q = function (s) { return root.querySelector(s); };
      var CARET = "#f07-caret", SCROLL = "#f07-scroll";

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function show(sel, at) { tl.set(sel, { opacity: 1 }, at); }      // terminal output appears at once
      function hide(sel, at) { tl.set(sel, { opacity: 0 }, at); }
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      function caretAt(row, col, at) { tl.set(CARET, { x: col * CH, y: row * ROW, opacity: 1 }, at); }
      var LINES = Array.prototype.slice.call(root.querySelectorAll(SCROLL + " > .tm-line"));
      function offRows(rows) { return LINES.filter(function (el) { return parseFloat(el.style.top) < rows * ROW; }); }
      // scroll like a terminal; rows that left the window are hidden once the scroll settles
      function scrollTo(rows, at) {
        tl.to(SCROLL, { y: -rows * ROW, duration: 0.3, ease: "power2.out" }, at);
        tl.set(offRows(rows), { opacity: 0 }, at + 0.3);
      }

      // type text into a host span: block caret steps per character (caret lives inside .tm-scroll)
      function typeInto(hostSel, text, row, col, start, per) {
        var host = q(hostSel), chars = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span"); s.textContent = text[i]; host.appendChild(s); chars.push(s);
        }
        tl.set(chars, { opacity: 0 }, 0);
        chars.forEach(function (el, i) {
          tl.set(el, { opacity: 1 }, start + i * per);
          tl.set(CARET, { x: (col + i + 1) * CH, y: row * ROW, opacity: 1 }, start + i * per);
        });
        return col + text.length;
      }


      // initial state = last state of 06-create: rows 0-3, no caret
      tl.set("#f07-q4, #f07-q5, #f07-q6, #f07-q7, #f07-p24, #f07-c-sdk", { opacity: 0 }, 0);
      tl.set("#f07-scroll > .tm-line[id*='-s']", { opacity: 0 }, 0);

      // "Eerst vraagt Expo welke SDK versie je wil." (SDK 1.60)
      show("#f07-q4, #f07-q5, #f07-q6, #f07-q7", 1.60);

      // "Kies in deze cursus altijd Latest." (Latest 5.28)
      washOn("#f07-hl-latest", 5.28);
      tl.to("#f07-mark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 5.28);
      pop("#f07-c-sdk", 5.28);

      // return: the prompt collapses into the answered line (Daarna 6.32)
      hide("#f07-q4, #f07-q5, #f07-q6, #f07-q7, #f07-mark", 6.32);
      show("#f07-s4", 6.32);
      show("#f07-s5, #f07-s7, #f07-s8, #f07-s9", 6.5);

      // "Daarna installeert Expo alle packages." (installeert 6.84, packages 8.08)
      show("#f07-s11", 6.84);
      show("#f07-s12", 8.08);
      // "Dat duurt even," (even 9.52)
      show("#f07-s13", 9.9);
      show("#f07-s15, #f07-s16", 10.0);

      // "tot je ziet: your project is ready." (your 11.16): rest of the output + new prompt
      show("#f07-s18, #f07-s20, #f07-s21, #f07-s22, #f07-s23, #f07-p24", 11.16);
      scrollTo(3, 11.16);
      washOn("#f07-hl-ready", 11.16);
      caretAt(24, 27, 11.16);

      tl.set({}, {}, DUR);
      window.__timelines["07-sdk"] = tl;
    })();
  </script>
