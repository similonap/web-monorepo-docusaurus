  <script>
    (function () {
      var DUR = 12.87;
      var CH = 13.2; // JetBrains Mono 22px advance
      var WASH = "rgba(49, 120, 198, 0.12)";
      var RED = "#D14343";
      var root = document.querySelector('[data-composition-id="11-netwerk"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }

      // type into a span: block caret steps per character
      function typeInto(host, text, col, start, per) {
        var chars = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span"); s.textContent = text[i]; host.appendChild(s); chars.push(s);
        }
        tl.set(chars, { opacity: 0 }, 0);
        chars.forEach(function (el, i) {
          tl.set(el, { opacity: 1 }, start + i * per);
          tl.set("#f11-caret", { x: (col + i + 1) * CH }, start + i * per);
        });
        return col + text.length;
      }

      // initial state
      tl.set("#f11-stage > *:not(#f11-kicker)", { opacity: 0 }, 0);
      tl.set("#f11-w0, #f11-w1, #f11-w2, #f11-w3", { opacity: 0 }, 0);
      tl.set("#f11-caret", { x: 40 * CH, opacity: 0 }, 0);

      // "je computer" (1.24) / "en je telefoon" (2.00)
      pop("#f11-pc, #f11-lbl-pc", 1.24);
      pop("#f11-ph, #f11-lbl-ph", 2.0);

      // "op hetzelfde netwerk" (2.92 / 3.44)
      tl.set("#f11-wifi", { opacity: 1 }, 2.92);
      tl.to("#f11-w0", { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.92);
      tl.to("#f11-w1", { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.02);
      tl.to("#f11-w2", { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.12);
      tl.to("#f11-w3", { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.22);
      pop("#f11-lbl-net", 3.44);
      tl.fromTo("#f11-l1a, #f11-l1b, #f11-l2a, #f11-l2b", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, 3.44);

      // "Lukt het niet" (4.96): the links break, thin red
      tl.to(".f11-half", { backgroundColor: RED, height: 2, y: 0.5, scaleX: 0.72, duration: 0.45, ease: "power3.out" }, 4.96);
      tl.to(".f11-arc", { stroke: "#94A3B8", duration: 0.45, ease: "power2.out" }, 4.96);
      tl.to("#f11-w0", { fill: "#94A3B8", duration: 0.45, ease: "power2.out" }, 4.96);
      // "op het schoolnetwerk" (6.32)
      pop("#f11-school-wrap", 6.32);

      // "start dan met" (7.52): red steps back, caret wakes up in the terminal
      tl.to(".f11-half, #f11-school-wrap", { opacity: 0.35, duration: 0.5, ease: "power2.inOut" }, 7.52);
      tl.set("#f11-caret", { opacity: 1 }, 7.52);
      // "N P X expo start" (8.32)
      washOn("#f11-hl-cmd", 8.32);
      // "min min tunnel" (10.56 - 11.28)
      var col = typeInto(q("#f11-sp"), " ", 40, 10.56, 0.08);
      typeInto(q("#f11-hl-tun"), "--tunnel", col, 10.64, 0.08);
      washOn("#f11-hl-tun", 11.28);
      tl.set("#f11-caret", { opacity: 0 }, 11.4);
      // the tunnel route: computer -> tunnel -> phone
      tl.set("#f11-path", { opacity: 1 }, 11.28);
      tl.set("#f11-head", { opacity: 0 }, 11.28);
      tl.to("#f11-route", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 11.28);
      tl.to("#f11-head", { opacity: 1, duration: 0.2, ease: "power2.out" }, 11.98);
      pop("#f11-tunnel-wrap", 11.5);

      tl.set({}, {}, DUR);
      window.__timelines["11-netwerk"] = tl;
    })();
  </script>
