  <script>
    (function () {
      var DUR = 12.31;
      var CH = 13.2, ROW = 30; // JetBrains Mono 22px advance, line height
      var WASH = "rgba(49, 120, 198, 0.12)";
      var root = document.querySelector('[data-composition-id="08-reset"]');
      var q = function (s) { return root.querySelector(s); };
      var CARET = "#f08-caret", SCROLL = "#f08-scroll";

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function show(sel, at) { tl.set(sel, { opacity: 1 }, at); }      // terminal output appears at once
      function hide(sel, at) { tl.set(sel, { opacity: 0 }, at); }
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      function caretAt(row, col, at) { tl.set(CARET, { x: col * CH, y: row * ROW, opacity: 1 }, at); }
      var LINES = Array.prototype.slice.call(root.querySelectorAll(SCROLL + " > .tm-line"));
      function offRows(rows) { return LINES.filter(function (el) { return parseFloat(el.style.top) < rows * ROW; }); }
      // scroll like a terminal; rows that left the window are hidden once the scroll settles
      function scrollTo(rows, at) {
        tl.to(SCROLL, { y: -rows * ROW, duration: 0.3, ease: "power2.out" }, at);
        tl.set(offRows(rows), { opacity: 0 }, at + 0.3);
      }

      // type text into a host span: block caret steps per character (caret lives inside .tm-scroll)
      function typeInto(hostSel, text, row, col, start, per) {
        var host = q(hostSel), chars = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span"); s.textContent = text[i]; host.appendChild(s); chars.push(s);
        }
        tl.set(chars, { opacity: 0 }, 0);
        chars.forEach(function (el, i) {
          tl.set(el, { opacity: 1 }, start + i * per);
          tl.set(CARET, { x: (col + i + 1) * CH, y: row * ROW, opacity: 1 }, start + i * per);
        });
        return col + text.length;
      }


      // initial state = last state of 07-sdk: scrolled 3 rows, resting caret after the prompt
      tl.set(SCROLL, { y: -3 * ROW }, 0);
      tl.set(offRows(3), { opacity: 0 }, 0);
      tl.set("#f08-t2, #f08-p25, #f08-r27, #f08-r28, #f08-r30, #f08-n, #f08-p50, #f08-c-ans", { opacity: 0 }, 0);
      tl.set("#f08-scroll > .tm-line[id*='-d']", { opacity: 0 }, 0);
      caretAt(24, 27, 0);

      // "Ga met C D naar de map van je project" (C 0.56, D 0.88)
      var c = 27;
      c = typeInto("#f08-cd", "c", 24, c, 0.56, 0.08);
      c = typeInto("#f08-cd", "d", 24, c, 0.88, 0.08);
      c = typeInto("#f08-cd", " mijn-app", 24, c, 1.0, 0.08);
      // enter: new prompt in mijn-app, the window title follows the folder
      show("#f08-p25", 1.95);
      tl.set("#f08-t1", { opacity: 0 }, 1.95);
      show("#f08-t2", 1.95);
      scrollTo(4, 1.95);
      caretAt(25, 26, 1.95);

      // "met N P M run reset project" (N 4.72, P 4.96, M 5.20, run 5.68, reset 6.16, project 6.64)
      c = 26;
      c = typeInto("#f08-npm", "n", 25, c, 4.72, 0.08);
      c = typeInto("#f08-npm", "p", 25, c, 4.96, 0.08);
      c = typeInto("#f08-npm", "m ", 25, c, 5.20, 0.08);
      c = typeInto("#f08-npm", "run ", 25, c, 5.68, 0.08);
      c = typeInto("#f08-npm", "reset-", 25, c, 6.16, 0.07);
      c = typeInto("#f08-npm", "project", 25, c, 6.64, 0.07);
      // enter
      hide(CARET, 7.35);
      show("#f08-r27, #f08-r28", 7.4);
      scrollTo(8, 7.4);
      // "Op de vraag of je de bestanden wil bewaren" (vraag 7.92)
      show("#f08-r30", 7.92);
      scrollTo(9, 7.92);
      caretAt(30, 80, 7.92);

      // "antwoord je met N." (N 10.80)
      show("#f08-n", 10.80);
      tl.set(CARET, { x: 81 * CH }, 10.80);
      washOn("#f08-hl-n", 10.80);
      pop("#f08-c-ans", 10.80);
      // enter: the example code is removed, a clean src/app is created
      hide(CARET, 11.15);
      show("#f08-scroll > .tm-line[id*='-d'], #f08-p50", 11.2);
      scrollTo(29, 11.2);
      caretAt(50, 26, 11.2);

      tl.set({}, {}, DUR);
      window.__timelines["08-reset"] = tl;
    })();
  </script>
