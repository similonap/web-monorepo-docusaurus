      var WASH = "rgba(49, 120, 198, 0.12)";

      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }

        tl.set("#f03-caret", { x: X0 + col * CH, y: Y0 + row * ROW, opacity: 1 }, 0);

          tl.set(el, { opacity: 1 }, start + i * per);
          tl.set("#f03-caret", { x: X0 + (col + i + 1) * CH }, start + i * per);

        return start + text.length * per;
