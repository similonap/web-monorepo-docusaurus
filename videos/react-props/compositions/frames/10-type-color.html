      var per = 0.021;
      typeLine("#f10tc-line1", "#f10tc-caret1", [
        { id: "f10tc-hl-type", parts: [

      tl.to("#f10tc-hl-type", { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, 6.08);

      });
      tl.set(caret5, { opacity: 0 }, t5b + newCh.length * dPer + 0.1);

      // "drie waarden": the three strings pulse blue, one after another
      ["#f10tc-s-red", "#f10tc-s-green", "#f10tc-s-blue"].forEach(function (sel, j) {
        var at = 8.28 + j * 0.12;

        tl.to(chs, { color: "#0F7B6C", duration: 0.5, ease: "power1.inOut" }, at + 0.45);

      // ---- Scene 3 (9.3-13.74): mini App.tsx; squiggle on "TypeScript"; tooltip on "fout" ----
      // blue wash steps back so the red error mark is the only key moment
      tl.to("#f10tc-hl-type", { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, 9.36);
      tl.fromTo("#f10tc-mini", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 9.36);

      var sq = q("#f10tc-sq");
