    (function () {
      var DUR = 10.4;
      var CW = 0.6; // JetBrains Mono advance (em)
      var root = document.querySelector('[data-composition-id="05-component"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper (per-character reveal + stepping caret) ----
      function typeLine(lineSel, caretSel, segments, start, per, fs, x0, lead) {
        if (lead === undefined) lead = 0.06;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "f05c-hl";
            host.id = seg.id;
            line.appendChild(host);
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "f05c-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = fs * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: x0 }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.04, ease: "power1.out" }, at);
          tl.set(caret, { x: x0 + (i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return end;
      }

      // ---- Scene 1 (0.0-3.0): kicker + scherm (continuity), code on "component" ----
      tl.fromTo("#f05c-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);

      var per = 0.018, FS = 28, X0 = 76, gap = 0.04;
      var e = typeLine("#f05c-l1", "#f05c-c1", [
        { t: "const", c: "f05c-kw" },
        { t: " " },
        { id: "f05c-hl-badge", parts: [{ t: "Badge", c: "f05c-fn" }] },
        { t: " = () " },
        { t: "=>", c: "f05c-kw" },
        { t: " {" }

      e = typeLine("#f05c-l2", "#f05c-c2", [
        { t: "  " }, { t: "return", c: "f05c-kw" }, { t: " (" }
      ], e + gap, per, FS, X0, 0.02);
      e = typeLine("#f05c-l3", "#f05c-c3", [
        { t: "    " },
        { t: "<div", c: "f05c-dim" },
        { t: " style={{ color: " },
        { t: "'white'", c: "f05c-str" },
        { t: ", background: " },
        { t: "'green'", c: "f05c-str" },
        { t: " }}" },
        { t: ">", c: "f05c-dim" }
      ], e + gap, per, FS, X0, 0.02);
      e = typeLine("#f05c-l4", "#f05c-c4", [{ t: "      Nieuw" }], e + gap, per, FS, X0, 0.02);
      e = typeLine("#f05c-l5", "#f05c-c5", [{ t: "    " }, { t: "</div>", c: "f05c-dim" }], e + gap, per, FS, X0, 0.02);
      e = typeLine("#f05c-l6", "#f05c-c6", [{ t: "  );" }], e + gap, per, FS, X0, 0.02);
      typeLine("#f05c-l7", "#f05c-c7", [{ t: "}" }], e + gap, per, FS, X0, 0.02);

      // "Badge" (2.24) → coral wash on the component name (the fix, the one voltage)
      tl.to("#f05c-hl-badge", { backgroundColor: "rgba(204, 120, 92, 0.34)", duration: 0.35, ease: "power1.out" }, 2.24);

      // ---- Scene 2 (3.0-5.2): "één plek" → amber wash on lines 3-5 + 1x tag ----
      tl.fromTo("#f05c-wash", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 4.28);
      tl.fromTo("#f05c-tag", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.48);

      // ---- Scene 3 (5.2-9.9): mini App.tsx panel, three <Badge /> lines ----
      tl.fromTo("#f05c-mini", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 5.2);
      var MFS = 26, MX0 = 28, mper = 0.02;
      typeLine("#f05c-m1", "#f05c-mc1", [{ t: "<>", c: "f05c-dim" }], 5.5, mper, MFS, MX0, 0.02);
      typeLine("#f05c-m5", "#f05c-mc5", [{ t: "</>", c: "f05c-dim" }], 5.6, mper, MFS, MX0, 0.02);

      var badgeStarts = [6.52, 6.74, 6.96];
      badgeStarts.forEach(function (t0, i) {
        var n = i + 2;
        typeLine("#f05c-m" + n, "#f05c-mc" + n, [
          { t: "  " },
          { t: "<", c: "f05c-dim" },
          { t: "Badge", c: "f05c-fn" },
          { t: " />", c: "f05c-dim" }
        ], t0, mper, MFS, MX0, 0.02);
        tl.fromTo("#f05c-mr" + n, { scale: 0.96, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.3, ease: "power3.out" }, t0);
      });

      // "scherm blijft hetzelfde" (8.0 / 8.56) → strips pulse once with amber ring, note appears

        var t0 = 8.0 + i * 0.1;

        tl.to("#f05c-r" + n, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, t0 + 0.4);

      tl.fromTo("#f05c-note", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.56);

      window.__timelines["05-component"] = tl;
