      window.__timelines = window.__timelines || {};

      // ---- type-on helper (per-character reveal + stepping caret) ----
      function typeLine(lineSel, caretSel, segments, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        segments.forEach(function (p) {
          for (var i = 0; i < p.t.length; i++) {
            var s = document.createElement("span");
            s.className = "f11h-ch" + (p.c ? " " + p.c : "");
            s.textContent = p.t[i];
            line.appendChild(s);
            chars.push(s);
          }
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return end;
      }

      function badgeLine(label, color) {
        return [
          { t: "      " },
          { t: "<", c: "f11h-dim" },
          { t: "Badge", c: "f11h-fn" },
          { t: " label=" },

          { t: " color=" },
          { t: '"' + color + '"', c: "f11h-str" },
          { t: " />", c: "f11h-dim" }
        ];
      }

      function slideStrip(sel, at) {
        tl.fromTo(sel,
          { opacity: 0, x: -36, clipPath: "inset(0% 100% 0% 0%)" },
          { opacity: 1, x: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.out" }, at);
      }

      // ---- Scene 1 (0.0–3.5): kicker, code shell, empty scherm, note "1 component" ----
      tl.fromTo("#f11h-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
      tl.fromTo("#f11h-panel", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.15);
      tl.fromTo("#f11h-lab-scr", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);

      slideStrip("#f11h-s1", 4.16);

      slideStrip("#f11h-s3", 7.52);
