      var DUR = 9.68;
      var root = document.querySelector('[data-composition-id="03-kopieren"]');
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return root.querySelectorAll(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // geometry (absolute canvas px): row k top = 248 + (k-1)*38, text col c x = 164 + c*15.6
      var ROW = function (k) { return 248 + (k - 1) * 38; };
      var COL = function (c) { return 164 + c * 15.6; };
      var TIP = "20.83% 12.5%";

      // ---- initial states (seek-safe) ----
      tl.set(["#f03k-sel4", "#f03k-sel5", "#f03k-sel6"].map(q), { scaleX: 0, opacity: 1 }, 0);
      tl.set([q("#f03k-paste1"), q("#f03k-paste2")], { opacity: 0, y: 8 }, 0);
      tl.set([q("#f03k-bar1"), q("#f03k-bar2")], { opacity: 0, scaleY: 0 }, 0);
      tl.set(q("#f03k-tail"), { y: 0 }, 0);
      tl.set(qa(".f03k-n1"), { opacity: 0 }, 0);
      tl.set(qa(".f03k-n2"), { opacity: 0 }, 0);
      tl.set([q("#f03k-badge2"), q("#f03k-badge3")], { opacity: 0, y: 8 }, 0);
      tl.set(q("#f03k-chip"), { opacity: 0, scale: 0.92, y: ROW(5) }, 0);
      tl.set(q("#f03k-chip-v"), { yPercent: 100, opacity: 0 }, 0);
      tl.set(q("#f03k-cursor"), { xPercent: -20.83, yPercent: -12.5, x: 2080, y: 720, scale: 1 }, 0);

      // ---- Scene 1 (0.0–3.0): kicker; frame-2 code + one strip already on screen ----
      tl.fromTo("#f03k-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f03k-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      // "ergens anders" (1.68) → dashed empty slot for badge 2
      tl.fromTo("#f03k-slot2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.68);

      // ---- Scene 2 (3.0–4.8): "nog ergens anders" (3.6) → second dashed slot ----
      tl.fromTo("#f03k-slot3", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.6);

      // ---- Scene 3 (4.8–7.6): copy, then paste ----
      // cursor glides in, tip lands at the start of line 4
      tl.to("#f03k-cursor", { x: COL(6), y: ROW(4) + 6, duration: 0.5, ease: "power3.out" }, 4.62);
      // "kopieert" (5.16): press, then drag down to the end of line 6
      tl.to("#f03k-cursor", { scale: 0.92, duration: 0.08, ease: "power2.in", transformOrigin: TIP }, 5.12);
      tl.to("#f03k-cursor", { x: COL(12), y: ROW(6) + 30, duration: 0.5, ease: "power2.inOut" }, 5.18);
      tl.to("#f03k-sel4", { scaleX: 1, duration: 0.18, ease: "power1.out" }, 5.18);
      tl.to("#f03k-sel5", { scaleX: 1, duration: 0.16, ease: "power1.out" }, 5.33);
      tl.to("#f03k-sel6", { scaleX: 1, duration: 0.18, ease: "power1.out" }, 5.47);
      tl.to("#f03k-cursor", { scale: 1, duration: 0.18, ease: "power2.out", transformOrigin: TIP }, 5.68);
      // ⌘C chip pops above-right of the cursor tip
      tl.to("#f03k-chip", { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 5.72);

      // cursor moves to the insertion point (start of line 7)
      tl.to("#f03k-cursor", { x: COL(6), y: ROW(7) + 2, duration: 0.38, ease: "power3.out" }, 5.98);

      // "plakt" (6.4): click, ⌘C → ⌘V, lines 7–9 paste in, tail shifts down
      function click(t) {
        tl.to("#f03k-cursor", { scale: 0.92, duration: 0.08, ease: "power2.in", transformOrigin: TIP }, t - 0.06);
        tl.to("#f03k-cursor", { scale: 1, duration: 0.2, ease: "power2.out", transformOrigin: TIP }, t + 0.02);
      }
      click(6.4);
      tl.to("#f03k-chip", { y: ROW(6), duration: 0.25, ease: "power3.out" }, 6.4);
      tl.to("#f03k-chip-c", { yPercent: -100, opacity: 0, duration: 0.25, ease: "power3.out" }, 6.4);
      tl.to("#f03k-chip-v", { yPercent: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 6.4);
      tl.to(["#f03k-sel4", "#f03k-sel5", "#f03k-sel6"], { opacity: 0, duration: 0.3, ease: "power1.out" }, 6.4);

      tl.to("#f03k-tail", { y: 114, duration: 0.25, ease: "power3.out" }, 6.4);
      tl.set(qa(".f03k-n0"), { opacity: 0 }, 6.45);
      tl.set(qa(".f03k-n1"), { opacity: 1 }, 6.45);
      tl.to("#f03k-paste1", { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 6.42);
      tl.to("#f03k-bar1", { opacity: 1, scaleY: 1, duration: 0.3, ease: "power3.out" }, 6.46);
      // scherm: first slot fills with a green strip
      tl.to("#f03k-badge2", { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 6.42);
      tl.to("#f03k-slot2", { opacity: 0, duration: 0.2, ease: "power1.out" }, 6.42);

      // cursor eases off the code so the pasted lines read
      tl.to("#f03k-cursor", { x: 1112, y: 560, duration: 0.5, ease: "power3.out" }, 6.62);

      // ---- Scene 4 (7.6–9.18): "En nog eens" → second paste ----
      tl.to("#f03k-cursor", { x: COL(6), y: ROW(10) + 2, duration: 0.38, ease: "power3.out" }, 7.16);
      click(7.6);
      tl.to("#f03k-chip", { y: ROW(9), duration: 0.25, ease: "power3.out" }, 7.6);
      tl.fromTo("#f03k-chip", { scale: 0.92 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 7.6);

      tl.to("#f03k-tail", { y: 228, duration: 0.25, ease: "power3.out" }, 7.6);
      tl.set(qa(".f03k-n1"), { opacity: 0 }, 7.65);
      tl.set(qa(".f03k-n2"), { opacity: 1 }, 7.65);
      tl.to("#f03k-paste2", { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 7.62);
      tl.to("#f03k-bar2", { opacity: 1, scaleY: 1, duration: 0.3, ease: "power3.out" }, 7.66);
      tl.to("#f03k-badge3", { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 7.62);
      tl.to("#f03k-slot3", { opacity: 0, duration: 0.2, ease: "power1.out" }, 7.62);

      tl.to("#f03k-cursor", { x: 1112, y: 712, duration: 0.5, ease: "power3.out" }, 7.86);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["03-kopieren"] = tl;
    })();
  </script>
</template>
