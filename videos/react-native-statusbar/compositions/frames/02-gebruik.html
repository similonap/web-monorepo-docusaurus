  <script>
    (function () {
      var DUR = 13.51;
      var FS = 24, CW = 0.6, X0 = 0;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="02-gebruik"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function intro(nn) {
        tl.fromTo("#f" + nn + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#f" + nn + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }
      function hideEls(els, at, dur) { if (dur) tl.to(els, { autoAlpha: 0, duration: dur, ease: "power1.inOut" }, at); else tl.set(els, { autoAlpha: 0 }, at); }
      function showEls(els, at, dur) { if (dur) tl.to(els, { autoAlpha: 1, duration: dur, ease: "power1.inOut" }, at); else tl.set(els, { autoAlpha: 1 }, at); }

      // start: row 7 absent (rows 8-11 one row up, line 11 hidden); second screen waits to the right
      tl.set("#f02-below", { y: -34 }, 0);
      hideEls("#f02-ln11", 0);
      tl.set("#f02-details", { x: 226 }, 0);
      intro("02");

      // ---- 0.0-3.4: "importeert" (0.36): row 2 typed; "expo status bar" (1.92): wash on the package ----
      typeLine("#f02-l2", "#f02-c2", [
        { t: "import", c: "ts-kw" }, { t: " {StatusBar} ", c: "" }, { t: "from", c: "ts-kw" }, { t: " ", c: "" },
        { id: "f02-hl-pkg", parts: [{ t: "\"expo-status-bar\"", c: "ts-str" }] }, { t: ";", c: "" }
      ], 0, 0.40, 0.02);
      washOn("#f02-hl-pkg", 1.92);
      washOff("#f02-hl-pkg", 3.3);

      // ---- 3.4-5.7: "niets" (4.40): only the status bar is marked in the phone ----
      tl.to("#f02-bmark", { opacity: 1, duration: 0.3, ease: "power1.out" }, 4.40);

      // ---- 5.7-9.9: "Zet hem" (5.76): row 7 opens up and <StatusBar/> is typed ----
      tl.to("#f02-below", { y: 0, duration: 0.35, ease: "power3.out" }, 5.76);
      showEls("#f02-ln11", 5.76, 0.2);
      typeLine("#f02-l7", "#f02-c7", [
        { id: "f02-hl-sb", parts: [{ t: "<", c: "ts-punct" }, { t: "StatusBar", c: "ts-fn" }, { t: "/>", c: "ts-punct" }] }
      ], 12, 5.86, 0.03);
      // "Slot" (7.44): wash on rows 7-8
      washOn("#f02-hl-sb, #f02-hl-slot", 7.44);
      // "al je schermen" (9.04): the app pushes to the second screen, the status bar stays put
      tl.to("#f02-home", { x: -226, opacity: 0, duration: 0.5, ease: "power3.inOut" }, 9.04);
      tl.to("#f02-details", { x: 0, duration: 0.5, ease: "power3.inOut" }, 9.04);
      washOff("#f02-hl-sb, #f02-hl-slot", 9.9);
      tl.to("#f02-bmark", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 9.9);

      // ---- 9.9-end: "lege tags" (10.32): wash on <> and </>; "fragment" (11.96): marks + label ----
      washOn("#f02-hl-open, #f02-hl-close", 10.32);
      tl.to("#f02-mk-open, #f02-mk-close", { opacity: 1, duration: 0.35, ease: "power2.out" }, 11.96);
      tl.fromTo("#f02-ftag", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 11.96);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["02-gebruik"] = tl;
    })();
  </script>
