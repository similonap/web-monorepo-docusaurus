  <script>
    (function () {
      var DUR = 13.91;
      var CH = 14.4; // JetBrains Mono 24px advance
      var NCH = 15.6; // JetBrains Mono 26px advance (row labels)
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="03-style"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }

      // type-on into an inline box that grows per character (text after it moves along);
      // the caret (.ts-caret in the row) steps per character
      function typeInto(hostSel, caretSel, parts, col, start, per, growSel) {
        growSel = growSel || hostSel;
        var host = q(hostSel), caret = q(caretSel), chars = [];
        parts.forEach(function (p) {
          for (var i = 0; i < p.t.length; i++) {
            var s = document.createElement("span");
            s.className = "ts-ch" + (p.c ? " " + p.c : "");
            s.textContent = p.t[i];
            host.appendChild(s);
            chars.push(s);
          }
        });
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: col * CH }, start - 0.1);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.set(growSel, { width: (i + 1) * CH }, at);
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: (col + i + 1) * CH }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return end;
      }

      // row pop: opacity, y 10 -> 0, scale 0.96 -> 1
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      // the tint pill moves to a row label (row top, label length in chars)
      function pillTo(rowTop, chars, at) { tl.to("#f03-pill", { y: rowTop - 240, width: chars * NCH + 16, duration: 0.35, ease: "power3.out" }, at); }

      // ---- intro: kicker, panel ----
      tl.fromTo("#f03-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f03-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f03-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);

      // ---- 0.0-3.8: "style prop" (0.32): ` style=` typed after <StatusBar, wash on it ----
      var tAttr = typeInto("#f03-attr", "#f03-c7", [{ t: " style", c: "" }, { t: "=", c: "ts-punct" }], 22, 0.40, 0.03);
      washOn("#f03-attr", tAttr);
      // "tekst" (2.28) / "iconen" (2.88): the two headers fade in
      tl.fromTo("#f03-hl", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.28);
      tl.fromTo("#f03-hd", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.88);
      washOff("#f03-attr", 3.5);

      // ---- 3.8-7.1: "Dark" (3.84): "dark" typed, row dark pops in, pill on its label ----
      // the typed chars go into #f03-v1 (the first variant); the wrapper #f03-val grows
      var tVal = typeInto("#f03-v1", "#f03-c7", [{ t: "\"dark\"", c: "ts-str" }], 29, 3.84, 0.03, "#f03-val");
      washOn("#f03-val", tVal);
      pop("#f03-r1", 3.84);
      tl.fromTo("#f03-pill", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out", immediateRender: false }, 3.84);
      // "light" (5.52): value -> "light", row light pops in
      swapVal("#f03-v1", "#f03-v2", "#f03-val", 7, 5.52);
      pop("#f03-r2", 5.52);
      pillTo(352, 7, 5.52);

      // ---- 7.1-10.6: "Auto" (7.20): value -> "auto", row auto pops in ----
      swapVal("#f03-v2", "#f03-v3", "#f03-val", 6, 7.20);
      pop("#f03-r3", 7.20);
      pillTo(464, 6, 7.20);
      // "light" (8.16): wash on the light-mode cell; "dark mode" (8.64): wash moves to the dark-mode cell
      tl.to("#f03-cell", { opacity: 1, duration: 0.3, ease: "power1.out" }, 8.16);
      tl.to("#f03-cell", { x: 260, duration: 0.35, ease: "power3.out" }, 8.64);
      tl.to("#f03-cell", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 10.2);

      // ---- 10.6-end: "inverted" (10.64): value -> "inverted", row inverted pops in ----
      swapVal("#f03-v3", "#f03-v4", "#f03-val", 10, 10.64);
      pop("#f03-r4", 10.64);
      pillTo(576, 10, 10.64);
      // "omgekeerde" (12.08): mark around the auto and inverted rows' cells
      tl.to("#f03-mark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 12.08);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["03-style"] = tl;
    })();
  </script>
