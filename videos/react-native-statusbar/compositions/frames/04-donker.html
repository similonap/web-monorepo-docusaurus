  <script>
    (function () {
      var DUR = 13.75;
      var CH = 14.4; // JetBrains Mono 24px advance
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="04-donker"]');

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }

      // ---- APP KIT helpers ----
      // chip / label pop: opacity, y 10 -> 0, scale 0.96 -> 1
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      function intro(nn) {
        tl.fromTo("#f" + nn + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#f" + nn + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }
      // rows outside the 18-row window are hidden (not only clipped), by final row number
      function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }
      function rowEls(nn, idxs) { var r = root.querySelectorAll("#f" + nn + "-lines .fx-row"); return idxs.map(function (i) { return r[i - 1]; }); }
      function lnEls(nn, idxs) { var r = root.querySelectorAll("#f" + nn + "-lns > div"); return idxs.map(function (i) { return r[i - 1]; }); }
      function hideEls(els, at, dur) { if (dur) tl.to(els, { autoAlpha: 0, duration: dur, ease: "power1.inOut" }, at); else tl.set(els, { autoAlpha: 0 }, at); }
      // ---- end APP KIT helpers ----

      // ---- 0.0-1.8: kicker, panel and phone in ----
      intro("04");
      hideEls(rowEls("04", range(19, 24)).concat(lnEls("04", range(19, 24))), 0);

      // ---- 1.8-6.3: "stijlobject" (1.84): wash on style={styles.container}; "View" (3.60): mark ----
      washOn("#f04-hl-r7", 1.84);
      tl.to("#f04-mark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 3.6);
      tl.to("#f04-mark", { opacity: 0, duration: 0.35, ease: "power1.inOut" }, 4.9);
      // "vier waarden" (5.12): wash moves to style="dark"; the four values pop above the phone
      washOff("#f04-hl-r7", 5.12);
      washOn("#f04-hl-pre, #f04-cv", 5.12);
      pop("#f04-ch-auto", 5.12);
      pop("#f04-ch-dark", 5.2);
      pop("#f04-ch-light", 5.28);
      pop("#f04-ch-inv", 5.36);
      washOff("#f04-hl-pre, #f04-cv", 6.2);

      // ---- 6.3-10.7: "donkere achtergrond" (7.12): wash on the backgroundColor ----
      washOn("#f04-hl-bg", 7.12);
      // "onleesbaar" (9.60): thin red outline around the unreadable bar; the dark chip is unwanted
      tl.to("#f04-barwrong", { opacity: 1, duration: 0.3, ease: "power1.out" }, 9.6);
      tl.to("#f04-ch-dark", { borderColor: "#D14343", borderWidth: 2, duration: 0.3, ease: "power1.out" }, 9.6);
      washOff("#f04-hl-bg", 10.4);

      // ---- 10.7-end: "Zet style" (10.80): every red mark off ----
      tl.to("#f04-barwrong", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 10.8);
      tl.to("#f04-ch-dark", { borderColor: "#E2E8F0", borderWidth: 1, duration: 0.3, ease: "power1.inOut" }, 10.8);
      // "light" (12.08): "dark" -> "light", the status bar ink turns white, blue outline around it
      tl.set("#f04-cv", { borderRadius: 4 }, 12.0);
      swapVal("#f04-cv-dark", "#f04-cv-light", "#f04-cv", 7, 12.08);
      washOn("#f04-cv", 12.08);
      tl.to("#f04-status", { color: "#FFFFFF", duration: 0.35, ease: "power2.out" }, 12.08);
      tl.to("#f04-ch-light", { backgroundColor: "#EAF2FB", borderColor: "#3178C6", duration: 0.35, ease: "power1.out" }, 12.08);
      tl.to("#f04-barok", { opacity: 1, duration: 0.35, ease: "power1.out" }, 12.08);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["04-donker"] = tl;
    })();
