      var root = document.querySelector('[data-composition-id="05-finally"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length };
      }

      function drawPrep(sel) {
        var el = q(sel);
        var len = el.getTotalLength ? el.getTotalLength() : 1200;
        tl.set(el, { strokeDasharray: len, strokeDashoffset: len }, 0);
        return el;
      }

      // ---- spinner: turns the whole frame, timeline-driven ----
      tl.fromTo("#f05f-spinner", { rotation: 0, transformOrigin: "50% 50%" },
        { rotation: 360 * 14, duration: DUR, ease: "none" }, 0);

      // ---- Scene 1 (0.0-3.4): kicker; "loopt het mis" wash on throw; "springen" arrow; "catch." wash ----
      tl.fromTo("#f05f-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f05f-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.to("#f05f-hl-throw", { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, 0.6);

      var arrow = drawPrep("#f05f-arrow");
      tl.set("#f05f-arrowhead", { opacity: 0 }, 0);
      tl.to(arrow, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 1.6);
      tl.to("#f05f-arrowhead", { opacity: 1, duration: 0.15, ease: "power1.out" }, 2.12);

      tl.to("#f05f-hl-throw", { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, 2.92);
      tl.to("#f05f-hl-catch", { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, 2.92);

      // ---- Scene 2 (3.4-7.9): red box on skipped line; dims; loading note ----
      tl.to("#f05f-hl-catch", { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, 3.6);
      tl.fromTo("#f05f-box", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 3.7);
      tl.to("#f05f-r11", { opacity: 0.4, duration: 0.5, ease: "power2.out" }, 4.96);
      tl.fromTo("#f05f-note", { opacity: 0, y: 10, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 6.16);

      // ---- Scene 3 (7.9-14.1): the move into finally ----
      tl.to("#f05f-box", { opacity: 0, duration: 0.35, ease: "power2.out" }, 8.4);
      tl.to(["#f05f-arrow", "#f05f-arrowhead"], { opacity: 0, duration: 0.35, ease: "power2.out" }, 8.4);
      tl.fromTo("#f05f-ln18", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 8.5);

      // FLIP: line 11 lifts out, slides down to slot 13, settles back in
      tl.to("#f05f-r11", { x: 28, opacity: 1, duration: 0.2, ease: "power2.out" }, 8.4);
      tl.to("#f05f-r11", { y: 3 * LH, duration: 0.6, ease: "power3.out" }, 8.5);
      tl.to("#f05f-r11", { x: 0, duration: 0.35, ease: "power3.out" }, 9.0);
      // reflow: catch block up one slot, tail down one slot
      tl.to(["#f05f-r12", "#f05f-r13", "#f05f-r14"], { y: -LH, duration: 0.6, ease: "power3.out" }, 8.5);
      tl.to(["#f05f-r15", "#f05f-r16", "#f05f-r17"], { y: LH, duration: 0.6, ease: "power3.out" }, 8.5);
      // `} finally {` and closing `}` type in
      var f = typeLine("#f05f-line14", "#f05f-caret14", [
        { t: " " },
        { id: "f05f-hl-finally", parts: [{ t: "finally", c: "ts-kw" }] },
        { t: " {" }
      ], 5, 8.75, 0.03);
      typeLine("#f05f-linenew", "#f05f-caretnew", [{ t: "    }" }], 0, f.end + 0.08, 0.03, 0.04);

      // "finally." (9.92): blue wash
      tl.to("#f05f-hl-finally", { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, 9.92);

      // "altijd," (11.44): chip lukt + connector
      var linkOk = drawPrep("#f05f-link-ok");
      var linkKo = drawPrep("#f05f-link-ko");
      tl.set("#f05f-link-dot", { opacity: 0 }, 0);
      tl.fromTo("#f05f-ok", { opacity: 0, y: 10, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 11.44);
      tl.to(linkOk, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 11.54);
      tl.to("#f05f-link-dot", { opacity: 1, duration: 0.2, ease: "power1.out" }, 11.94);

      // "of niet." (12.96): chip mislukt + connector to the same spot
      tl.fromTo("#f05f-ko", { opacity: 0, y: 10, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 12.96);
      tl.to(linkKo, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 13.06);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["05-finally"] = tl;
    })();
  </script>
</template>
