      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // fade + small rise / drop
      function fadeIn(sel, at, fromY, dur) {
        tl.fromTo(sel, { opacity: 0, y: fromY }, { opacity: 1, y: 0, duration: dur || 0.45, ease: "power3.out", immediateRender: false }, at);
      }
      // arrow: shaft draws from the left, then the small solid head fades in
      function arrow(n, at) {
        tl.to("#f02p-s" + n, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, at);
        tl.to("#f02p-h" + n, { opacity: 1, duration: 0.15, ease: "power1.out" }, at + 0.22);
      }

      // ---- 0.0-2.8: kicker; panel with the static lines in at 0.1; "webshop" (0.40) hold ----
      tl.fromTo("#f02p-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f02p-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f02p-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);

      // ---- 2.8-7.0: route stack (one route per product) ----
      // "aparte route" (2.88): chips 1-3 drop in, stagger 0.15
      fadeIn("#f02p-r1", 2.88, -8);
      fadeIn("#f02p-r2", 3.03, -8);
      fadeIn("#f02p-r3", 3.18, -8);
      // "lukt niet" (4.32): thin red outline around the stack
      tl.to("#f02p-outline", { opacity: 1, duration: 0.3, ease: "power1.out" }, 4.32);
      // "voortdurend producten bij" (5.24): chips 4-6, stagger 0.2; outline grows with them
      [4, 5, 6].forEach(function (n, i) {
        var at = 5.24 + i * 0.2;
        fadeIn("#f02p-r" + n, at, -8);
        tl.to("#f02p-outline", { height: 192 + (i + 1) * 60, duration: 0.45, ease: "power3.out" }, at);
      });
      // "Daarom" (7.04): the stack fades out
      tl.to("#f02p-stack", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 7.04);

      // ---- 7.0-12.7: "products slash dubbelpunt id" (10.20): line 7 types ----
      var l7 = typeLine("#f02p-l7", "#f02p-c7", [
        { t: "      { path: " },
        { t: "\"products/:id\"", c: "ts-str" },
        { t: ", element: " },
        { t: "<", c: "ts-punct" },
        { t: "ProductDetail", c: "ts-fn" },
        { t: " />", c: "ts-punct" },
        { t: " }," }
      ], 0, 10.2, 0.016);
      // "dubbelpunt" (11.12): blue key box on "products/:id"; large products/:id in the right column
      tl.fromTo("#f02p-mark7", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 11.12);
      tl.to("#f02p-st-a", { opacity: 0, y: -12, duration: 0.25, ease: "power2.out" }, 11.12);
      tl.fromTo("#f02p-st-b", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, 11.12);
      fadeIn("#f02p-big", 11.12, 10, 0.5);
      tl.fromTo("#f02p-bigmark", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 11.4);

      // ---- 12.7-16.0: "Het dubbelpunt" (13.00) wash on :id; "plaatshouder" (14.76) label + line ----
      washOn("#f02p-hl-id", 13.0);
      tl.fromTo("#f02p-pline", { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 14.76);
      fadeIn("#f02p-plabel", 14.76, 8);

      // ---- 16.0-end: two URLs, same component, other data ----
      // "slash één" (17.44): row 1
      fadeIn("#f02p-u1", 17.44, 8);
      arrow(1, 17.6);
      fadeIn("#f02p-k1", 17.76, 8);
      // "twee" (19.60): row 2
      fadeIn("#f02p-u2", 19.6, 8);
      arrow(2, 19.76);
      fadeIn("#f02p-k2", 19.92, 8);
      // "dezelfde component" (20.80): both chips selected
      tl.to(["#f02p-k1", "#f02p-k2"], { backgroundColor: "#EAF2FB", borderColor: "#3178C6", duration: 0.35, ease: "power1.out" }, 20.8);
      // "andere data" (22.72): data notes
      fadeIn(["#f02p-d1", "#f02p-d2"], 22.72, 6, 0.4);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["02-route"] = tl;
    })();
  </script>
