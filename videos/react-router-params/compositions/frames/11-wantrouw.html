      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // ---- 0.0-3.8: kicker; panel (lines 4-7 static) in at 0.1; card present from the start; "URL" (1.44) wash on the address row ----

      tl.fromTo("#f11w-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);

      tl.fromTo("#f11w-banana-ul", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 5.0);

      washOn("#f11w-hl-eq", 6.24);
      washOff("#f11w-hl-eq", 8.44);
      washOn("#f11w-hl-def", 8.44);
      tl.fromTo("#f11w-chip-sort", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 9.12);
      tl.to("#f11w-sort-ring", { opacity: 1, duration: 0.2, ease: "power2.out" }, 9.12);
      tl.to("#f11w-sort-ring", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 10.0);

      // ---- 9.9-end: "sort" (10.64) line 1 types + wash SortField; "order" (11.40) line 2 types + wash SortOrder ----
      washOff("#f11w-hl-def", 10.64);
      washOn("#f11w-hl-sf", 10.64);
      typeLine("#f11w-l1", "#f11w-c1", [
        { t: "type", c: "ts-kw" },

        { t: "SortField", c: "ts-type" },

      washOn("#f11w-hl-so", 11.4);
      typeLine("#f11w-l2", "#f11w-c2", [

        { t: " " },
        { t: "SortOrder", c: "ts-type" },

        { t: "\"asc\"", c: "ts-str" },
        { t: " | ", c: "ts-punct" },
        { t: "\"desc\"", c: "ts-str" },
        { t: ";" }
      ], 0, 11.4, 0.021);

      // "correct type" (12.88): SortField chip; "null" (14.56): ghost `string | null` (struck, 35%)

      tl.fromTo("#f11w-chip-ghost", { opacity: 0, y: 10 }, { opacity: 0.35, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 14.56);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["11-wantrouw"] = tl;
    })();
