  <script>
    (function () {
      var DUR = 17.43;
      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 26;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="15-promise-all"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper (series standard; this frame has no typing) ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      var SEC = 1280 / 3; // 426.67 px per second
      var AWAITS = ["#f13p-hl-aw1", "#f13p-hl-aw2", "#f13p-hl-aw3"];
      var SEQ = ["#f13p-seq1", "#f13p-seq2", "#f13p-seq3"];
      var SFILL = ["#f13p-sfill1", "#f13p-sfill2", "#f13p-sfill3"];
      var STXT = ["#f13p-stxt1", "#f13p-stxt2", "#f13p-stxt3"];
      var GHOSTS = ["#f13p-ghost1", "#f13p-ghost2", "#f13p-ghost3"];
      var PAR = ["#f13p-par1", "#f13p-par2", "#f13p-par3"];
      var PFILL = ["#f13p-pfill1", "#f13p-pfill2", "#f13p-pfill3"];
      var PTXT = ["#f13p-ptxt1", "#f13p-ptxt2", "#f13p-ptxt3"];

      // start state: code A present; card, timeline and clock hidden
      gsap.set(SFILL.concat(PFILL), { scaleX: 0, transformOrigin: "left center" });
      gsap.set(SEQ.concat(PAR, GHOSTS), { opacity: 0 });
      gsap.set(STXT.concat(PTXT), { opacity: 0 });
      gsap.set(["#f13p-card", "#f13p-tl"], { opacity: 0, y: 16 });
      gsap.set("#f13p-now", { opacity: 0, x: 0 });
      gsap.set("#f13p-cv3", { opacity: 0, y: 0 });
      gsap.set("#f13p-cv1", { opacity: 0, y: 10 });

      // ---- 0.0-2.8: kicker; "na elkaar" (0.56) wash on the three awaits (off 2.8) ----
      tl.fromTo("#f13p-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f13p-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      washOn(AWAITS, 0.56);
      washOff(AWAITS, 2.8);

      // ---- 2.8-9.4: "drie pizza's" (3.97) card with labels + axis ----
      tl.to(["#f13p-card", "#f13p-tl"], { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.97);

      // "na elkaar" (4.88): bars one after the other, now-line follows
      var SEQ_T = [4.88, 5.48, 6.08];
      var SEG = 0.60;
      SEQ_T.forEach(function (t0, i) {
        tl.to(SEQ[i], { opacity: 1, duration: 0.25, ease: "power3.out" }, t0);
        tl.to(STXT[i], { opacity: 1, duration: 0.3, ease: "power3.out" }, t0 + 0.05);
        tl.to(SFILL[i], { scaleX: 1, duration: SEG, ease: "none" }, t0);
      });
      tl.to("#f13p-now", { opacity: 1, duration: 0.2, ease: "power1.out" }, 4.88);
      tl.to("#f13p-now", { x: 3 * SEC, duration: 6.68 - 4.88, ease: "none" }, 4.88);
      // "drie keer zo lang" (8.08-8.72): clock 3,0 s
      tl.to("#f13p-cv3", { opacity: 1, duration: 0.35, ease: "power3.out" }, 8.72);

      // ---- 9.4-13.4: "elkaar niet nodig": hold ----

      // ---- 13.4-end: "promise punt all" (13.44): version B, wash on Promise.all ----
      tl.to("#f13p-codeA", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 13.44);
      tl.to("#f13p-codeB", { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 13.44);
      washOn("#f13p-hl-pa", 13.55);
      washOff("#f13p-hl-pa", 15.3);
      // sequential bars become ghosts (dashed, 0.4s); now-line fades
      tl.to(SEQ, { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 13.44);
      tl.to(GHOSTS, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 13.44);
      tl.to("#f13p-now", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 13.44);
      tl.set("#f13p-now", { x: 0 }, 14.0);

      // "Dan" (15.0): three solid bars 0-1 s appear
      tl.to(PAR, { opacity: 1, duration: 0.3, ease: "power3.out" }, 15.0);
      tl.to(PTXT, { opacity: 1, duration: 0.3, ease: "power3.out" }, 15.05);
      tl.to("#f13p-now", { opacity: 1, duration: 0.2, ease: "power1.out" }, 15.0);
      // "lopen ... tegelijk" (15.40-15.72): fill together
      tl.to(PFILL, { scaleX: 1, duration: 15.72 - 15.40, ease: "none" }, 15.40);
      tl.to("#f13p-now", { x: SEC, duration: 15.72 - 15.40, ease: "none" }, 15.40);
      // "tegelijk" (15.72): clock swaps to 1,0 s + mark
      tl.to("#f13p-cv3", { opacity: 0, y: -10, duration: 0.25, ease: "power2.out" }, 15.72);
      tl.to("#f13p-cv1", { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 15.72);
      tl.fromTo("#f13p-clockmark", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 15.72);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["15-promise-all"] = tl;
    })();
