      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }

      function arrowIn(sel, at) { tl.to(sel, { scaleX: 1, duration: 0.4, ease: "power3.out" }, at); }

      // start states
      gsap.set(["#f08r-chip-main", "#f08r-chip-report", "#f08r-chip-total"], { opacity: 0 });
      gsap.set(["#f08r-a1", "#f08r-a2"], { scaleX: 0, transformOrigin: "left center" });

        { id: "f08r-hl-a6", parts: [{ t: "async", c: "ts-kw" }] },

        { t: "()", c: "ts-punct" },
        { t: ": " },
        { t: "Promise", c: "ts-type" },
        { t: "<", c: "ts-punct" },
        { t: "void", c: "ts-type" },
        { t: ">", c: "ts-punct" },
        { t: " " },
        { t: "{", c: "ts-punct" }
      ], 0, 1.6, PER1);
      r = typeLine("#f08r-l7", "#f08r-c7", [
        { t: "    " },
        { t: "const", c: "ts-kw" },

        { id: "f08r-hl-await", parts: [
          { t: "await", c: "ts-kw" },
          { t: " " },
          { t: "getTotal", c: "ts-fn" },
          { t: "()", c: "ts-punct" }
        ] },
        { t: ";", c: "ts-punct" }
      ], 0, r.end + 0.02, PER1, 0.03);
      r = typeLine("#f08r-l8", "#f08r-c8", [

        { t: "log", c: "ts-fn" },
        { t: "(", c: "ts-punct" },
        { t: "`Het totaal is ", c: "ts-str" },
        { t: "${", c: "ts-punct" },
        { t: "total" },
        { t: "}", c: "ts-punct" },
        { t: "`", c: "ts-str" },
        { t: ");", c: "ts-punct" }
      ], 0, r.end + 0.02, PER1, 0.03);
      typeLine("#f08r-l9", "#f08r-c9", [
        { t: "}", c: "ts-punct" }
      ], 0, r.end + 0.02, PER1, 0.03);

      washOn("#f08r-hl-await", 4.64);
      washOff("#f08r-hl-await", 6.2);

      // ---- Shot 2 (5.6-10.6): "geval drie" (6.32) note fades up; out at 10.4 ----
      tl.fromTo("#f08r-note", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.32);
      tl.to("#f08r-note", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 10.4);

      // ---- Shot 3 (10.6-end): "kruipt" (10.96) rows 11-16 type 10.72-12.3 ----
      var PER2 = 0.0185;
      r = typeLine("#f08r-l11", "#f08r-c11", [
        { id: "f08r-hl-a11", parts: [{ t: "async", c: "ts-kw" }] },
        { t: " " },
        { t: "function", c: "ts-kw" },
        { t: " " },
        { t: "main", c: "ts-fn" },
        { t: "()", c: "ts-punct" },
        { t: " " },
        { t: "{", c: "ts-punct" }
      ], 0, 10.72, PER2);
      r = typeLine("#f08r-l12", "#f08r-c12", [
        { t: "    " },
        { t: "await", c: "ts-kw" },
        { t: " " },
        { t: "printReport", c: "ts-fn" },
        { t: "();", c: "ts-punct" }
      ], 0, r.end + 0.02, PER2, 0.03);

        { t: "    console" },

      r = typeLine("#f08r-l14", "#f08r-c14", [
        { t: "}", c: "ts-punct" }
      ], 0, r.end + 0.02, PER2, 0.03);
      typeLine("#f08r-l16", "#f08r-c16", [

      ], 0, r.end + 0.02, PER2, 0.03);

      // "get total" (12.88): chip getTotal() + wash on row 1 async
      chipIn("#f08r-chip-total", 12.88);
