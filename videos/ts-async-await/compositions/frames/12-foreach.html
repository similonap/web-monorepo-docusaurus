          <div data-hf-id="hf-a10-p2" class="pc-out" id="f10f-b2">9</div>
          <div data-hf-id="hf-a10-p3" class="pc-out" id="f10f-b3">16</div>
          <div data-hf-id="hf-a10-p4" class="pc-out" id="f10f-b4">Klaar!</div>
        </div>
        <div data-hf-id="hf-a10-wr" class="ts-mark ts-mark--wrong" id="f10f-wrong"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 14.55;
      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 26;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="12-foreach"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // initial states: version A code and the empty console are present at t = 0
      gsap.set(["#f10f-l3b", "#f10f-l6b"], { opacity: 0, y: 10 });
      gsap.set("#f10f-mark", { opacity: 0, scale: 0.96 });
      gsap.set("#f10f-wrong", { opacity: 0, scale: 0.96 });
      gsap.set(["#f10f-a1", "#f10f-a2", "#f10f-a3", "#f10f-a4", "#f10f-b1", "#f10f-b2", "#f10f-b3", "#f10f-b4"], { opacity: 0, x: -8 });

      // ---- Scene 1 (0.0-2.0): kicker; "for each" (0.88) wash on numbers.forEach( ----
      tl.fromTo("#f10f-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f10f-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      washOn("#f10f-hl-foreach", 0.88);
      washOff("#f10f-hl-foreach", 1.9);

      // ---- Scene 2 (2.0-7.5): "async callback" (2.72) mark; "wacht er niet op" (6.32) wash on row 7 ----
      tl.to("#f10f-mark", { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 2.72);
      washOn("#f10f-hl-klaar", 6.32);
      washOff("#f10f-hl-klaar", 7.5);
      tl.to("#f10f-mark", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 7.5);

      // ---- Scene 3 (7.5-10.0): "Klaar" (7.60) printed first, then 4 / 9 / 16; "eerst" (8.76) red mark ----
      function outIn(sel, at) { tl.to(sel, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at); }
      outIn("#f10f-a1", 7.6);
      outIn("#f10f-a2", 8.0);
      outIn("#f10f-a3", 8.2);
      outIn("#f10f-a4", 8.4);
      tl.to("#f10f-wrong", { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 8.76);
      tl.to("#f10f-wrong", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 9.9);

      // ---- Scene 4 (10.0-end): "for of" (10.08) rows 3 and 6 swap; console clears; right order ----
      tl.to(["#f10f-l3a", "#f10f-l6a"], { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, 10.08);
      tl.to(["#f10f-l3b", "#f10f-l6b"], { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 10.2);
      washOn("#f10f-hl-forof", 10.3);
      washOff("#f10f-hl-forof", 11.8);
      // old output: fade to the pc-out--old look, then out (10.1-10.5)
      tl.to(["#f10f-a1", "#f10f-a2", "#f10f-a3", "#f10f-a4"], { color: "#94A3B8", duration: 0.15, ease: "power1.out" }, 10.1);
      tl.to(["#f10f-a1", "#f10f-a2", "#f10f-a3", "#f10f-a4"], { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 10.25);
      // "wacht await wel echt" (11.92-13.04): 4, 9, 16, Klaar!
      outIn("#f10f-b1", 11.92);
      outIn("#f10f-b2", 12.2);
      outIn("#f10f-b3", 12.48);
      outIn("#f10f-b4", 13.04);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["12-foreach"] = tl;
    })();
  </script>
</template>
