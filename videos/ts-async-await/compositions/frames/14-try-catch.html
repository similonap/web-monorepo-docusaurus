      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 26;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="14-try-catch"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // start states
      gsap.set("#f12t-strike", { scaleX: 0 });
      gsap.set(["#f12t-chip1", "#f12t-chip2", "#f12t-label", "#f12t-console"], { opacity: 0 });
      gsap.set("#f12t-chip1", { backgroundColor: "#EAF2FB", borderColor: "#3178C6" });
      gsap.set("#f12t-v-rej", { opacity: 0, y: 10 });

      // ---- Shot 1 (0.0-3.0): kicker; "try" (1.44) wash try + chip 1; "catch" (2.36) wash rows 6-8; off 3.0 ----
      tl.fromTo("#f12t-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f12t-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f12t-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.fromTo("#f12t-console", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);

      washOn("#f12t-hl-try", 1.44);
      tl.fromTo("#f12t-chip1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.44);
      washOn("#f12t-wcatch", 2.36);
      washOff("#f12t-hl-try", 3.0);
      washOff("#f12t-wcatch", 3.0);

      // ---- Shot 2 (3.0-6.5): "rejected" (4.08) nothing new; "gooit await de fout" (5.28) wash await row 4 ----
      washOn("#f12t-hl-await", 5.28);
      washOff("#f12t-hl-await", 6.5);

      // ---- Shot 3 (6.5-11.2): "vier en vijf" (7.52) chip 2 pending; "groter dan tien" (10.56) rejected + strike row 5 ----
      tl.fromTo("#f12t-chip2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.52);

      tl.to("#f12t-v-pend", { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, 10.56);
      tl.to("#f12t-v-rej", { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 10.56 + 0.12);
      tl.to("#f12t-chip2", { borderColor: "#D14343", boxShadow: "inset 0 0 0 1px #D14343", duration: 0.35, ease: "power3.out" }, 10.56);
      tl.to("#f12t-r5code", { opacity: 0.35, duration: 0.35, ease: "power2.out" }, 10.56);
      tl.to("#f12t-strike", { scaleX: 1, duration: 0.35, ease: "power3.out" }, 10.56);

      // ---- Shot 4 (11.2-end): "catch" (12.16) error line in the console; hold ----
      tl.fromTo("#f12t-out1", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 12.16);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["14-try-catch"] = tl;
    })();
  </script>
</template>
