      function arcLen(el, fallback) {

        try { len = Math.ceil(el.getTotalLength()) || fallback; } catch (e) {}
        return len;
      }
      function drawArc(arcSel, headSel, at, dur) {
        var arc = q(arcSel);
        var head = q(headSel);
        var len = arcLen(arc, 300);
        tl.fromTo(arc, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at);

      function settle(sel, at) {
        tl.fromTo(sel, { opacity: 0, y: 16, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, at);
      }

      settle("#f03-node1", 0.46);

      tl.to("#f03-scan", { y: 3 * LINE_H, scaleY: 3, opacity: 1, duration: 0.4, ease: "power3.inOut" }, 9.52);
