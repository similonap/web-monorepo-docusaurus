<template id="11-kies-template">
  <div data-hf-id="hf-wsrf" id="root" data-composition-id="11-kies" data-start="0" data-duration="10" data-width="1920" data-height="1080">
    <style>
      @font-face { font-family: "Archivo Black"; src: url("assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrains_Mono-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrains_Mono-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }

      :root {
        --cm-cream: #EFE9D9; --cm-cream-2: #E4DCC4;
        --cm-ink: #0F0F0F; --cm-ink-2: #2A2A2A;
        --cm-green: #1F8A4C; --cm-green-dark: #136636;
        --cm-pink: #F06CA8; --cm-pink-dark: #D14E8B;
        --cm-orange: #E85A1F; --cm-yellow: #F5C518;
        --cm-border: 8px;            /* 0.4cqw @1920 = 7.7px */
        --cm-rule: 6px;
        --cm-shadow: 24px 24px 0 var(--cm-orange), 24px 24px 0 4px var(--cm-ink);  /* ONE per frame */
        --cm-display: "Archivo Black", "Arial Black", sans-serif;
        --cm-body: "Space Grotesk", Arial, sans-serif;
        --cm-mono: "JetBrains Mono", monospace;
      }
      /* ground: a full-duration class="clip" layer, never on #root */
      .cm-bg { position: absolute; inset: 0; background: var(--cm-cream); }
      /* Archivo Black: always uppercase, lh 0.92 */
      .cm-display { font-family: var(--cm-display); font-weight: 400; text-transform: uppercase; line-height: 0.92; letter-spacing: -0.01em; color: var(--cm-ink); }
      .cm-mono { font-family: var(--cm-mono); text-transform: uppercase; letter-spacing: 0.08em; }
      /* display ramp in px @1920 */
      .cm-hero { font-size: 298px; }   /* display-hero 15.5cqw, ≤3 short words */
      .cm-xl   { font-size: 211px; }   /* display-xl 11cqw */
      .cm-lg   { font-size: 154px; }   /* display-lg 8cqw */
      .cm-head { font-size: 81px; }    /* display-head 4.2cqw */
      .cm-step { font-size: 46px; }    /* marker / step-title */

      /* topbar: kicker-block left, pill right, inset 64px */
      .cm-topbar { position: absolute; left: 64px; right: 64px; top: 48px; height: 52px; display: flex; justify-content: space-between; align-items: center; }
      .cm-kicker { background: var(--cm-ink); color: var(--cm-cream); font-family: var(--cm-mono); font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; padding: 10px 18px; }
      .cm-pill { background: var(--cm-cream); border: 4px solid var(--cm-ink); border-radius: 999px; color: var(--cm-ink); font-family: var(--cm-mono); font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 22px; }

      /* reason number tile (frames 3-9), top-left under topbar */
      .cm-num { position: absolute; left: 96px; top: 140px; width: 150px; height: 150px; border: var(--cm-border) solid var(--cm-ink); display: flex; align-items: center; justify-content: center; font-family: var(--cm-display); font-size: 92px; line-height: 1; color: var(--cm-ink); }

      /* generic blocks */
      .cm-card { background: var(--cm-cream); border: var(--cm-border) solid var(--cm-ink); }
      .cm-card-2 { background: var(--cm-cream-2); border: var(--cm-border) solid var(--cm-ink); }
      .cm-marker { background: var(--cm-pink); border: var(--cm-border) solid var(--cm-ink); box-shadow: var(--cm-shadow); padding: 18px 32px; }
      .cm-badge { background: var(--cm-yellow); border: var(--cm-border) solid var(--cm-ink); font-family: var(--cm-display); text-transform: uppercase; font-size: 40px; line-height: 1; padding: 14px 22px; color: var(--cm-ink); }  /* rotate(-4deg) via GSAP rotation, not CSS transform */
      .cm-stamp { border: var(--cm-border) solid var(--cm-ink); font-family: var(--cm-display); text-transform: uppercase; line-height: 0.92; color: var(--cm-ink); padding: 18px 30px; outline: 5px solid var(--cm-cream); outline-offset: -18px; } /* rotate(-6deg) via GSAP */
      .cm-chip { background: var(--cm-cream); border: 5px solid var(--cm-ink); font-family: var(--cm-mono); font-size: 28px; letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 18px; color: var(--cm-ink); }

      /* ---- frame 11 specifics ---- */
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size; }
      .f11-layer { position: absolute; inset: 0; }
      #f11-bg { background: var(--cm-green); }
      #f11-kicker { background: var(--cm-cream); color: var(--cm-ink); }
      .f11-beat { position: absolute; left: 96px; right: 96px; top: 120px; height: 780px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .f11-line { display: block; color: var(--cm-cream); white-space: nowrap; transform-origin: 50% 50%; }
      .f11-a { font-size: 154px; }
      .f11-b { font-size: 128px; }
      .f11-gap { margin-top: 28px; }
      #f11-wel { background: var(--cm-yellow); color: var(--cm-ink); border: var(--cm-border) solid var(--cm-ink); padding: 20px 32px 14px; }
      #f11-kies { font-size: 120px; margin-bottom: 26px; }
      .f11-final { font-size: 172px; }
      #f11-stamp { position: absolute; left: 1520px; top: 128px; width: 280px; height: 280px; box-sizing: border-box; background: var(--cm-pink); border: var(--cm-border) solid var(--cm-ink); box-shadow: var(--cm-shadow); display: flex; align-items: center; justify-content: center; transform-origin: 50% 50%; }
      #f11-ring { position: absolute; left: 26px; top: 26px; right: 26px; bottom: 26px; border: 6px solid var(--cm-cream); border-radius: 50%; }
      #f11-stamp-txt { position: relative; font-size: 72px; color: var(--cm-ink); line-height: 0.92; }
    </style>

    <!-- full-bleed green ground: the single closing plate -->
    <div data-hf-id="hf-e1k3" class="clip f11-layer" id="f11-bg" data-start="0" data-duration="10" data-track-index="0"></div>

    <!-- content -->
    <div data-hf-id="hf-f0lq" class="clip f11-layer" id="f11-content" data-start="0" data-duration="10" data-track-index="1">
      <div data-hf-id="hf-0b9u" class="cm-topbar" id="f11-topbar">
        <div data-hf-id="hf-mmhr" class="cm-kicker" id="f11-kicker">Waarom software development</div>
      </div>

      <!-- beat A -->
      <div data-hf-id="hf-fnn4" class="f11-beat" id="f11-beat-a">
        <span data-hf-id="hf-z0as" class="cm-display f11-line f11-a" id="f11-a1">AI pakt je job</span>
        <span data-hf-id="hf-ru2v" class="cm-display f11-line f11-a f11-gap" id="f11-a2">niet af.</span>
      </div>

      <!-- beat B -->
      <div data-hf-id="hf-obiz" class="f11-beat" id="f11-beat-b">
        <span data-hf-id="hf-i673" class="cm-display f11-line f11-b" id="f11-b1">Een engineer</span>
        <span data-hf-id="hf-a7z1" class="cm-display f11-line f11-b" id="f11-b2">met AI</span>
        <span data-hf-id="hf-22o7" class="cm-display f11-line f11-b f11-gap" id="f11-wel">Misschien wel.</span>
      </div>

      <!-- beat C -->
      <div data-hf-id="hf-kdey" class="f11-beat" id="f11-beat-c">
        <span data-hf-id="hf-antp" class="cm-display f11-line f11-b" id="f11-c1">Zorg dat jij</span>
        <span data-hf-id="hf-ij0a" class="cm-display f11-line f11-b f11-gap" id="f11-c2">die engineer</span>
        <span data-hf-id="hf-n9i6" class="cm-display f11-line f11-b" id="f11-c3">bent.</span>
      </div>

      <!-- beat D: final lockup -->
      <div data-hf-id="hf-1lp9" class="f11-beat" id="f11-beat-d">
        <span data-hf-id="hf-kuqq" class="cm-display f11-line" id="f11-kies">Kies voor</span>
        <span data-hf-id="hf-aeo3" class="cm-display f11-line f11-final" id="f11-d1">Software</span>
        <span data-hf-id="hf-9com" class="cm-display f11-line f11-final" id="f11-d2">Development</span>
      </div>

      <div data-hf-id="hf-joy5" id="f11-stamp">
        <div data-hf-id="hf-ksiu" id="f11-ring"></div>
        <span data-hf-id="hf-nt2e" class="cm-display" id="f11-stamp-txt">Kies!</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var DURATION = 10;
        var q = function (s) { return document.querySelector('[data-composition-id="11-kies"] ' + s); };
        var tl = gsap.timeline({ paused: true });
        var slamFrom = { scale: 1.25, opacity: 0, rotation: -1.5 };
        var slamTo = { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: 'power4.out' };
        function slam(sel, t) { tl.fromTo(q(sel), slamFrom, slamTo, t); }

        // beat groups: only one visible at a time (hard cuts)
        tl.set(q('#f11-beat-b'), { opacity: 0 }, 0);
        tl.set(q('#f11-beat-c'), { opacity: 0 }, 0);
        tl.set(q('#f11-beat-d'), { opacity: 0 }, 0);

        // chrome
        tl.fromTo(q('#f11-topbar'), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power2.out' }, 0);

        // Scene 1a: AI PAKT JE JOB / NIET AF.
        slam('#f11-a1', 0.0);
        slam('#f11-a2', 1.0);

        // Scene 1b: hard cut @2.24
        tl.set(q('#f11-beat-a'), { opacity: 0 }, 2.24);
        tl.set(q('#f11-beat-b'), { opacity: 1 }, 2.24);
        slam('#f11-b1', 2.40);
        slam('#f11-b2', 2.52);
        tl.fromTo(q('#f11-wel'), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'expo.out' }, 4.68);

        // Scene 2: hard cut @5.84
        tl.set(q('#f11-beat-b'), { opacity: 0 }, 5.84);
        tl.set(q('#f11-beat-c'), { opacity: 1 }, 5.84);
        slam('#f11-c1', 5.84);
        slam('#f11-c2', 6.88);
        slam('#f11-c3', 7.0);

        // Scene 3: final lockup @8.24
        tl.set(q('#f11-beat-c'), { opacity: 0 }, 8.24);
        tl.set(q('#f11-beat-d'), { opacity: 1 }, 8.24);
        tl.fromTo(q('#f11-kies'), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 8.24);
        slam('#f11-d1', 8.88);
        slam('#f11-d2', 9.0);

        // pink stamp drops in rotated, the frame's one hard shadow
        tl.fromTo(q('#f11-stamp'),
          { scale: 1.35, rotation: -12, opacity: 0 },
          { scale: 1, rotation: -6, opacity: 1, duration: 0.42, ease: 'back.out(1.6)' }, 9.28);

        // final frame: everything fades out 9.6 -> 10.0
        tl.to([q('#f11-content'), q('#f11-bg')], { opacity: 0, duration: 0.4, ease: 'power2.inOut' }, 9.6);

        tl.set({}, {}, DURATION);
        window.__timelines = window.__timelines || {};
        window.__timelines["11-kies"] = tl;
      })();
    </script>

</template>
