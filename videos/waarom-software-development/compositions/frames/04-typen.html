      (function () {
        var DURATION = 14.32;
        var q = function (s) { return document.querySelector('[data-composition-id="04-typen"] ' + s); };
        var tl = gsap.timeline({ paused: true });

        // Scene 1: chrome, tile, empty bar
        tl.fromTo(q("#f04-topbar"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);

        // discrete caret blink, deterministic
        for (var t = 1.5, on = false; t < DURATION - 0.01; t += 0.5, on = !on) {
          tl.set(q("#f04-caret"), { opacity: on ? 1 : 0 }, t);

        // Scene 2: segments fill on spoken words
        function seg(id, at) {
          tl.fromTo(q(id + " .f04-fill"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, at);
          tl.fromTo(q(id + " .f04-lbl"), { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out" }, at + 0.12);
          var rule = q(id + " .f04-rule");
          if (rule) tl.fromTo(rule, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, at + 0.3);

        seg("#f04-seg-prob", 4.68);
        seg("#f04-seg-keus", 6.40);

        tl.set({}, {}, DURATION);
