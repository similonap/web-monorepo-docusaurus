        var chars = [];
        segments.forEach(function (p) {
          for (var i = 0; i < p.t.length; i++) {
            var s = document.createElement("span");
            s.className = "ts-ch" + (p.c ? " " + p.c : "");
            s.textContent = p.t[i];
            host.appendChild(s);
            chars.push(s);
          }
        });
        return chars;
      }

      // insert-type in the middle of a line: chars take no space until typed (display none -> inline)
      function typeInsert(hostSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.08;
        var chars = buildChars(q(hostSel), segments);
        var caret = q(caretSel);
        tl.set(chars, { display: "none" }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.set(el, { display: "inline" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return end;
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // ---- 0.0-1.5: kicker; panel; scherm card at 0.3; "map" (0.40) wash ----
      tl.fromTo("#f12t-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f12t-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f12t-panel", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#f12t-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo("#f12t-card", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
      washOn("#f12t-hl-map", 0.40);

      // ---- 1.5-4.3: "TodoItem" (1.60): <li ...> deletes backwards, <TodoItem ...> types ----
      washOff("#f12t-hl-map", 1.60);
      var DCOL = 10;
      var del = buildChars(q("#f12t-del9"), [
        { t: "<li", c: "ts-punct" },
        { t: " key={index}" },
        { t: ">", c: "ts-punct" },
        { t: "{todo}" },
        { t: "</li>", c: "ts-punct" }
      ]);
      var c9 = q("#f12t-c9");
      var n = del.length;
      var DS = 1.60, DP = 0.01;
      tl.set(c9, { opacity: 1, x: X0 + (DCOL + n) * chPx }, DS - 0.08);
      for (var i = 0; i < n; i++) {
        var at = DS + i * DP;
        tl.set(del[n - 1 - i], { display: "none" }, at);
        tl.set(c9, { x: X0 + (DCOL + n - 1 - i) * chPx }, at);
      }
      typeInsert("#f12t-ins9", "#f12t-c9", [
        { t: "<", c: "ts-punct" },
        { t: "TodoItem", c: "ts-type" },
        { t: " key={index} todo={todo}" }
      ], DCOL, DS + n * DP + 0.06, 0.025, 0.02);

      // "eigen callback" (3.20): row 10 grows, line numbers below shift by one
      tl.fromTo("#f12t-r10", { height: 0 }, { height: 38, duration: 0.4, ease: "power2.inOut" }, 3.20);
      tl.to(qa(".f12t-lnA"), { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 3.20);
      tl.to(qa(".f12t-lnB"), { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 3.20);

      // ---- 4.3-8.6: "arrow function" (4.48) row 10 types; "aanroept" (6.36) wash ----
      var l10 = typeLine("#f12t-l10", "#f12t-c10", [
        { t: "onDelete={" },
        { id: "f12t-hl-arrow", parts: [
          { t: "() " },
          { t: "=>", c: "ts-kw" },
          { t: " " },
          { t: "deleteTodo", c: "ts-fn" },
          { t: "(index)" }
        ] },
        { t: "} " },
        { t: "/>", c: "ts-punct" }
      ], 12, 4.48, 0.025, 0.08);
      washOn("#f12t-hl-arrow", 6.36);

      // "index van dat item" (7.20): a call tag per row
      ["#f12t-dt0", "#f12t-dt1", "#f12t-dt2"].forEach(function (sel, k) {
        tl.fromTo(sel, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 7.20 + k * 0.2);
      });

      // ---- 8.6-12.6: "TodoItem" (9.36) box with props; "niet" (11.12) struck index ----
      tl.fromTo("#f12t-box", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.36);
      tl.fromTo("#f12t-props", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 9.46);
      tl.fromTo("#f12t-chip-todo", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 9.50);
      tl.fromTo("#f12t-chip-ondel", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 9.60);
      tl.fromTo("#f12t-chip-index", { opacity: 0, y: 10 }, { opacity: 0.35, y: 0, duration: 0.45, ease: "power3.out" }, 11.12);

      // ---- 12.6-end: "ik wil verwijderd worden" (13.12): onDelete() tag + chip turns blue ----
      tl.fromTo("#f12t-say", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 13.12);
      tl.fromTo("#f12t-chip-ondel",
        { borderColor: "#E2E8F0", backgroundColor: "#FFFFFF" },
        { borderColor: "#3178C6", backgroundColor: "#EAF2FB", duration: 0.35, ease: "power1.out", immediateRender: false }, 13.12);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["12-map-callback"] = tl;
    })();
  </script>
</template>
