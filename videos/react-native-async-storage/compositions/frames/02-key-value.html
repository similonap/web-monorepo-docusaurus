  <script>
    (function () {
      var DUR = 11.91;
      var FS = 24, CW = 0.6, X0 = 0;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="02-key-value"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
          if (seg.id) marks[seg.id + ":end"] = start + chars.length * per;
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // chip / label pop: opacity, y 10 -> 0, scale 0.96 -> 1
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      function lnOn(n, at) { tl.to("#f02-ln" + n, { opacity: 1, duration: 0.2, ease: "power1.out" }, at); }

      // ---- STORE KIT helpers ----
      // row in: opacity 0 -> 1, y 8 -> 0, plus a wash pulse on the row
      function rowIn(sel, washSel, at) {
        tl.fromTo(sel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, at);
        tl.fromTo(washSel, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, at);
        tl.to(washSel, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, at + 0.3);
      }
      // ---- end STORE KIT helpers ----

      // ---- 0.0-0.3: kicker, panel and table in ----
      tl.fromTo("#f02-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f02-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f02-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#f02-store", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);

      // ---- 0.64 "local storage": rows 1-3 type on (0.64-1.94) ----
      var PER = 0.012;
      lnOn(1, 0.6);
      typeLine("#f02-r1", "#f02-c1", [{ t: "// in de browser", c: "ts-fold" }], 0, 0.64, PER);
      lnOn(2, 0.84);
      typeLine("#f02-r2", "#f02-c2", [
        { t: "localStorage." },
        { t: "setItem", c: "ts-fn" },
        { t: "(" },
        { id: "f02-hl-k2", parts: [{ t: "\"name\"", c: "ts-str" }] },
        { t: ", " },
        { t: "\"John Doe\"", c: "ts-str" },
        { t: ");" }
      ], 0, 0.88, PER);
      lnOn(3, 1.41);
      typeLine("#f02-r3", "#f02-c3", [
        { t: "const", c: "ts-kw" },
        { t: " name = localStorage." },
        { t: "getItem", c: "ts-fn" },
        { t: "(" },
        { t: "\"name\"", c: "ts-str" },
        { t: ");" }
      ], 0, 1.45, PER);

      // ---- 2.72 "bewaart": wash on row 2; 3.24 "waarde": table row name | "John Doe" ----
      tl.to("#f02-rw2", { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.72);
      tl.to("#f02-empty", { opacity: 0, duration: 0.2, ease: "power1.out" }, 3.24);
      rowIn("#f02-r-name", "#f02-w-name", 3.24);

      // ---- 4.24 "key": wash moves to "name" in row 2 and to the key cell ----
      tl.to("#f02-rw2", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 4.24);
      washOn(["#f02-hl-k2", "#f02-hl-key"], 4.24);

      // ---- 4.80 "Maar": rows 5-7 type on (4.8-6.3) ----
      washOff(["#f02-hl-k2", "#f02-hl-key"], 4.8);
      lnOn(4, 4.78);
      lnOn(5, 4.78);
      typeLine("#f02-r5", "#f02-c5", [{ t: "// in React Native", c: "ts-fold" }], 0, 4.82, PER);
      lnOn(6, 5.06);
      typeLine("#f02-r6", "#f02-c6", [
        { id: "f02-hl-aw6", parts: [{ t: "await", c: "ts-kw" }] },
        { t: " AsyncStorage." },
        { t: "setItem", c: "ts-fn" },
        { t: "(" },
        { t: "\"name\"", c: "ts-str" },
        { t: ", " },
        { t: "\"John Doe\"", c: "ts-str" },
        { t: ");" }
      ], 0, 5.1, PER);
      lnOn(7, 5.68);
      typeLine("#f02-r7", "#f02-c7", [
        { t: "const", c: "ts-kw" },
        { t: " name = " },
        { id: "f02-hl-aw7", parts: [{ t: "await", c: "ts-kw" }] },
        { t: " AsyncStorage." },
        { t: "getItem", c: "ts-fn" },
        { t: "(" },
        { t: "\"name\"", c: "ts-str" },
        { t: ");" }
      ], 0, 5.72, PER);

      // ---- 6.36 "asynchroon": card A pops ----
      pop("#f02-cardA", 6.36);

      // ---- 7.96 "promise": card B pops (blue border), wash on Promise ----
      pop("#f02-cardB", 7.96);
      washOn("#f02-hl-prom", 8.1);

      // ---- 9.72 "telkens await": marks around await in rows 6 and 7, plus washes ----
      tl.to(["#f02-am6", "#f02-am7"], { opacity: 1, duration: 0.35, ease: "power1.out" }, 9.72);
      washOn(["#f02-hl-aw6", "#f02-hl-aw7"], 9.72);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["02-key-value"] = tl;
    })();
  </script>
