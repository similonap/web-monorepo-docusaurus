  <script>
    (function () {
      var DUR = 11.75;
      var CH = 14.4; // JetBrains Mono 24px advance
      var FS = 24, CW = 0.6, X0 = 0;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="11-loading"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        if (wrapSel) tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }
      // insert chars that already sit inside a row (display none -> inline), caret steps along
      function insertChars(charSels, caretSel, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var chPx = FS * CW;
        tl.set(caretSel, { opacity: 1, x: X0 + col * chPx }, start - lead);
        charSels.forEach(function (el, i) {
          var at = start + i * per;
          tl.set(el, { display: "inline" }, at);
          tl.set(caretSel, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + charSels.length * per;
        tl.set(caretSel, { opacity: 0 }, end);
        return end;
      }

      // ---- APP KIT helpers ----
      // chip / label pop: opacity, y 10 -> 0, scale 0.96 -> 1
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      // panel rows scroll together with the line numbers
      function scrollTo(nn, rows, at) { tl.to(["#f" + nn + "-lns", "#f" + nn + "-lines"], { y: -34 * rows, duration: 0.6, ease: "power3.inOut" }, at); }
      function intro(nn) {
        tl.fromTo("#f" + nn + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#f" + nn + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }
      // rows outside the 11-row window are hidden (not only clipped), by final row number
      function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }
      function rowEls(nn, idxs) { var r = root.querySelectorAll("#f" + nn + "-lines .fx-row"); return idxs.map(function (i) { return r[i - 1]; }); }
      function lnEls(nn, idxs) { var r = root.querySelectorAll("#f" + nn + "-lns > div"); return idxs.map(function (i) { return r[i - 1]; }); }
      function hideEls(els, at, dur) { if (dur) tl.to(els, { autoAlpha: 0, duration: dur, ease: "power1.inOut" }, at); else tl.set(els, { autoAlpha: 0 }, at); }
      function showEls(els, at, dur) { if (dur) tl.to(els, { autoAlpha: 1, duration: dur, ease: "power1.inOut" }, at); else tl.set(els, { autoAlpha: 1 }, at); }
      // ---- end APP KIT helpers ----

      // ---- STORE KIT helpers ----
      function stWash(rowSel, at) {
        var w = q(rowSel + " .st-wash");
        tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, at);
        tl.to(w, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, at + 0.3);
      }
      // app relaunch: content scales 1 -> 0.94 and fades out, new content fades in from 0.94 -> 1
      function relaunchOut(at) { tl.to("#f11-app", { scale: 0.94, opacity: 0, duration: 0.3, ease: "power2.in" }, at); }
      function relaunchIn(at) { tl.fromTo("#f11-app", { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, at); }
      // ---- end STORE KIT helpers ----

      // start: window rows 1-11; line numbers 12-15 hidden (rows 3, 8-10 are still closed)
      hideEls(lnEls("11", range(12, 15)), 0);

      // ---- 0.0-0.3: kicker, panel, phone, chip, table in ----
      intro("11");
      tl.fromTo("#f11-store", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.15);
      pop("#f11-state", 0.3);

      // ---- 0.80 "eerste render": the app relaunches and renders Counter: 0; 1.12 chip 7 -> 0, render #1 ----
      relaunchOut(0.8);
      tl.set("#f11-d7a", { opacity: 0 }, 1.1);
      tl.set("#f11-d0", { opacity: 1 }, 1.1);
      relaunchIn(1.1);
      swapVal("#f11-cv7a", "#f11-cv0", null, 1, 1.12);
      pop("#f11-rtag", 1.12);

      // ---- 2.12 "effect": wash on rows 6-11; 2.68 "beginwaarde nul": counter.toString() ----
      washOn(".f11-hl-eff", 2.12);
      washOn("#f11-hl-ts", 2.68);
      // blue off before the red overwrite: never a blue and a red key moment together
      washOff(".f11-hl-eff", 3.45);
      washOff("#f11-hl-ts", 3.45);

      // ---- 3.90 "opslaan": table "7" -> "0" in red with a thin red outline ----
      swapVal("#f11-v7a", "#f11-v0", null, 0, 3.9);
      tl.to("#f11-bad", { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.9);

      // ---- 4.72 "terwijl": wash moves to the folded first effect (row 4) ----
      washOn("#f11-hl-fold", 4.72);

      // ---- 6.28 "geladen": the table note shows getItem -> "0" in red ----
      tl.to("#f11-note", { opacity: 1, duration: 0.3, ease: "power1.out" }, 6.28);

      // ---- 7.00: red fades out, the value returns to "7", the note fades ----
      swapVal("#f11-v0", "#f11-v7b", null, 0, 7.0);
      tl.to("#f11-bad", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 7.0);
      tl.to("#f11-note", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 7.0);

      // ---- 7.52 "Daarom": row 3 opens (row 15 leaves the window) and types on (7.6-8.0) ----
      washOff("#f11-hl-fold", 7.52);
      tl.to("#f11-r3", { height: 34, duration: 0.35, ease: "power3.out" }, 7.52);
      hideEls(rowEls("11", [15]), 7.52, 0.15);
      typeLine("#f11-r3", "#f11-c3", [
        { t: "const", c: "ts-kw" }, { t: " [loading, setLoading] = " }, { t: "useState", c: "ts-fn" },
        { t: "<" }, { t: "boolean", c: "ts-type" }, { t: ">(" }, { t: "true", c: "ts-fn" }, { t: ");" }
      ], 4, 7.6, 0.0074, 0.08);

      // ---- 8.0: scroll to rows 5-15 while rows 8-10 open and type on (8.05-8.75) ----
      scrollTo("11", 4, 8.0);
      tl.to(["#f11-r8", "#f11-r9", "#f11-r10"], { height: 34, duration: 0.35, ease: "power3.out" }, 8.0);
      hideEls(rowEls("11", range(1, 4)).concat(lnEls("11", range(1, 4))), 8.0, 0.3);
      showEls(rowEls("11", [15]).concat(lnEls("11", range(12, 15))), 8.25, 0.35);
      var t8 = typeLine("#f11-r8", "#f11-c8", [{ id: "f11-hl-if", parts: [{ t: "if", c: "ts-kw" }, { t: " (loading)" }] }, { t: " {" }], 8, 8.05, 0.028);
      var t9 = typeLine("#f11-r9", "#f11-c9", [{ t: "return", c: "ts-kw" }, { t: ";" }], 12, t8.end + 0.04, 0.028, 0.04);
      var t10 = typeLine("#f11-r10", "#f11-c10", [{ t: "}" }], 8, t9.end + 0.04, 0.028, 0.04);

      // ---- 8.78-9.0: [counter] -> [counter, loading]; 9.0-9.26: the fold comment gets ", dan setLoading(false)" ----
      var tDeps = insertChars(Array.prototype.slice.call(root.querySelectorAll("#f11-r15 .f11-ic")), "#f11-c15", 15, 8.78, 0.025, 0.04);
      typeLine("#f11-r5", "#f11-c5", [{ t: ", dan ", c: "ts-fold" }, { id: "f11-hl-sl", parts: [{ t: "setLoading(false)", c: "ts-fold" }] }], 53, tDeps + 0.02, 0.011, 0.02);

      // ---- 9.28 "loading": wash on if (loading) and a mark around rows 8-10 ----
      washOn("#f11-hl-if", 9.28);
      tl.to("#f11-mark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 9.28);

      // ---- 9.84 "false": wash on setLoading(false); 9.9 relaunch: Counter: 7, chip 7, render #2, table wash ----
      washOff("#f11-hl-if", 9.84);
      washOn("#f11-hl-sl", 9.84);
      relaunchOut(9.9);
      tl.set("#f11-d0", { opacity: 0 }, 10.2);
      tl.set("#f11-d7b", { opacity: 1 }, 10.2);
      relaunchIn(10.2);
      swapVal("#f11-cv0", "#f11-cv7b", null, 1, 10.2);
      tl.to("#f11-t1", { y: -12, opacity: 0, duration: 0.25, ease: "power2.out" }, 10.2);

      stWash("#f11-r-counter", 10.2);

      tl.set({}, {}, DUR);
      window.__timelines["11-loading"] = tl;
