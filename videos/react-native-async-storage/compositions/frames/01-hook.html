  <script>
    (function () {
      var DUR = 9.11;
      var root = document.querySelector('[data-composition-id="01-hook"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- APP KIT helpers ----
      // box of an element in dp, relative to .ph-app (layout is measured once, before any tween)
      function dpBox(sel) {
        var el = q(sel), x = 0, y = 0, e = el;
        while (e && !e.classList.contains("ph-app")) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
        return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
      }
      // centre an absolutely placed element (touch, ring) on a dp box
      function placeOn(sel, b) { var el = q(sel); el.style.left = (b.x + b.w / 2) + "px"; el.style.top = (b.y + b.h / 2) + "px"; }
      // a finger press: touch fades and scales in (0.6 -> 1, 0.15s); on release it fades out (0.25s)
      function touchDown(sel, at) { tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, at); }
      function touchUp(sel, at) { tl.to(sel, { opacity: 0, duration: 0.25, ease: "power1.out" }, at); }
      // ---- end APP KIT helpers ----

      // table row wash: 0 -> 1 -> 0 over 0.8s
      function rowWash(at) {
        tl.to("#f01-rwash", { opacity: 1, duration: 0.3, ease: "power1.out" }, at);
        tl.to("#f01-rwash", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, at + 0.3);
      }

      placeOn("#f01-touch", dpBox("#f01-btn"));
      placeOn("#f01-touch2", dpBox("#f01-ic-app"));
      // mark around the inline "Counter: 3" text (the text sits flush left, so the mark starts at 1 dp)
      var cb = dpBox("#f01-count");
      var cm = q("#f01-cmark");
      var mx = Math.max(1, cb.x - 3);
      cm.style.left = mx + "px"; cm.style.top = (cb.y - 1) + "px";
      cm.style.width = (cb.x + cb.w + 4 - mx) + "px"; cm.style.height = (cb.h + 2) + "px";

      // ---- 0.1: the centred phone fades in with the counter app; "async" (0.24): kicker ----
      tl.set("#f01-phone", { x: -707 }, 0);
      tl.fromTo("#f01-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#f01-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.24);

      // ---- "storage" (0.72): the table fades in with one row counter | "2" ----
      tl.fromTo("#f01-store", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.72);

      // ---- "bewaar" (1.28): tap INCREMENT; on release (1.4) Counter: 3 and the table "2" -> "3" with a wash ----
      touchDown("#f01-touch", 1.28);
      tl.to("#f01-btn", { backgroundColor: "#1976D2", duration: 0.1, ease: "power1.out" }, 1.28);
      tl.to("#f01-btn", { backgroundColor: "#2196F3", duration: 0.2, ease: "power1.out" }, 1.4);
      touchUp("#f01-touch", 1.4);
      tl.to("#f01-d2", { y: -10, opacity: 0, duration: 0.25, ease: "power2.out" }, 1.4);
      tl.fromTo("#f01-d3", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 1.4);
      tl.to("#f01-sv2", { y: -16, opacity: 0, duration: 0.25, ease: "power2.out" }, 1.4);
      tl.fromTo("#f01-sv3", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 1.4);
      rowWash(1.4);

      // ---- "telefoon" (2.60): phone to the standard place, the table widens; hero (2.90); hero bar (3.20) ----
      tl.to("#f01-phone", { x: 0, duration: 0.8, ease: "power3.inOut" }, 2.6);
      tl.to("#f01-store", { width: 1290, duration: 0.8, ease: "power3.inOut" }, 2.6);
      tl.fromTo("#f01-hero", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.9);
      tl.fromTo("#f01-hbar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 3.2);

      // ---- "Sluit" (3.52): the app closes to the launcher; the table stays; "app" (4.00): read outline ----
      tl.to("#f01-app", { scale: 0.94, opacity: 0, duration: 0.3, ease: "power2.in", transformOrigin: "50% 40%" }, 3.52);
      tl.to("#f01-launch", { opacity: 1, duration: 0.35, ease: "power2.out" }, 3.66);
      tl.to("#f01-rread", { opacity: 1, duration: 0.2, ease: "power1.out" }, 4.0);
      tl.to("#f01-rread", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 4.5);

      // ---- "open" (4.64): the finger taps the blue icon; the app opens again with Counter: 3 ----
      touchDown("#f01-touch2", 4.64);
      tl.to("#f01-ic-app", { scale: 0.92, duration: 0.12, ease: "power1.out" }, 4.64);
      tl.to("#f01-ic-app", { scale: 1, duration: 0.2, ease: "power1.out" }, 4.8);
      touchUp("#f01-touch2", 4.8);
      tl.to("#f01-launch", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.86);

      tl.fromTo("#f01-cmark", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 6.68);
      rowWash(6.68);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["01-hook"] = tl;
    })();
