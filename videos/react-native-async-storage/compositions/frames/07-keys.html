  <script>
    (function () {
      var DUR = 10.39;
      var ROW = 34;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="07-keys"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // ---- APP KIT helpers ----
      // box of an element in dp, relative to .ph-app (layout is measured once, before any tween)
      function dpBox(sel) {
        var el = q(sel), x = 0, y = 0, e = el;
        while (e && !e.classList.contains("ph-app")) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
        return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
      }
      // centre an absolutely placed element (touch, ring) on a dp box
      function placeOn(sel, b) { var el = q(sel); el.style.left = (b.x + b.w / 2) + "px"; el.style.top = (b.y + b.h / 2) + "px"; }
      // a finger press: touch fades and scales in (0.6 -> 1, 0.15s); on release it fades out (0.25s)
      function touchDown(sel, at) { tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, at); }
      function touchUp(sel, at) { tl.to(sel, { opacity: 0, duration: 0.25, ease: "power1.out" }, at); }
      function intro(nn) {
        tl.fromTo("#f" + nn + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#f" + nn + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }
      // ---- end APP KIT helpers ----

      // ---- STORE helpers ----
      function rowOut(sel, at) { tl.to(sel, { opacity: 0, duration: 0.3, ease: "power1.out" }, at); }
      function rowUp(sel, at) { tl.to(sel, { y: -36, duration: 0.35, ease: "power3.inOut" }, at); }

      // Button press: finger down, pressed colour while down, back on release
      function press(btn, touch, down, up) {
        touchDown(touch, down);
        tl.to(btn, { backgroundColor: "#1976D2", duration: 0.1, ease: "power1.out" }, down);
        tl.to(btn, { backgroundColor: "#2196F3", duration: 0.2, ease: "power1.out" }, up);
        touchUp(touch, up);
      }

      placeOn("#f07-t-keys", dpBox("#f07-btn-keys"));
      placeOn("#f07-t-remove", dpBox("#f07-btn-remove"));
      placeOn("#f07-t-clear", dpBox("#f07-btn-clear"));
      placeOn("#f07-t-ok", dpBox("#f07-aok"));

      // rows outside the 11-row window are hidden at rest
      tl.set(["#f07-row12", "#f07-ln12"], { visibility: "hidden" }, 0);

      // ---- 0.0-0.3 intro: kicker, panel, phone, table ----
      intro("07");
      tl.fromTo("#f07-store", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.25);

      // ---- 0.20 "Get all keys": wash on getAllKeys() ----
      washOn("#f07-hl-keys", 0.20);

      // ---- 1.12 "geeft": tap SHOW KEYS (1.2), 1.4 Alert "Keys: name, age" ----
      press("#f07-btn-keys", "#f07-t-keys", 1.2, 1.38);
      tl.to("#f07-scrim", { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.4);
      tl.fromTo("#f07-alert", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.4);

      // ---- 2.44 "alle keys": wash on both key cells ----
      washOn(["#f07-k-name", "#f07-k-age"], 2.44);

      // ---- 3.4: tap OK, the Alert fades ----
      touchDown("#f07-t-ok", 3.4);
      touchUp("#f07-t-ok", 3.55);
      tl.to(["#f07-alert", "#f07-scrim"], { opacity: 0, duration: 0.2, ease: "power1.inOut" }, 3.55);

      // ---- 4.40 "remove item": wash moves to removeItem("name") ----
      washOff(["#f07-hl-keys", "#f07-k-name", "#f07-k-age"], 4.40);
      washOn("#f07-hl-remove", 4.40);

      // ---- 5.44 "verwijder": tap REMOVE NAME (5.5); 5.6 row name out, row age slides up ----
      press("#f07-btn-remove", "#f07-t-remove", 5.5, 5.6);
      rowOut("#f07-r-name", 5.6);
      rowUp("#f07-r-age", 5.6);

      // ---- 7.28 "en": scroll one row (row 12 into the window, row 1 out) ----
      tl.set(["#f07-row12", "#f07-ln12"], { visibility: "visible" }, 7.28);
      tl.to(["#f07-lns", "#f07-lines"], { y: -ROW, duration: 0.6, ease: "power3.inOut" }, 7.28);
      tl.set(["#f07-row1", "#f07-ln1"], { visibility: "hidden" }, 7.88);

      // ---- 7.52 "clear": wash on clear(); tap CLEAR ALL (7.7); 7.8 row age out ----
      washOff("#f07-hl-remove", 7.52);
      washOn("#f07-hl-clear", 7.52);
      press("#f07-btn-clear", "#f07-t-clear", 7.7, 7.8);
      rowOut("#f07-r-age", 7.8);

      // ---- 8.48 "alles leeg": "leeg" fades in. Hold ----
      tl.to("#f07-empty", { opacity: 1, duration: 0.4, ease: "power1.out" }, 8.48);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["07-keys"] = tl;
    })();
  </script>
