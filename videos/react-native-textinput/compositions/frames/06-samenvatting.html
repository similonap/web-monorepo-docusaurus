      <div class="f06-col" id="f06-col3">
        <div class="ts-label">Chatbericht</div>
        <div class="ts-card">
          <div class="f06-bubble">Kom je straks naar de les?</div>
          <div class="f06-field f06-field--round" style="top: 196px;"><span class="f06-ph" id="f06-ph3">Typ een bericht</span><span><span class="f06-vc" id="f06-c0">J</span><span class="f06-vc" id="f06-c1">a</span><span class="f06-vc" id="f06-c2">,</span><span class="f06-vc" id="f06-c3"> </span><span class="f06-vc" id="f06-c4">t</span><span class="f06-vc" id="f06-c5">o</span><span class="f06-vc" id="f06-c6">t</span><span class="f06-vc" id="f06-c7"> </span><span class="f06-vc" id="f06-c8">z</span><span class="f06-vc" id="f06-c9">o</span><span class="f06-vc" id="f06-c10">!</span></span><span class="f06-caret" id="f06-caret3"></span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 8.29;

      var CH = 14.4; // JetBrains Mono 24px advance
      var FS = 24, CW = 0.6, X0 = 0, ROW = 34;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="06-samenvatting"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // ---- TEXTINPUT KIT ----
      // code rows: absolute, placed by slot (insert = rows below slide down, 0.35s). Only rows and line
      // numbers inside the 18-row window are shown; rows scrolled out or pushed below are hidden.
      var ALL = [], NL = 18, nLines = 18, slot = {}, scroll = 0, shown = {};
      function vis(sel, on, at, init) {
        if (shown[sel] === on) return;
        shown[sel] = on;
        if (init) { q(sel).style.opacity = on ? "1" : "0"; return; }
        if (on) tl.to(sel, { opacity: 1, duration: 0.3, ease: "power1.out" }, at);
        else tl.set(sel, { opacity: 0 }, at);
      }
      function refresh(atOn, atOff, init) {
        ALL.forEach(function (k) {
          var s = slot[k] - scroll, on = s > -1 && s < 18;
          vis("#f06-r-" + k, on, on ? atOn : atOff, init);
        });
        for (var n = 1; n <= NL; n++) {
          var s = n - 1 - scroll, on = n <= nLines && s > -1 && s < 18;
          vis("#f06-ln" + n, on, on ? atOn : atOff, init);
        }
      }
      // all = every row in file order, order = rows shown at the start, extra = {row: slot} for rows inserted later
      function initRows(all, order, extra, nl, lines) {
        ALL = all; NL = nl; nLines = lines;
        order.forEach(function (k, i) { slot[k] = i; });
        for (var k in extra) slot[k] = extra[k];
        ALL.forEach(function (k) { tl.set("#f06-r-" + k, { y: slot[k] * ROW }, 0); });
        refresh(0, 0, true);
      }
      function place(order, at, dur, lines) {
        order.forEach(function (k, i) {
          if (slot[k] === i) return;
          slot[k] = i;
          tl.to("#f06-r-" + k, { y: i * ROW, duration: dur, ease: "power3.out" }, at);
        });
        if (lines) nLines = lines;
        refresh(at, at + dur);
      }
      // scroll the code (line numbers and rows together) so `rows` rows are above the top
      function scrollCode(rows, at) {
        scroll = rows;
        tl.to(["#f06-lns", "#f06-lines"], { y: -rows * ROW, duration: 0.6, ease: "power3.inOut" }, at);
        refresh(at, at + 0.6);
      }
      // position inside .ph-app in dp (layout offsets, unaffected by the 1.4 scale)
      function appXY(el) {
        var x = 0, y = 0;
        while (el && !el.classList.contains("ph-app")) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
        return { x: x, y: y };
      }
      // put a touch indicator on a target (dx = x inside the target, default its centre)
      function aimAt(touchSel, targetSel, dx) {
        var t = q(targetSel), p = appXY(t), el = q(touchSel);
        el.style.left = (p.x + (dx === undefined ? t.offsetWidth / 2 : dx)) + "px";
        el.style.top = (p.y + t.offsetHeight / 2) + "px";
      }
      // a press: touch fades and scales in (0.15s), fades out on release (0.25s)
      function touch(sel, at, hold) {
        tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, at);
        tl.to(sel, { opacity: 0, duration: 0.25, ease: "power1.out" }, at + hold);
      }
      function keyFlash(sel, at, base, down) {
        tl.to(sel, { backgroundColor: down || "#CBD5E1", duration: 0.05, ease: "none" }, at);
        tl.to(sel, { backgroundColor: base || "#E2E8F0", duration: 0.2, ease: "power1.out" }, at + 0.12);
      }
      function kbUp(sel, at) { tl.to(sel, { yPercent: 0, duration: 0.4, ease: "power3.out" }, at); }
      function kbDown(sel, at) { tl.to(sel, { yPercent: 100, duration: 0.4, ease: "power3.inOut" }, at); }
      function showCh(sel, at) { tl.set(sel, { display: "inline" }, at); }
      // ---- end TEXTINPUT KIT ----

      function colIn(sel, at) { tl.fromTo(sel, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at); }
      function typeIn(prefix, n, start, per) { for (var i = 0; i < n; i++) showCh("#" + prefix + i, start + i * per); return start + n * per; }

      // ---- 0.0-1.9: kicker; "text input" (0.80): hero and bar ----
      tl.fromTo("#f06-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f06-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f06-hero", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
      tl.fromTo("#f06-hbar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.1);

      // ---- 1.9-3.9: "basis van elk formulier" (1.88): statement ----
      tl.fromTo("#f06-stmt", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.88);

      // ---- 3.9: "zoekveld": search field, "flexbox" typed, two results ----
      colIn("#f06-col1", 3.88);
      tl.set("#f06-caret1", { opacity: 1 }, 4.0);
      tl.set("#f06-ph1", { opacity: 0 }, 4.1);
      var e1 = typeIn("f06-a", 7, 4.1, 0.055);
      tl.to(["#f06-res1", "#f06-res2"], { opacity: 1, duration: 0.3, ease: "power1.out", stagger: 0.08 }, e1);
      tl.set("#f06-caret1", { opacity: 0 }, 4.72);

      // ---- 4.7: "login": e-mail, password dots, button ----
      colIn("#f06-col2", 4.72);
      tl.set("#f06-caret2", { opacity: 1 }, 4.85);
      typeIn("f06-b", 8, 4.95, 0.05);
      tl.set("#f06-caret2", { opacity: 0 }, 5.76);

      // ---- 5.8: "chatbericht": a message typed ----
      colIn("#f06-col3", 5.76);
      tl.set("#f06-caret3", { opacity: 1 }, 5.9);
      tl.set("#f06-ph3", { opacity: 0 }, 6.0);
      typeIn("f06-c", 11, 6.0, 0.055);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["06-samenvatting"] = tl;
    })();
  </script>
</template>
