            <div class="fx-row" id="f02-r-pad">        <span class="ts-hl" id="f02-hl-pad">paddingTop: Constants.statusBarHeight,</span></div>
            <div class="fx-row" id="f02-r-contc">    <span class="ts-hl" id="f02-hl-contc">},</span></div>
            <div class="fx-row" id="f02-r-inp">    <span class="ts-hl" id="f02-hl-inp">input: {</span></div>
            <div class="fx-row" id="f02-r-mar">        <span class="ts-hl" id="f02-hl-mar">margin: <span class="ts-fn">12</span>,</span></div>
            <div class="fx-row" id="f02-r-fs">        <span class="ts-hl" id="f02-hl-fs">fontSize: <span class="ts-fn">18</span>,</span></div>
            <div class="fx-row" id="f02-r-bw"><span class="ts-caret" id="f02-c-bw"></span>        </div>
            <div class="fx-row" id="f02-r-inpc">    <span class="ts-hl" id="f02-hl-inpc">},</span></div>
            <div class="fx-row" id="f02-r-stc"><span class="ts-hl" id="f02-hl-stc">});</span></div>
          </div>
        </div>
        <div class="ts-code-status">app/index.tsx · TextInput</div>
      </div>

      <!-- phone: the app as DOM, in dp -->
      <div class="ph-body" id="f02-phone">
        <div class="ph-speaker"></div>
        <div class="ph-screen">
          <div class="ph-app">
            <div class="ph-status"><span>9:41</span><span class="ph-status-icons"><span class="ph-sig"><i style="height:3px"></i><i style="height:5px"></i><i style="height:8px"></i></span><span class="ph-batt"></span></span></div>
            <div class="rn-root" id="f02-app" style="padding-top: 24px;">
              <div class="rn-input tx-input" id="f02-input" style="margin: 12px; font-size: 18px; border: 1px solid rgba(0, 0, 0, 0);"><span class="rn-placeholder tx-ph" id="f02-ph">Enter your name</span><span class="tx-val" id="f02-val"></span><span class="rn-caret" id="f02-caret"></span><span class="f02-outline" id="f02-outline"></span></div>
            </div>

          </div>
        </div>
        <div class="ph-home"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 10.63;

      var CH = 14.4; // JetBrains Mono 24px advance
      var FS = 24, CW = 0.6, X0 = 0, ROW = 34;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="02-placeholder"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // ---- TEXTINPUT KIT ----
      // code rows: absolute, placed by slot (insert = rows below slide down, 0.35s). Only rows and line
      // numbers inside the 18-row window are shown; rows scrolled out or pushed below are hidden.
      var ALL = [], NL = 18, nLines = 18, slot = {}, scroll = 0, shown = {};
      function vis(sel, on, at, init) {
        if (shown[sel] === on) return;
        shown[sel] = on;
        if (init) { q(sel).style.opacity = on ? "1" : "0"; return; }
        if (on) tl.to(sel, { opacity: 1, duration: 0.3, ease: "power1.out" }, at);
        else tl.set(sel, { opacity: 0 }, at);
      }
      function refresh(atOn, atOff, init) {
        ALL.forEach(function (k) {
          var s = slot[k] - scroll, on = s > -1 && s < 18;
          vis("#f02-r-" + k, on, on ? atOn : atOff, init);
        });
        for (var n = 1; n <= NL; n++) {
          var s = n - 1 - scroll, on = n <= nLines && s > -1 && s < 18;
          vis("#f02-ln" + n, on, on ? atOn : atOff, init);
        }
      }
      // all = every row in file order, order = rows shown at the start, extra = {row: slot} for rows inserted later
      function initRows(all, order, extra, nl, lines) {
        ALL = all; NL = nl; nLines = lines;
        order.forEach(function (k, i) { slot[k] = i; });
        for (var k in extra) slot[k] = extra[k];
        ALL.forEach(function (k) { tl.set("#f02-r-" + k, { y: slot[k] * ROW }, 0); });
        refresh(0, 0, true);
      }
      function place(order, at, dur, lines) {
        order.forEach(function (k, i) {
          if (slot[k] === i) return;
          slot[k] = i;
          tl.to("#f02-r-" + k, { y: i * ROW, duration: dur, ease: "power3.out" }, at);
        });
        if (lines) nLines = lines;
        refresh(at, at + dur);
      }
      // scroll the code (line numbers and rows together) so `rows` rows are above the top
      function scrollCode(rows, at) {
        scroll = rows;
        tl.to(["#f02-lns", "#f02-lines"], { y: -rows * ROW, duration: 0.6, ease: "power3.inOut" }, at);
        refresh(at, at + 0.6);
      }
      // position inside .ph-app in dp (layout offsets, unaffected by the 1.4 scale)
      function appXY(el) {
        var x = 0, y = 0;
        while (el && !el.classList.contains("ph-app")) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
        return { x: x, y: y };
      }
      // put a touch indicator on a target (dx = x inside the target, default its centre)
      function aimAt(touchSel, targetSel, dx) {
        var t = q(targetSel), p = appXY(t), el = q(touchSel);
        el.style.left = (p.x + (dx === undefined ? t.offsetWidth / 2 : dx)) + "px";
        el.style.top = (p.y + t.offsetHeight / 2) + "px";
      }
      // a press: touch fades and scales in (0.15s), fades out on release (0.25s)
      function touch(sel, at, hold) {
        tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, at);
        tl.to(sel, { opacity: 0, duration: 0.25, ease: "power1.out" }, at + hold);
      }
      function keyFlash(sel, at, base, down) {
        tl.to(sel, { backgroundColor: down || "#CBD5E1", duration: 0.05, ease: "none" }, at);
        tl.to(sel, { backgroundColor: base || "#E2E8F0", duration: 0.2, ease: "power1.out" }, at + 0.12);
      }
      function kbUp(sel, at) { tl.to(sel, { yPercent: 0, duration: 0.4, ease: "power3.out" }, at); }
      function kbDown(sel, at) { tl.to(sel, { yPercent: 100, duration: 0.4, ease: "power3.inOut" }, at); }
      function showCh(sel, at) { tl.set(sel, { display: "inline" }, at); }
      // ---- end TEXTINPUT KIT ----

      var FINAL = ["imp1", "imp2", "b1", "idx", "ret", "view", "ti", "ph", "sty", "close", "viewc", "retc", "brace", "b2", "sts", "cont", "flex", "pad", "contc", "inp", "mar", "fs", "bw", "inpc", "stc"];
      var S0 = ["imp1", "imp2", "b1", "idx", "ret", "view", "ti", "sty", "close", "viewc", "retc", "brace", "b2", "sts", "cont", "flex", "pad", "contc", "inp", "mar", "fs", "inpc", "stc"];
      var S1 = ["imp1", "imp2", "b1", "idx", "ret", "view", "ti", "ph", "sty", "close", "viewc", "retc", "brace", "b2", "sts", "cont", "flex", "pad", "contc", "inp", "mar", "fs", "inpc", "stc"];
      initRows(FINAL, S0, { ph: S1.indexOf("ph"), bw: FINAL.indexOf("bw") }, 25, 23);

      // ---- intro: kicker; panel and phone in ----
      tl.fromTo("#f02-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f02-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f02-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#f02-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);

      // ---- 0.2-3.7: "placeholder" (0.24): row 8 inserted and typed; the hint shows when typed; "hint" (1.52): wash ----
      place(S1, 0.24, 0.35, 24);
      var tPh = typeLine("#f02-r-ph", "#f02-c-ph", [{ id: "f02-hl-ph", parts: [{ t: "placeholder" }, { t: "=", c: "ts-punct" }, { t: "\"Enter your name\"", c: "ts-str" }] }], 16, 0.34, 0.03);
      tl.to("#f02-ph", { opacity: 1, duration: 0.3, ease: "power1.out" }, tPh.end);
      washOn("#f02-hl-ph", 1.52);
      washOff("#f02-hl-ph", 3.5);

      // ---- 3.7-7.4: "text input" (4.80): wash on <TextInput; "geen rand" (6.40): dashed outline shows where the field is ----
      washOn("#f02-hl-ti", 4.8);
      tl.to("#f02-outline", { opacity: 1, duration: 0.35, ease: "power1.out" }, 6.4);
      washOff("#f02-hl-ti", 7.2);

      // ---- 7.4-end: "die geef je zelf" (7.44): scroll to the styles; "border width" (8.72): row typed, border on ----
      scrollCode(7, 7.44);
      place(FINAL, 8.72, 0.35, 25);
      var tBw = typeLine("#f02-r-bw", "#f02-c-bw", [{ id: "f02-hl-bw", parts: [{ t: "borderWidth: " }, { t: "1", c: "ts-fn" }, { t: "," }] }], 8, 8.82, 0.025);
      tl.to("#f02-input", { borderColor: "#000000", duration: 0.3, ease: "power1.out" }, tBw.end);
      tl.to("#f02-outline", { opacity: 0, duration: 0.3, ease: "power1.out" }, tBw.end);
      washOn("#f02-hl-bw", tBw.end);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["02-placeholder"] = tl;
    })();
  </script>
</template>
