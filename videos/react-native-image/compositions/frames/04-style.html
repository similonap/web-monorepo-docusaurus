      var root = document.querySelector('[data-composition-id="04-style"]');

      var CH = 14.4; // JetBrains Mono 24px advance
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row).
      // A segment is { t, c } or { id, parts: [{ t, c }] } (wrapped in a .ts-hl span for washes),
      // or { el, n }: an element already in the row that appears as one step of n characters.
      var FS = 24, CW = 0.6, X0 = 0;
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var steps = [];
        var marks = {};
        segments.forEach(function (seg) {
          if (seg.el) { var e = q(seg.el); steps.push({ el: e, n: seg.n }); return; }
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              steps.push({ el: s, n: 1 });
            }
          });
        });
        var chPx = FS * CW;
        tl.set(steps.map(function (s) { return s.el; }), { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        var at = start, c = col;
        steps.forEach(function (s) {
          tl.to(s.el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          c += s.n;
          tl.set(caret, { x: X0 + c * chPx }, at);
          at += per * Math.min(s.n, 2);
        });
        tl.set(caret, { opacity: 0 }, at);
        return { end: at, col: c, marks: marks };
      }

      // code scroll: the line numbers and the rows move together, a calm 0.6s
      function scrollTo(panel, rows, at) {
        var els = [panel + " .fx-lns", panel + " .fx-lines"];
        // rows that scrolled out above stay clipped; hide them once the scroll is done
        var gone = Array.prototype.slice.call(q(panel + " .fx-lns").children, 0, rows)
          .concat(Array.prototype.slice.call(q(panel + " .fx-lines").children, 0, rows));
        if (at === 0) { tl.set(els, { y: -34 * rows }, 0); tl.set(gone, { opacity: 0 }, 0); return; }
        tl.to(els, { y: -34 * rows, duration: 0.6, ease: "power3.inOut" }, at);
        tl.set(gone, { opacity: 0 }, at + 0.6);
      }
      // inserted rows: the rows below slide down into place (0.35s power3.out)
      function slideIn(sel, at) { tl.to(sel, { y: 0, duration: 0.35, ease: "power3.out" }, at); }
      function fadeIn(sel, at, d) { tl.to(sel, { opacity: 1, duration: d || 0.35, ease: "power1.out" }, at); }
      function fadeOut(sel, at, d) { tl.to(sel, { opacity: 0, duration: d || 0.35, ease: "power1.inOut" }, at); }
      function popIn(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, at); }
      function intro(n) {
        tl.fromTo("#f" + n + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + n + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#f" + n + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + n + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }


      intro("04");
      scrollTo("#f04-panel", 6, 0);
      tl.set("#f04-below1", { y: -34 }, 0);
      tl.set("#f04-below2", { y: -34 }, 0);

      // ---- 0.0-2.5: "style" (0.64): wash on the style prop ----
      washOn("#f04-hl-style", 0.64);
      washOff("#f04-hl-style", 2.4);

      // ---- 2.5-4.2: "width" (2.72), "height" (3.56) ----
      washOn("#f04-hl-w", 2.72);
      washOn("#f04-hl-h", 3.56);
      washOff("#f04-hl-w, #f04-hl-h", 4.4);

      // ---- 4.2-4.8: "margin" (4.24): row 22 inserted and typed; the image gets its margin ----
      slideIn("#f04-below1", 4.2);
      fadeIn("#f04-ln24", 4.2);
      var tm = typeLine("#f04-l22", "#f04-c22", [{ id: "f04-hl-m", parts: [{ t: "margin: " }, { t: "20", c: "ts-fn" }, { t: "," }] }], 8, 4.28, 0.028);
      // margin: 20 moves the Image 20 dp right and down (as a transform, same result in this layout)
      tl.to("#f04-img", { x: 20, y: 20, duration: 0.4, ease: "power3.out" }, tm.end);

      // ---- 4.8-6.2: "border radius" (4.88): row 23 inserted and typed; the corners round a little ----
      scrollTo("#f04-panel", 7, 4.8);
      slideIn("#f04-below2", 4.84);
      fadeIn("#f04-ln25", 4.84);
      var tr = typeLine("#f04-rk", "#f04-c23", [{ t: "borderRadius: " }, { el: "#f04-v12", n: 2 }, { el: "#f04-rc", n: 1 }], 8, 4.94, 0.025);
      tl.to("#f04-img", { borderRadius: 12, duration: 0.4, ease: "power3.out" }, tr.end);

      // ---- 6.2-end: "grote border radius" (6.80/7.12): 12 -> 80, the photo turns round; "ronde" (8.80): mark ----
      washOn("#f04-hl-r", 6.80);
      swapVal("#f04-v12", "#f04-v80", "#f04-rv", 2, 7.12);
      tl.to("#f04-img", { borderRadius: 80, duration: 0.8, ease: "power3.inOut" }, 7.12);
      fadeIn("#f04-mark-r", 8.80);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["04-style"] = tl;
    })();
  </script>
</template>
