        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // rows outside the 18-row window are faded out (line numbers and code rows by number, 1-based)
      function rowVis(cid, lnFrom, lnTo, rowFrom, rowTo, v, at, dur) {

        for (var j = rowFrom; j <= rowTo; j++) if (rows[j - 1]) els.push(rows[j - 1]);
        if (!els.length) return;
        if (!dur) tl.set(els, { opacity: v }, at);
        else tl.to(els, { opacity: v, duration: dur, ease: "power1.inOut" }, at);
      }

      tl.fromTo("#f01-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.32);

      tl.to(".f01-a", { opacity: 0, y: -10, duration: 0.3, ease: "power2.in", stagger: 0.05 }, 4.24);
      tl.fromTo(".f01-b", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.05, immediateRender: false }, 4.4);
      fadeSwap("#f01-tA", "#f01-tB", 4.24);

      tl.set(".f01-cu", { scaleX: 0 }, 0);
