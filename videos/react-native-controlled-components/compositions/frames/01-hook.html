    (function () {
      var DUR = 9.91;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // chip / label pop: opacity, y 10 -> 0, scale 0.96 -> 1
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      // keyboard: key darkens for 0.12s; keyboard slides up on focus
      function keyFlash(sel, at) {
        tl.to(sel, { backgroundColor: "#CBD5E1", duration: 0.05, ease: "none" }, at);
        tl.to(sel, { backgroundColor: "#E2E8F0", duration: 0.2, ease: "power1.out" }, at + 0.12);
      }
      function kbUp(sel, at) { tl.to(sel, { yPercent: 0, duration: 0.4, ease: "power3.out" }, at); }
      function showCh(sel, at) { tl.set(sel, { display: "inline" }, at); }

      tl.set("#f01-kbw", { yPercent: 100 }, 0);

      // ---- 0.1: the centred phone fades in with the empty field; "controlled" (0.56): kicker ----
      tl.set(["#f01-phone", "#f01-chips"], { x: -707 }, 0);
      tl.fromTo("#f01-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);

      tl.fromTo("#f01-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.66);

      // ---- "component" (1.00): the state chip text: "" pops above the phone ----
      pop("#f01-state", 1.0);

      // ---- "waarde" (1.92): focus, keyboard up; Hallo typed 2.0-2.8, chip follows per letter ----
      tl.set("#f01-caret", { opacity: 1 }, 1.92);
      kbUp("#f01-kbw", 1.92);
      var KEYS = "hallo";
      for (var i = 0; i < 5; i++) {
        var at = 2.0 + i * 0.2;
        showCh("#f01-v" + i, at);
        showCh("#f01-c" + i, at);
        keyFlash("#f01-k-" + KEYS[i], at);
      }

      // ---- "state" (3.52): phone and chip to the standard place; hero lands; hero bar (3.90) ----
      tl.to(["#f01-phone", "#f01-chips"], { x: 0, duration: 0.8, ease: "power3.inOut" }, 3.52);

      tl.fromTo("#f01-cmark", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 5.2);

      tl.set({}, {}, DUR);
