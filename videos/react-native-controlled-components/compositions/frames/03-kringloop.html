  <script>
    (function () {
      var DUR = 10.95;
      var CH = 14.4; // JetBrains Mono 24px advance
      var S = 1.4;   // 1 dp = 1.4 px
      var root = document.querySelector('[data-composition-id="03-kringloop"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }

      // ---- APP KIT helpers ----
      // box of an element in dp, relative to .ph-app (layout is measured once, before any tween)
      function dpBox(sel) {
        var el = q(sel), x = 0, y = 0, e = el;
        while (e && !e.classList.contains("ph-app")) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
        return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
      }
      // chip / label pop: opacity, y 10 -> 0, scale 0.96 -> 1
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      // ---- end APP KIT helpers ----

      // ---- TEXTINPUT KIT ----
      function keyFlash(sel, at, base, down) {
        tl.to(sel, { backgroundColor: down || "#CBD5E1", duration: 0.05, ease: "none" }, at);
        tl.to(sel, { backgroundColor: base || "#E2E8F0", duration: 0.2, ease: "power1.out" }, at + 0.12);
      }
      function showCh(sel, at) { tl.set(sel, { display: "inline" }, at); }
      // ---- end TEXTINPUT KIT ----

      // ---- cycle helpers ----
      var GREY = "#E2E8F0", PANEL = "#F1F5F9", BLUE = "#3178C6", TINT = "#EAF2FB";
      function nodeOn(i, at) { tl.to("#f03-n" + i, { borderColor: BLUE, backgroundColor: TINT, duration: 0.3, ease: "power3.out" }, at); }
      function nodeOff(i, at) { tl.to("#f03-n" + i, { borderColor: GREY, backgroundColor: PANEL, duration: 0.3, ease: "power1.inOut" }, at); }
      // dot along its CSS offset-path (deterministic: GSAP tweens offset-distance)
      function travel(i, at, dur) {
        tl.fromTo("#f03-d" + i, { offsetDistance: "0%" }, { offsetDistance: "100%", duration: dur, ease: "power2.inOut", immediateRender: false }, at);
        tl.to("#f03-d" + i, { opacity: 1, duration: 0.12, ease: "power1.out" }, at);
        tl.to("#f03-d" + i, { opacity: 0, duration: 0.15, ease: "power1.in" }, at + dur - 0.1);
      }

      // the field mark, measured from the layout (screen px)
      var fb = dpBox("#f03-input");
      tl.set("#f03-mark", { attr: { x: fb.x * S + 1.5, y: fb.y * S + 1.5, width: fb.w * S - 3, height: fb.h * S - 3 } }, 0);

      // ---- 0.0-0.3: kicker, phone and chip in; cards fade in from 0.3 ----
      tl.fromTo("#f03-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f03-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f03-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.fromTo("#f03-chips", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.fromTo(["#f03-n0", "#f03-n1", "#f03-n2", "#f03-n3"], { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 }, 0.3);

      // ---- 1.08 "rond": the four arcs draw on clockwise (1.08-1.70), heads land at each arc's end ----
      for (var i = 0; i < 4; i++) {
        var a = 1.08 + i * 0.14;
        tl.fromTo("#f03-a" + i, { strokeDashoffset: 302 }, { strokeDashoffset: 0, duration: 0.2, ease: "power1.inOut" }, a);
        tl.fromTo("#f03-h" + i, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, a + 0.16);
      }

      // ---- 1.76 "je typt": key `!` pressed; node `je typt` active; the dot waits at the top node ----
      keyFlash("#f03-k-m", 1.76);
      nodeOn(0, 1.76);
      tl.fromTo("#f03-d0", { opacity: 0, offsetDistance: "0%" }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.76);

      // ---- 2.88 "state verandert": dot to the right node; chip "Hoi" -> "Hoi!" (the field keeps "Hoi") ----
      tl.to("#f03-d0", { offsetDistance: "100%", duration: 0.5, ease: "power2.inOut" }, 2.7);
      tl.to("#f03-d0", { opacity: 0, duration: 0.15, ease: "power1.in" }, 3.1);
      nodeOff(0, 2.88);
      nodeOn(1, 2.88);
      swapVal("#f03-cv1", "#f03-cv2", "#f03-cv", 6, 2.88);

      // ---- 4.36 "component": dot to the bottom node (render); 4.72 "rendert": render tag ----
      travel(1, 4.16, 0.5);
      nodeOff(1, 4.5);
      nodeOn(2, 4.5);
      pop("#f03-rtag", 4.72);

      // ---- 6.08 "veld": dot to the left node; 6.48 "toont": the field shows "Hoi!" ----
      travel(2, 5.88, 0.5);
      nodeOff(2, 6.2);
      nodeOn(3, 6.2);
      showCh("#f03-v3", 6.48);

      // ---- 7.20 "nieuwe waarde": dot back to the top; all nodes neutral; mark on the field ----
      travel(3, 6.95, 0.5);
      nodeOff(3, 7.3);
      tl.to("#f03-mark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 7.2);

      // ---- 8.08 "Die kan je": code chip in the centre; 9.36 "tonen": the Text appears in the phone ----
      pop("#f03-codechip", 8.08);
      tl.to("#f03-mark", { opacity: 0, duration: 0.35, ease: "power1.inOut" }, 9.0);
      tl.fromTo("#f03-text", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 9.36);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["03-kringloop"] = tl;
    })();
