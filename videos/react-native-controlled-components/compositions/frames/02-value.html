</div><div data-hf-id="hf-c95d" class="kb-row"><span data-hf-id="hf-9mye" class="kb-key kb-key--wide">123</span><span data-hf-id="hf-txff" class="kb-key kb-key--space"></span><span data-hf-id="hf-87gs" class="kb-key kb-key--ret" id="f02-k-ret">gereed</span></div></div></div>

  <script>
    (function () {
      var DUR = 9.99;
      var CH = 14.4; // JetBrains Mono 24px advance
      var FS = 24, CW = 0.6, X0 = 0, ROW = 34;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="02-value"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
          if (seg.id) marks[seg.id + ":end"] = start + chars.length * per;
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // chip / label pop: opacity, y 10 -> 0, scale 0.96 -> 1
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      function intro(nn) {
        tl.fromTo("#f" + nn + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#f" + nn + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }

      // ---- TEXTINPUT KIT ----
      // code rows: absolute, placed by slot (insert = rows below slide down, 0.35s). Only rows and line
      // numbers inside the 18-row window are shown.
      var ALL = [], NL = 18, nLines = 18, slot = {}, scroll = 0, shown = {};
      function vis(sel, on, at, init) {
        if (shown[sel] === on) return;
        shown[sel] = on;
        if (init) { q(sel).style.opacity = on ? "1" : "0"; return; }
        if (on) tl.to(sel, { opacity: 1, duration: 0.3, ease: "power1.out" }, at);
        else tl.set(sel, { opacity: 0 }, at);
      }
      function refresh(atOn, atOff, init) {
        ALL.forEach(function (k) {
          var s = slot[k] - scroll, on = s > -1 && s < 18;
          vis("#f02-r-" + k, on, on ? atOn : atOff, init);
        });
        for (var n = 1; n <= NL; n++) {
          var s = n - 1 - scroll, on = n <= nLines && s > -1 && s < 18;
          vis("#f02-ln" + n, on, on ? atOn : atOff, init);
        }
      }
      // all = every row in file order, order = rows shown at the start, extra = {row: slot} for rows inserted later
      function initRows(all, order, extra, nl, lines) {
        ALL = all; NL = nl; nLines = lines;
        order.forEach(function (k, i) { slot[k] = i; });
        for (var k in extra) slot[k] = extra[k];
        ALL.forEach(function (k) { tl.set("#f02-r-" + k, { y: slot[k] * ROW }, 0); });
        refresh(0, 0, true);
      }
      function place(order, at, dur, lines) {
        order.forEach(function (k, i) {
          if (slot[k] === i) return;
          slot[k] = i;
          tl.to("#f02-r-" + k, { y: i * ROW, duration: dur, ease: "power3.out" }, at);
        });
        if (lines) nLines = lines;
        refresh(at, at + dur);
      }
      function keyFlash(sel, at, base, down) {
        tl.to(sel, { backgroundColor: down || "#CBD5E1", duration: 0.05, ease: "none" }, at);
        tl.to(sel, { backgroundColor: base || "#E2E8F0", duration: 0.2, ease: "power1.out" }, at + 0.12);
      }
      function kbUp(sel, at) { tl.to(sel, { yPercent: 0, duration: 0.4, ease: "power3.out" }, at); }
      function showCh(sel, at) { tl.set(sel, { display: "inline" }, at); }
      // ---- end TEXTINPUT KIT ----

      var FINAL = ["impr", "imprn", "b1", "idx", "st", "b2", "ret", "view", "ti", "sty", "oct", "val", "close", "viewc", "retc", "brace"];
      var S0 = ["impr", "imprn", "b1", "idx", "b2", "ret", "view", "ti", "sty", "close", "viewc", "retc", "brace"];
      var S1 = ["impr", "imprn", "b1", "idx", "st", "b2", "ret", "view", "ti", "sty", "close", "viewc", "retc", "brace"];
      var S2 = ["impr", "imprn", "b1", "idx", "st", "b2", "ret", "view", "ti", "sty", "val", "close", "viewc", "retc", "brace"];
      // inserted rows start empty at the slot they open into
      initRows(FINAL, S0, { st: S1.indexOf("st"), val: S2.indexOf("val"), oct: FINAL.indexOf("oct") }, 16, 13);
      tl.set("#f02-kbw", { yPercent: 100 }, 0);

      // one key press: the key darkens, the field and the state chip get the next letter
      var KEYS = "hoi";
      function key(i, at, chipAt) {
        keyFlash("#f02-k-" + KEYS[i], at);
        showCh("#f02-v" + i, at);
        showCh("#f02-cv" + i, chipAt);
      }

      // ---- 0.0-0.3: kicker, panel and phone in ----
      intro("02");

      // ---- 0.3-1.6: "state" (0.76): row 5 opens and types on; "use state" (1.44): wash; 1.6 chip pops ----
      place(S1, 0.3, 0.35, 14);
      var tSt = typeLine("#f02-r-st", "#f02-c-st", [{ parts: [{ t: "const", c: "ts-kw" }, { t: " [text, setText] = " }] }, { id: "f02-hl-us", parts: [{ t: "useState", c: "ts-fn" }, { t: "<", c: "ts-punct" }, { t: "string", c: "ts-type" }, { t: ">", c: "ts-punct" }, { t: "(" }, { t: "\"\"", c: "ts-str" }, { t: ")" }] }, { t: ";" }], 4, 0.42, 0.022);
      washOn("#f02-hl-us", 1.44);
      pop("#f02-state", 1.6);

      // ---- 2.6-3.2: "geeft" (2.68): row 12 opens, value={text} types on; "value" (3.52): wash + mark on the field ----
      washOff("#f02-hl-us", 2.6);
      place(S2, 2.6, 0.35, 15);
      typeLine("#f02-r-val", "#f02-c-val", [{ id: "f02-hl-val", parts: [{ t: "value" }, { t: "={", c: "ts-punct" }, { t: "text" }, { t: "}", c: "ts-punct" }] }], 16, 2.7, 0.04);
      washOn("#f02-hl-val", 3.52);
      tl.to("#f02-pmark", { opacity: 1, duration: 0.35, ease: "power1.out" }, 3.52);

      // ---- 4.96 "toets": washes off ----
      washOff("#f02-hl-val", 4.96);
      tl.to("#f02-pmark", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 4.96);

      // ---- 5.76 "on change text": row 11 opens and types on (5.8-6.8); wash on onChangeText ----
      place(FINAL, 5.76, 0.35, 16);
      var tOc = typeLine("#f02-r-oct", "#f02-c-oct", [
        { id: "f02-hl-oct", parts: [{ t: "onChangeText" }] },
        { t: "={", c: "ts-punct" },
        { id: "f02-hl-par", parts: [{ t: "text " }, { t: "=>", c: "ts-kw" }] },
        { t: " " },
        { id: "f02-hl-set", parts: [{ t: "setText", c: "ts-fn" }, { t: "(text)" }] },
        { t: "}", c: "ts-punct" }
      ], 16, 5.84, 0.026);
      washOn("#f02-hl-oct", tOc.marks["f02-hl-oct:end"]);

      // ---- 6.6: field gets focus, keyboard up; 6.88 "set text": H; 7.30: o; 7.70: i ----
      tl.set("#f02-caret", { opacity: 1 }, 6.6);
      kbUp("#f02-kbw", 6.6);
      washOff("#f02-hl-oct", 6.88);
      washOn("#f02-hl-set", 6.88);
      key(0, 6.88, 6.95);
      key(1, 7.3, 7.37);
      key(2, 7.7, 7.77);

      // ---- 8.16 "nieuwe tekst": wash on the parameter text => ----
      washOff("#f02-hl-set", 8.16);
      washOn("#f02-hl-par", 8.16);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["02-value"] = tl;
    })();
  </script>
