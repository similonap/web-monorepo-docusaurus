  <script>
    (function () {
      var DUR = 17.28;
      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 24;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="12-createpost"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      // (optional `geo` = { fs, x0 } for the mini panel's smaller type)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead, geo) {
        if (lead === undefined) lead = 0.1;
        var fs = geo ? geo.fs : FS;
        var x0 = geo ? geo.x0 : X0;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = fs * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: x0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: x0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // ---- Scene 1 (0.0-4.4): kicker; "data aanpassen?" (0.64) code surface; "functie" (2.56) line 3; "context." (3.52) wash ----
      tl.fromTo("#f12c-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f12c-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo("#f12c-panelA", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.64);

      var l3 = typeLine("#f12c-l3", "#f12c-c3", [
        { t: "  " },
        { id: "f12c-hl-type", parts: [
          { t: "createPost: (post: " },
          { t: "Post", c: "ts-type" },
          { t: ") " },
          { t: "=>", c: "ts-kw" },
          { t: " " },
          { t: "void", c: "ts-type" },
          { t: ";" }
        ] }
      ], 0, 2.56, 0.018);
      washOn("#f12c-hl-type", Math.max(3.52, l3.end + 0.05));

      // ---- Scene 2 (4.4-10.4): "Create post" (4.56) skeleton; "POST request" (6.12) fetch; "voegt" (8.08) add to list ----
      washOff("#f12c-hl-type", 4.56);
      var e = typeLine("#f12c-l6", "#f12c-c6", [
        { t: "  " },
        { t: "const", c: "ts-kw" },
        { t: " " },
        { t: "createPost", c: "ts-fn" },
        { t: " = " },
        { t: "async", c: "ts-kw" },
        { t: " (post: " },
        { t: "Post", c: "ts-type" },
        { t: ") " },
        { t: "=>", c: "ts-kw" },
        { t: " {" }
      ], 0, 4.56, 0.012);
      e = typeLine("#f12c-l16", "#f12c-c16", [
        { t: "  }" }
      ], 0, e.end + 0.02, 0.016, 0.03);
      typeLine("#f12c-l7", "#f12c-c7", [
        { t: "    " },
        { t: "setLoading", c: "ts-fn" },
        { t: "(" },
        { t: "true", c: "ts-fn" },
        { t: ");" }
      ], 0, e.end + 0.02, 0.012, 0.03);

      var PER_F = 0.009;
      var f = typeLine("#f12c-l8", "#f12c-c8", [
        { t: "    " },
        { t: "const", c: "ts-kw" },
        { t: " response = " },
        { t: "await", c: "ts-kw" },
        { t: " " },
        { t: "fetch", c: "ts-fn" },
        { t: "(url, {" }
      ], 0, 6.12, PER_F, 0.06);
      var l9 = typeLine("#f12c-l9", "#f12c-c9", [
        { t: "      " },
        { id: "f12c-hl-method", parts: [
          { t: "method: " },
          { t: "\"POST\"", c: "ts-str" }
        ] },
        { t: "," }
      ], 0, f.end + 0.02, PER_F, 0.03);
      washOn("#f12c-hl-method", Math.max(6.32, l9.marks["f12c-hl-method"] + 0.05));
      f = typeLine("#f12c-l10", "#f12c-c10", [
        { t: "      body: JSON." },
        { t: "stringify", c: "ts-fn" },
        { t: "(post)," }
      ], 0, l9.end + 0.02, PER_F, 0.03);
      f = typeLine("#f12c-l11", "#f12c-c11", [
        { t: "      headers: { " },
        { t: "\"Content-type\"", c: "ts-str" },
        { t: ": " },
        { t: "\"application/json; charset=UTF-8\"", c: "ts-str" },
        { t: " }" }
      ], 0, f.end + 0.02, PER_F, 0.03);
      typeLine("#f12c-l12", "#f12c-c12", [
        { t: "    });" }
      ], 0, f.end + 0.02, PER_F, 0.03);

      washOff("#f12c-hl-method", 8.08);
      var g = typeLine("#f12c-l13", "#f12c-c13", [
        { t: "    " },
        { t: "const", c: "ts-kw" },
        { t: " json = " },
        { t: "await", c: "ts-kw" },
        { t: " response." },
        { t: "json", c: "ts-fn" },
        { t: "();" }
      ], 0, 8.08, 0.012);
      var l14 = typeLine("#f12c-l14", "#f12c-c14", [
        { t: "    " },
        { id: "f12c-hl-set", parts: [
          { t: "setPosts", c: "ts-fn" },

      washOn("#f12c-hl-set", l14.marks["f12c-hl-set"] + 0.08);
      typeLine("#f12c-l15", "#f12c-c15", [
        { t: "    " },
        { t: "setLoading", c: "ts-fn" },

        { t: "false", c: "ts-fn" },

      // "lijst." (9.72): hold

      // ---- Scene 3 (10.4-17.28) ----
      // "Vergeet niet:" (10.52): mini panel with the value block settles in
      washOff("#f12c-hl-set", 10.52);
      tl.fromTo("#f12c-mini", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 10.52);

      // "create post" (11.92): line 5 types on

      // "value" (13.28): the blue box draws around it
      tl.fromTo("#f12c-boxrect", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 13.28);

      // 14.8: code surface crossfades to PostForm.tsx (whoosh-short @15.0), wash on line 2
      tl.to("#f12c-panelA", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 14.8);

      washOn("#f12c-hl-use", 15.2);

      // "post form" (15.6): scherm card with the filled form and two rows

      tl.set("#f12c-new", { opacity: 0 }, 0);

      // "gewoon" (16.32): cursor clicks Create (dip + ripple)
      var TIP_X = 1756;
      var TIP_Y = 646;
      var CLICK_AT = 16.32;
      var PRESS = 0.1;
      var TIP_ORIGIN = "20.83% 12.5%";
      var cursor = q("#f12c-cursor");
      tl.set(cursor, { opacity: 1 }, 15.74);
      tl.fromTo(cursor,
        { xPercent: -20.83, yPercent: -12.5, x: 2060, y: 900, scale: 1 },
        { xPercent: -20.83, yPercent: -12.5, x: TIP_X, y: TIP_Y, duration: 0.52, ease: "power3.out" },

      tl.to(cursor, { x: 1800, y: 700, duration: 0.5, ease: "power2.inOut" }, CLICK_AT + 0.4);

      // "gebruiken." (16.64): the new row settles in at the bottom
      tl.fromTo("#f12c-new", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 16.64);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["12-createpost"] = tl;
    })();
