                    <div data-hf-id="hf-kcrh" class="rn-view f01-row"><span data-hf-id="hf-qjwd" class="rn-text" style="font-size: 16px;">Item 20</span></div>
                    <div data-hf-id="hf-n5ux" class="rn-view f01-row"><span data-hf-id="hf-qy7e" class="rn-text" style="font-size: 16px;">Item 21</span></div>
                    <div data-hf-id="hf-nk5y" class="rn-view f01-row"><span data-hf-id="hf-rcif" class="rn-text" style="font-size: 16px;">Item 22</span></div>
                    <div data-hf-id="hf-nygz" class="rn-view f01-row"><span data-hf-id="hf-rqtg" class="rn-text" style="font-size: 16px;">Item 23</span></div>
                    <div data-hf-id="hf-ocs0" class="rn-view f01-row"><span data-hf-id="hf-s54h" class="rn-text" style="font-size: 16px;">Item 24</span></div>
                    <div data-hf-id="hf-lkmt" class="rn-view f01-row"><span data-hf-id="hf-sjfi" class="rn-text" style="font-size: 16px;">Item 25</span></div>
                    <div data-hf-id="hf-lyxu" class="rn-view f01-row"><span data-hf-id="hf-sxqj" class="rn-text" style="font-size: 16px;">Item 26</span></div>
                    <div data-hf-id="hf-md8v" class="rn-view f01-row"><span data-hf-id="hf-tc1k" class="rn-text" style="font-size: 16px;">Item 27</span></div>
                    <div data-hf-id="hf-mrjw" class="rn-view f01-row"><span data-hf-id="hf-tqcl" class="rn-text" style="font-size: 16px;">Item 28</span></div>
                    <div data-hf-id="hf-jzep" class="rn-view f01-row"><span data-hf-id="hf-u4nm" class="rn-text" style="font-size: 16px;">Item 29</span></div>
                    <div data-hf-id="hf-kdpq" class="rn-view f01-row"><span data-hf-id="hf-ps8k" class="rn-text" style="font-size: 16px;">Item 30</span></div>

                  <div data-hf-id="hf-ihbs" id="f01-ind"></div>

            </div>
            <div data-hf-id="hf-c3rx" class="ph-touch" id="f01-touch"></div>
          </div>
          <!-- .ph-mark as a DOM outline (same 3px blue stroke) around the visible part of the list -->
          <div data-hf-id="hf-cpie" id="f01-mark"></div>
        </div>
        <div data-hf-id="hf-xjm4" class="ph-home"></div>

  </div>

  <script>
    (function () {
      var DUR = 8.63;
      var CH = 14.4; // JetBrains Mono 24px advance
      var FS = 24, CW = 0.6, X0 = 0;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="01-hook"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // ---- APP KIT helpers ----
      // box of an element in dp, relative to .ph-app (layout is measured once, before any tween)
      function dpBox(sel) {
        var el = q(sel), x = 0, y = 0, e = el;
        while (e && !e.classList.contains("ph-app")) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
        return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
      }
      // centre an absolutely placed element (touch, ring) on a dp box
      function placeOn(sel, b) { var el = q(sel); el.style.left = (b.x + b.w / 2) + "px"; el.style.top = (b.y + b.h / 2) + "px"; }
      // a finger press: touch fades and scales in (0.6 -> 1, 0.15s); on release it fades out (0.25s)
      function touchDown(sel, at) { tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, at); }
      function touchUp(sel, at) { tl.to(sel, { opacity: 0, duration: 0.25, ease: "power1.out" }, at); }
      // chip / label pop: opacity, y 10 -> 0, scale 0.96 -> 1
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      // panel rows scroll together with the line numbers
      function scrollTo(nn, rows, at) { tl.to(["#f" + nn + "-lns", "#f" + nn + "-lines"], { y: -34 * rows, duration: 0.6, ease: "power3.inOut" }, at); }
      function intro(nn) {
        tl.fromTo("#f" + nn + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#f" + nn + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }
      // rows outside the 18-row window are hidden (not only clipped), by final row number
      function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }
      function rowEls(nn, idxs) { var r = root.querySelectorAll("#f" + nn + "-lines .fx-row"); return idxs.map(function (i) { return r[i - 1]; }); }
      function lnEls(nn, idxs) { var r = root.querySelectorAll("#f" + nn + "-lns > div"); return idxs.map(function (i) { return r[i - 1]; }); }
      function hideEls(els, at, dur) { if (dur) tl.to(els, { autoAlpha: 0, duration: dur, ease: "power1.inOut" }, at); else tl.set(els, { autoAlpha: 0 }, at); }
      function showEls(els, at, dur) { if (dur) tl.to(els, { autoAlpha: 1, duration: dur, ease: "power1.inOut" }, at); else tl.set(els, { autoAlpha: 1 }, at); }
      // ---- end APP KIT helpers ----

      // ---- 0.0-2.3: the centred phone fades in (empty app); "lange lijsten" (0.28): rows appear ----
      tl.set("#f01-phone", { x: -707 }, 0);
      tl.fromTo("#f01-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      var rows = root.querySelectorAll(".f01-row");
      var VIS = 10; // 440 dp viewport / 44 dp rows
      for (var i = 0; i < rows.length; i++) {
        if (i < VIS) tl.fromTo(rows[i], { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.28 + i * 0.04);
        else tl.set(rows[i], { opacity: 1 }, 0.28 + VIS * 0.04);
      }

      // ---- "Flat List" (2.40): phone to the standard position, hero; kicker (2.55); hero bar (2.75) ----
      tl.to("#f01-phone", { x: 0, duration: 0.8, ease: "power3.inOut" }, 2.4);
      tl.fromTo("#f01-hero", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.4);
      tl.fromTo("#f01-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 2.55);
      tl.fromTo("#f01-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.65);
      tl.fromTo("#f01-hbar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 2.75);

      // ---- "scrolt vanzelf" (3.68): a finger drags up, the list scrolls 0 -> 440 dp ----
      var SCROLL = 440, IND_TRAVEL = 440 - 147, S0 = 3.72, SD = 1.0;
      touchDown("#f01-touch", 3.68);
      tl.to("#f01-content", { y: -SCROLL, duration: SD, ease: "power3.out" }, S0);
      // the finger moves along with the content, then lifts (the list keeps gliding)
      tl.to("#f01-touch", { y: -SCROLL, duration: SD, ease: "power3.out" }, S0);
      touchUp("#f01-touch", S0 + 0.22);
      tl.to("#f01-ind", { opacity: 1, duration: 0.15, ease: "power1.out" }, S0);
      tl.to("#f01-ind", { y: IND_TRAVEL * SCROLL / (30 * 44 - 440), duration: SD, ease: "power3.out" }, S0);
      tl.to("#f01-ind", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, S0 + SD + 0.5);

      // ---- "rendert" (4.96): statement ----
      tl.fromTo("#f01-stmt", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.96);

      // ---- "scherm" (6.80): a thin blue outline around the visible part of the list ----
      tl.fromTo("#f01-mark", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 6.8);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["01-hook"] = tl;
    })();
  </script>
