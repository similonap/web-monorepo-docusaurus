  <script>
    (function () {
      var DUR = 9.51;
      var CH = 14.4; // JetBrains Mono 24px advance
      var FS = 24, CW = 0.6, X0 = 0;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="03-renderitem"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // value change inside a line: old slides up and out, new slides in, wrapper width follows (0.25s)
      function swapVal(oldSel, newSel, wrapSel, chars, at) {
        tl.to(oldSel, { y: -14, opacity: 0, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(newSel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        tl.to(wrapSel, { width: chars * CH, duration: 0.25, ease: "power2.out" }, at);
      }
      function fadeSwap(outSel, inSel, at) {
        if (outSel) tl.to(outSel, { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        if (inSel) tl.to(inSel, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // type-on with a caret that steps per character (caret .ts-caret inside the .fx-row)
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      // ---- APP KIT helpers ----
      // box of an element in dp, relative to .ph-app (layout is measured once, before any tween)
      function dpBox(sel) {
        var el = q(sel), x = 0, y = 0, e = el;
        while (e && !e.classList.contains("ph-app")) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
        return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
      }
      // centre an absolutely placed element (touch, ring) on a dp box
      function placeOn(sel, b) { var el = q(sel); el.style.left = (b.x + b.w / 2) + "px"; el.style.top = (b.y + b.h / 2) + "px"; }
      // a finger press: touch fades and scales in (0.6 -> 1, 0.15s); on release it fades out (0.25s)
      function touchDown(sel, at) { tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, at); }
      function touchUp(sel, at) { tl.to(sel, { opacity: 0, duration: 0.25, ease: "power1.out" }, at); }
      // chip / label pop: opacity, y 10 -> 0, scale 0.96 -> 1
      function pop(sel, at) { tl.fromTo(sel, { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at); }
      // panel rows scroll together with the line numbers
      function scrollTo(nn, rows, at) { tl.to(["#f" + nn + "-lns", "#f" + nn + "-lines"], { y: -34 * rows, duration: 0.6, ease: "power3.inOut" }, at); }
      function intro(nn) {
        tl.fromTo("#f" + nn + "-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        tl.fromTo("#f" + nn + "-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#f" + nn + "-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      }
      // rows outside the 18-row window are hidden (not only clipped), by final row number
      function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }
      function rowEls(nn, idxs) { var r = root.querySelectorAll("#f" + nn + "-lines .fx-row"); return idxs.map(function (i) { return r[i - 1]; }); }
      function lnEls(nn, idxs) { var r = root.querySelectorAll("#f" + nn + "-lns > div"); return idxs.map(function (i) { return r[i - 1]; }); }
      function hideEls(els, at, dur) { if (dur) tl.to(els, { autoAlpha: 0, duration: dur, ease: "power1.inOut" }, at); else tl.set(els, { autoAlpha: 0 }, at); }
      function showEls(els, at, dur) { if (dur) tl.to(els, { autoAlpha: 1, duration: dur, ease: "power1.inOut" }, at); else tl.set(els, { autoAlpha: 1 }, at); }
      // ---- end APP KIT helpers ----
      // type-on of a row that already holds its (nested) markup: every character becomes a .ts-ch
      function typeIn(hostSel, caretSel, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var chars = [];
        (function walk(node) {
          Array.prototype.slice.call(node.childNodes).forEach(function (c) {
            if (c.nodeType === 3) {
              var frag = document.createDocumentFragment();
              for (var i = 0; i < c.textContent.length; i++) {
                var s = document.createElement("span");
                s.className = "ts-ch";
                s.textContent = c.textContent[i];
                frag.appendChild(s);
                chars.push(s);
              }
              node.replaceChild(frag, c);
            } else if (c.nodeType === 1) {
              walk(c);
            }
          });
        })(q(hostSel));
        var caret = q(caretSel), chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, n: chars.length };
      }

      // mark around the first person row, in device px (screen at 14, 39 inside the body; 1 dp = 1.4 px)
      var b1 = dpBox("#f03-p1");
      var pm = q("#f03-pmark");
      pm.setAttribute("x", 7); pm.setAttribute("y", (39 + b1.y * 1.4 - 3).toFixed(1));
      pm.setAttribute("width", 332); pm.setAttribute("height", (b1.h * 1.4 + 6).toFixed(1));

      intro("03");
      // window 17-34: rows 1-16 above, 35-36 below are hidden at rest
      tl.set(["#f03-lns", "#f03-lines"], { y: -34 * 16 }, 0);
      hideEls(rowEls("03", range(1, 16)).concat(lnEls("03", range(1, 16)), lnEls("03", [35, 36])), 0);
      // start: row 31 not there yet (rows 33-36 sit one row higher); the phone list is empty
      tl.set("#f03-below1", { y: -34 }, 0);
      tl.set(".f03-prow", { opacity: 0 }, 0);

      // ---- 0.0-1.9: "Render item" (0.00): row 31 opens, renderItem is typed ----
      tl.to("#f03-below1", { y: 0, duration: 0.35, ease: "power3.out" }, 0.0);
      hideEls(["#f03-r36"], 0.0, 0.2);
      typeIn("#f03-t31", "#f03-c31", 16, 0.1, 0.033);

      // ---- "functie" (1.28): wash on ({item}) => ----
      washOn("#f03-hl-fn", 1.28);

      // ---- "component teruggeeft" (3.16): wash on <PersonComponent item={item}/>; 3.48: rows in the phone ----
      washOff("#f03-hl-fn", 3.16);
      washOn("#f03-hl-comp", 3.16);
      tl.fromTo(".f03-prow", { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.12, immediateRender: false }, 3.48);

      // ---- "item mee" (5.04): wash on ({item}) in row 31 and on the props in row 17 ----
      washOff("#f03-hl-comp", 5.04);
      washOn("#f03-hl-arg, #f03-hl-a17", 5.04);

      // ---- "Person Component" (7.12): wash on rows 17-24; mark around the first row in the phone ----
      washOff("#f03-hl-arg, #f03-hl-a17", 7.12);
      washOn("#f03-hl-r17, #f03-hl-r18, #f03-hl-r19, #f03-hl-r20, #f03-hl-r21, #f03-hl-r22, #f03-hl-r23, #f03-hl-r24", 7.12);
      tl.to("#f03-pmark", { opacity: 1, duration: 0.3, ease: "power1.out" }, 7.12);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["03-renderitem"] = tl;
    })();
  </script>
