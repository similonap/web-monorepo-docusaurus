  <script>
    (function () {
      var DUR = 13.75;
      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 24;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="07-fetch"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // start state: helper rows 1-4 present but dimmed; real bars visible inside their (hidden) rows
      tl.set(["#f07f-l1", "#f07f-l2", "#f07f-l3", "#f07f-l4"], { opacity: 0.5 }, 0);
      tl.set(["#f07f-b1", "#f07f-b2", "#f07f-b3", "#f07f-b4", "#f07f-b5"], { opacity: 1 }, 0);

      // ---- Scene 1 (0.0-2.2): kicker; "fetch" (1.52) wash on fetch in row 2 ----
      tl.fromTo("#f07f-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f07f-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.to("#f07f-l2", { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.52);
      washOn("#f07f-hl-fetch", 1.52);
      washOff("#f07f-hl-fetch", 2.2);
      tl.to(["#f07f-l1", "#f07f-l3", "#f07f-l4"], { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.3);

      // ---- Scene 2 (2.2-5.8): "ids" (2.32) row 6; "map naar get post" (3.84-4.88) row 7; rows fade in at 4.88 ----
      typeLine("#f07f-l6", "#f07f-c6", [
        { t: "const", c: "ts-kw" },
        { t: " ids: " },
        { t: "number", c: "ts-type" },
        { t: "[]", c: "ts-punct" },
        { t: " = " },
        { t: "[", c: "ts-punct" },
        { t: "1", c: "ts-fn" }, { t: ",", c: "ts-punct" }, { t: " " },
        { t: "2", c: "ts-fn" }, { t: ",", c: "ts-punct" }, { t: " " },
        { t: "3", c: "ts-fn" }, { t: ",", c: "ts-punct" }, { t: " " },
        { t: "4", c: "ts-fn" }, { t: ",", c: "ts-punct" }, { t: " " },
        { t: "5", c: "ts-fn" },
        { t: "];", c: "ts-punct" }
      ], 0, 2.3, 0.0184);

      var l7 = typeLine("#f07f-l7", "#f07f-c7", [
        { t: "const", c: "ts-kw" },
        { t: " promises: " },
        { t: "Promise", c: "ts-type" },
        { t: "<", c: "ts-punct" },
        { t: "Post", c: "ts-type" },
        { t: ">[]", c: "ts-punct" },
        { t: " = " },
        { id: "f07f-hl-map", parts: [
          { t: "ids" },
          { t: ".", c: "ts-punct" },
          { t: "map", c: "ts-fn" },
          { t: "((", c: "ts-punct" },
          { t: "id" },
          { t: ")", c: "ts-punct" },
          { t: " " },
          { t: "=>", c: "ts-punct" },
          { t: " " },
          { t: "getPost", c: "ts-fn" },
          { t: "(", c: "ts-punct" },
          { t: "id" },
          { t: ")", c: "ts-punct" },
          { t: ")", c: "ts-punct" }
        ] },
        { t: ";", c: "ts-punct" }
      ], 0, 3.84, 0.0168);
      washOn("#f07f-hl-map", Math.max(4.40, l7.marks["f07f-hl-map"] + 0.05));

      tl.fromTo("#f07f-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.88);
      tl.fromTo(["#f07f-r1", "#f07f-r2", "#f07f-r3", "#f07f-r4", "#f07f-r5"],
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 4.88);
      tl.fromTo("#f07f-axis", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 5.24);
      washOff("#f07f-hl-map", 5.8);

      // ---- Scene 3 (5.8-7.9): "await promise punt all" (5.92-7.20) row 8 ----
      var l8 = typeLine("#f07f-l8", "#f07f-c8", [
        { t: "const", c: "ts-kw" },
        { t: " posts: " },
        { t: "Post", c: "ts-type" },
        { t: "[]", c: "ts-punct" },
        { t: " = " },
        { id: "f07f-hl-all", parts: [
          { t: "await", c: "ts-kw" },
          { t: " " },
          { t: "Promise", c: "ts-type" },
          { t: ".", c: "ts-punct" },
          { t: "all", c: "ts-fn" },
          { t: "(", c: "ts-punct" },
          { t: "promises" },
          { t: ")", c: "ts-punct" }
        ] },
        { t: ";", c: "ts-punct" }
      ], 0, 5.92, 0.0256);
      washOn("#f07f-hl-all", l8.marks["f07f-hl-all"] + 0.05);
      washOff("#f07f-hl-all", 7.9);

      // ---- Scene 4 (7.9-end): "vertrekken tegelijk" (8.24) all bars fill together ----
      // real time 0-230 ms over 8.24-9.10; each fill lasts in proportion to its length
      var T0 = 8.24, SPAN = 0.86, MAXMS = 230;
      var lens = [190, 230, 170, 210, 200];
      lens.forEach(function (ms, i) {
        tl.to("#f07f-f" + (i + 1), { scaleX: 1, duration: SPAN * ms / MAXMS, ease: "none" }, T0);
      });
      tl.set("#f07f-now", { x: 0 }, 0);
      tl.to("#f07f-now", { opacity: 1, duration: 0.15, ease: "power1.out" }, T0);
      tl.to("#f07f-now", { x: 430 * MAXMS / 1000, duration: SPAN, ease: "none" }, T0);

      // "dus" (10.08): ghost bars (one by one) fade in
      tl.to(["#f07f-g1", "#f07f-g2", "#f07f-g3", "#f07f-g4", "#f07f-g5"], { opacity: 1, duration: 0.4, ease: "power3.out" }, 10.08);

      // "vijf posts" (11.04): posts chip pops in with 5 posts
      tl.fromTo("#f07f-chip", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 11.04);
      tl.to("#f07f-chip", { backgroundColor: "#EAF2FB", borderColor: "#3178C6", duration: 0.4, ease: "power1.out" }, 11.04);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["07-fetch"] = tl;
    })();
  </script>
