      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="05-volgorde"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper (kept from the reference frame; this frame has no code panel) ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // ---- initial state ----
      gsap.set(["#f05v-b1", "#f05v-b2", "#f05v-b3"], { opacity: 1 });
      gsap.set("#f05v-b1", { scaleX: 1 / 3, transformOrigin: "left center" });
      gsap.set(["#f05v-card", "#f05v-tl", "#f05v-clock", "#f05v-reslabel", ".f05v-brk", ".f05v-cell"], { opacity: 0 });

      var path = q("#f05v-conn-path");
      var LEN = (path && path.getTotalLength) ? path.getTotalLength() : 1700;
      gsap.set(path, { strokeDasharray: LEN, strokeDashoffset: LEN });

      // ---- 0.0-1.7: kicker; "eerste vermenigvuldiging" (0.48): card with outlined bars (row 1 at 1 s) ----
      tl.fromTo("#f05v-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f05v-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo(["#f05v-card", "#f05v-tl", "#f05v-clock"], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.48);

      // ---- 1.7-4.7: "drie seconden" (1.76): row 1 grows to 3 s; 2.20-3.96 all fill together ----
      // side borders and corner radius are counter-scaled so the outline stays 2px while the bar grows
      var R0 = "18px 6px", R1 = "6px 6px";
      tl.fromTo("#f05v-b1",
        { scaleX: 1 / 3, borderLeftWidth: 6, borderRightWidth: 6, borderTopLeftRadius: R0, borderTopRightRadius: R0, borderBottomLeftRadius: R0, borderBottomRightRadius: R0 },
        { scaleX: 1, borderLeftWidth: 2, borderRightWidth: 2, borderTopLeftRadius: R1, borderTopRightRadius: R1, borderBottomLeftRadius: R1, borderBottomRightRadius: R1, duration: 0.5, ease: "power3.inOut" }, 1.76);

      var T0 = 2.20, T3 = 3.96, PER = (T3 - T0) / 3; // 0.587s of video per program second
      tl.fromTo("#f05v-f2", { scaleX: 0 }, { scaleX: 1, duration: PER, ease: "none" }, T0);
      tl.fromTo("#f05v-f3", { scaleX: 0 }, { scaleX: 1, duration: PER * 2, ease: "none" }, T0);
      tl.fromTo("#f05v-f1", { scaleX: 0 }, { scaleX: 1, duration: PER * 3, ease: "none" }, T0);
      tl.set("#f05v-now", { opacity: 1, x: 0 }, T0);
      tl.fromTo("#f05v-now", { x: 0 }, { x: 1320, duration: T3 - T0, ease: "none" }, T0);
      var clock = q("#f05v-clock");
      var tick = { v: 0 };
      tl.fromTo(tick, { v: 0 }, {
        v: 3, duration: T3 - T0, ease: "none",
        onUpdate: function () { clock.textContent = (Math.round(tick.v * 10) / 10).toFixed(1).replace(".", ",") + " s"; }
      }, T0);

      // done: row 2 (1 s), row 3 (2 s), row 1 (3 s) -> text + finish-order tag
      function done(txt, tag, at) {
        tl.fromTo(txt, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, at);
        tl.fromTo(tag, { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, at);
      }
      done("#f05v-t2", "#f05v-r2", T0 + PER);
      done("#f05v-t3", "#f05v-r3", T0 + PER * 2);
      done("#f05v-t1", "#f05v-r1", T3);
      tl.to("#f05v-now", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 4.3);

      // ---- 4.7-7.1: result block (5.04); "vier" (5.36): mark around 4 + connector ----
      tl.fromTo(["#f05v-reslabel", ".f05v-brk"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.04);
      tl.fromTo(["#f05v-c0", "#f05v-c1", "#f05v-c2"], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.13 }, 5.04);
      tl.fromTo("#f05v-mark4", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 5.36);
      tl.to(path, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 5.36);

      // ---- 7.1-end: "volgorde van de array" (8.40): index tags; "eerst" (10.48): 1e/2e/3e dim ----
      tl.fromTo(["#f05v-ci0", "#f05v-ci1", "#f05v-ci2"], { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.1 }, 8.40);
      tl.fromTo(["#f05v-i0", "#f05v-i1", "#f05v-i2"], { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.1 }, 8.40);
      tl.to(["#f05v-r1", "#f05v-r2", "#f05v-r3"], { opacity: 0.35, duration: 0.4, ease: "power2.inOut" }, 10.48);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["05-volgorde"] = tl;
    })();
  </script>
</template>
