  <script>
    (function () {
      var DUR = 13.67;
      var CW = 0.6; // JetBrains Mono advance (em)
      var FS = 26;
      var X0 = 76;
      var WASH = "rgba(49, 120, 198, 0.12)";
      var CLEAR = "rgba(49, 120, 198, 0)";
      var root = document.querySelector('[data-composition-id="02-probleem"]');
      var q = function (s) { return root.querySelector(s); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- type-on helper: appends to a line from column `col`, caret steps per char ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // track width in px (x 1366-1840 = 0-3 s)
      var TW = 474;
      var SEC = TW / 3;

      // initial states (code panel present at t = 0; timeline comes in with the first bar)
      gsap.set(["#f02p-label", "#f02p-tl"], { opacity: 0 });
      gsap.set(["#f02p-bar1", "#f02p-bar2", "#f02p-bar3"], { opacity: 0 });
      gsap.set(["#f02p-fill1", "#f02p-fill2", "#f02p-fill3"], { scaleX: 0 });
      gsap.set(["#f02p-txt1", "#f02p-txt2", "#f02p-txt3"], { opacity: 0 });
      gsap.set("#f02p-now", { opacity: 0, x: 0 });
      gsap.set("#f02p-bracket", { opacity: 0, y: 6 });
      gsap.set("#f02p-note", { opacity: 0, y: 10 });

      // ---- Scene 1 (0.0-1.7): kicker; "geneste then's" (0.64) wash on the three .then( ----
      tl.fromTo("#f02p-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f02p-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);

      washOn(["#f02p-hl-then1", "#f02p-hl-then2", "#f02p-hl-then3"], 0.64);
      washOff(["#f02p-hl-then1", "#f02p-hl-then2", "#f02p-hl-then3"], 1.6);

      // ---- Scene 2 (1.7-7.3): bars run one after the other ----
      // "tweede" (1.76): wash on row 2; timeline in; bar 1 appears and fills 1.76-4.12
      washOn("#f02p-w2", 1.76);
      tl.to("#f02p-label", { opacity: 1, duration: 0.4, ease: "power3.out" }, 1.76);
      tl.to("#f02p-tl", { opacity: 1, duration: 0.4, ease: "power3.out" }, 1.76);
      tl.to("#f02p-bar1", { opacity: 1, duration: 0.3, ease: "power3.out" }, 1.76);
      tl.to("#f02p-now", { opacity: 1, duration: 0.2, ease: "power1.out" }, 1.76);
      tl.to("#f02p-fill1", { scaleX: 1, duration: 4.12 - 1.76, ease: "none" }, 1.76);
      tl.to("#f02p-now", { x: SEC, duration: 4.12 - 1.76, ease: "none" }, 1.76);

      // "klaar" (4.12): bar 1 = 4; bar 2 appears and fills 4.12-6.08
      tl.to("#f02p-txt1", { opacity: 1, duration: 0.3, ease: "power3.out" }, 4.12);
      tl.to("#f02p-bar2", { opacity: 1, duration: 0.3, ease: "power3.out" }, 4.12);
      tl.to("#f02p-fill2", { scaleX: 1, duration: 6.08 - 4.12, ease: "none" }, 4.12);
      tl.to("#f02p-now", { x: 2 * SEC, duration: 6.08 - 4.12, ease: "none" }, 4.12);

      // "derde" (5.28): wash moves from row 2 to row 3
      washOff("#f02p-w2", 5.28);
      washOn("#f02p-w3", 5.28);

      // "na" (6.08): bar 2 = 9; bar 3 appears and fills 6.08-7.40; = 16 at 7.40
      tl.to("#f02p-txt2", { opacity: 1, duration: 0.3, ease: "power3.out" }, 6.08);
      tl.to("#f02p-bar3", { opacity: 1, duration: 0.3, ease: "power3.out" }, 6.08);
      tl.to("#f02p-fill3", { scaleX: 1, duration: 7.40 - 6.08, ease: "none" }, 6.08);
      tl.to("#f02p-now", { x: 3 * SEC, duration: 7.40 - 6.08, ease: "none" }, 6.08);
      washOff("#f02p-w3", 7.3);
      tl.to("#f02p-txt3", { opacity: 1, duration: 0.3, ease: "power3.out" }, 7.40);
      tl.to("#f02p-now", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 7.6);

      // ---- Scene 3 (7.3-end): "drie seconden" (8.64) bracket; "helemaal niet nodig" (11.84) note ----
      tl.to("#f02p-bracket", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.64);
      tl.to("#f02p-note", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 11.84);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["02-probleem"] = tl;
    })();
  </script>
