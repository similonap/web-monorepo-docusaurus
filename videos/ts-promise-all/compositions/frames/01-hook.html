      var tl = gsap.timeline({ paused: true });

      // ---- shared helpers (not all used in this frame) ----
      function typeLine(lineSel, caretSel, segments, col, start, per, lead) {
        if (lead === undefined) lead = 0.1;
        var line = q(lineSel);
        var caret = q(caretSel);
        var chars = [];
        var marks = {};
        segments.forEach(function (seg) {
          var host = line;
          if (seg.id) {
            host = document.createElement("span");
            host.className = "ts-hl";
            host.id = seg.id;
            line.appendChild(host);
            marks[seg.id] = start + chars.length * per;
          }
          (seg.parts || [{ t: seg.t, c: seg.c }]).forEach(function (p) {
            for (var i = 0; i < p.t.length; i++) {
              var s = document.createElement("span");
              s.className = "ts-ch" + (p.c ? " " + p.c : "");
              s.textContent = p.t[i];
              host.appendChild(s);
              chars.push(s);
            }
          });
        });
        var chPx = FS * CW;
        tl.set(chars, { opacity: 0 }, 0);
        tl.set(caret, { opacity: 1, x: X0 + col * chPx }, start - lead);
        chars.forEach(function (el, i) {
          var at = start + i * per;
          tl.to(el, { opacity: 1, duration: 0.05, ease: "power1.out" }, at);
          tl.set(caret, { x: X0 + (col + i + 1) * chPx }, at);
        });
        var end = start + chars.length * per;
        tl.set(caret, { opacity: 0 }, end);
        return { end: end, col: col + chars.length, marks: marks };
      }

      function washOn(sel, at) { tl.to(sel, { backgroundColor: WASH, duration: 0.35, ease: "power1.out" }, at); }
      function washOff(sel, at) { tl.to(sel, { backgroundColor: CLEAR, duration: 0.4, ease: "power1.inOut" }, at); }

      // ---- initial states ----
      // bars are outlined (opacity 1) inside their rows; the rows / lane groups carry the reveal
      gsap.set(["#f01h-a-bar1", "#f01h-a-bar2", "#f01h-a-bar3", "#f01h-b-bar1", "#f01h-b-bar2", "#f01h-b-bar3"], { opacity: 1 });
      gsap.set(["#f01h-a-r1", "#f01h-a-r2", "#f01h-a-r3", "#f01h-a-axis", "#f01h-a-title", "#f01h-a-clock",
        "#f01h-b-group", "#f01h-b-clock", "#f01h-b-mark", "#f01h-hero"], { opacity: 0 });
      gsap.set("#f01h-hbar", { scaleX: 0, transformOrigin: "left center" });
      gsap.set(["#f01h-a-now", "#f01h-b-now"], { x: 0 });

      // ---- 0.0-3.2: kicker; "Drie berekeningen" (0.32): lane A rows (outlined bars); "één seconde" (1.76): axis ----
      tl.fromTo("#f01h-kbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo("#f01h-ktext", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo(["#f01h-a-r1", "#f01h-a-r2", "#f01h-a-r3"], { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.15 }, 0.32);
      tl.fromTo("#f01h-a-axis", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.76);

      // ---- 3.2-6.0: "Na elkaar" (3.28): title; bars fill one after the other; "bezig" (5.04): clock 3,0 s ----
      tl.fromTo("#f01h-a-title", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.28);
      tl.set("#f01h-a-now", { opacity: 1 }, 3.4);
      tl.to("#f01h-a-now", { x: 3 * PPS, duration: 1.65, ease: "none" }, 3.4);
      [["1", 3.4], ["2", 3.95], ["3", 4.5]].forEach(function (b) {
        tl.to("#f01h-a-fill" + b[0], { scaleX: 1, duration: 0.55, ease: "none" }, b[1]);
        tl.to("#f01h-a-txt" + b[0], { opacity: 1, duration: 0.25, ease: "power1.out" }, b[1] + 0.55);
      });
      tl.fromTo("#f01h-a-clock", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.04);

      // ---- 6.0-end: "promise punt all" (6.24): hero; lane B (6.4); fill together 7.70-8.25; "klaar" (8.72): clock + mark ----
      tl.fromTo("#f01h-hero", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 6.24);
      tl.to("#f01h-hbar", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 6.5);
      tl.fromTo("#f01h-b-group", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.4);
      tl.set("#f01h-b-now", { opacity: 1 }, 7.7);
      tl.to("#f01h-b-now", { x: PPS, duration: 0.55, ease: "none" }, 7.7);
      tl.to(["#f01h-b-fill1", "#f01h-b-fill2", "#f01h-b-fill3"], { scaleX: 1, duration: 0.55, ease: "none" }, 7.7);
      tl.to(["#f01h-b-txt1", "#f01h-b-txt2", "#f01h-b-txt3"], { opacity: 1, duration: 0.25, ease: "power1.out" }, 8.25);
      tl.fromTo("#f01h-b-clock", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.72);
      tl.fromTo("#f01h-b-mark", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 8.72);

      // hold still to full duration
      tl.set({}, {}, DUR);
      window.__timelines["01-hook"] = tl;
    })();
  </script>
